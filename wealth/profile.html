<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>You · Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    /* Dot tokens. Light only: Dot has no dark mode. */
    :root {
      --canvas: #FBF8F2;
      --surface: #FFFCF7;
      --blush: #F4DED9;
      --vermilion: #C84335;
      --pressed: #A9372E;
      --ink: #2B2522;
      --ink-2: color-mix(in srgb, #2B2522 66%, #FBF8F2);
      --hairline: #D9CEC6;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      margin: 0; background: var(--canvas); color: var(--ink);
      font: 400 15px/24px var(--sans); -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--vermilion); text-decoration: none; }
    a:hover { color: var(--pressed); }
    :focus-visible { outline: 2px solid var(--vermilion); outline-offset: 4px; border-radius: 4px; }
    input:focus-visible, select:focus-visible { outline: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .page { width: min(1080px, 100%); margin: 0 auto; padding: 16px 24px 64px; }
    .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; }
    .lang { display: flex; }
    .lang button {
      min-width: 44px; min-height: 44px; border: 0; background: none; cursor: pointer;
      font: 500 13px var(--mono); color: var(--ink-2);
    }
    .lang button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--vermilion); text-underline-offset: 6px; text-decoration-thickness: 2px; }

    h1 { margin: 24px 0 0; font: 700 44px/48px var(--sans); letter-spacing: -.045em; }
    h1 .dot { color: var(--vermilion); }

    .cols { display: grid; grid-template-columns: minmax(0, 640px) 320px; justify-content: space-between; gap: 64px; align-items: start; }
    .side { position: sticky; top: 24px; }

    /* one dominant fact */
    .worth { margin-top: 40px; }
    .worth .label { color: var(--ink-2); }
    .worth .figure { margin: 0; font: 600 56px/64px var(--sans); letter-spacing: -.035em; overflow-wrap: anywhere; }
    .worth .ccy { font: 500 15px var(--mono); letter-spacing: 0; margin-left: 8px; color: var(--ink-2); vertical-align: 6px; }
    .worth .quiet { margin-top: 0; }
    .quiet { font-size: 13px; line-height: 16px; color: var(--ink-2); }
    .mono { font-family: var(--mono); }

    .known { margin: 24px 0 0; font-size: 13px; line-height: 24px; color: var(--ink-2); }
    .known b { font-weight: 500; color: var(--ink); }
    .known a { white-space: nowrap; }

    .groups { display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; margin-top: 40px; }
    .group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 8px; border-bottom: 1.5px solid var(--ink); }
    h2 { margin: 0; font: 600 17px/24px var(--sans); letter-spacing: -.01em; }
    .headline { font: 600 20px/24px var(--sans); letter-spacing: -.02em; white-space: nowrap; }
    .headline .per { font-size: 13px; font-weight: 400; color: var(--ink-2); }

    .row {
      display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--hairline);
      background: none; padding: 12px 0; min-height: 56px; cursor: pointer; color: var(--ink);
    }
    .row:hover .val { text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px; }
    .val { display: block; font: 600 17px/24px var(--sans); letter-spacing: -.01em; overflow-wrap: anywhere; }
    .row .quiet { display: block; margin-top: 4px; }
    .fact.stale .val { color: var(--ink-2); font-weight: 500; }
    .fact.stale .row { border-bottom: 0; padding-bottom: 0; min-height: 0; }
    .ask { display: flex; align-items: center; gap: 0; padding-bottom: 4px; border-bottom: 1px solid var(--hairline); font-size: 13px; }
    .ask .quiet { margin-right: 8px; }
    .ask::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--vermilion); margin-right: 8px; }
    .text-btn {
      min-height: 44px; padding: 0 8px; border: 0; background: none; cursor: pointer;
      color: var(--vermilion); font-size: 15px; line-height: 24px; font-weight: 500;
    }
    .text-btn:hover { color: var(--pressed); }
    .text-btn.ink { color: var(--ink); }
    .ask .text-btn:first-of-type { padding-left: 0; }
    .text-btn:disabled { color: var(--ink-2); cursor: not-allowed; }
    .add { display: flex; width: 100%; align-items: center; min-height: 56px; padding: 0; border-bottom: 1px solid var(--hairline); }
    .more { padding-left: 0; }
    .bar { display: block; height: 2px; background: var(--hairline); margin-top: 8px; }
    .bar > span { display: block; height: 2px; background: var(--ink); }

    .btn {
      min-height: 48px; padding: 0 24px; border-radius: 8px; border: 1.5px solid var(--vermilion);
      background: var(--vermilion); color: var(--surface); font: 600 15px var(--sans); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:hover { background: var(--pressed); border-color: var(--pressed); color: var(--surface); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 12px; padding: 16px 0; border-bottom: 1px solid var(--hairline); }
    .editor .full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); min-width: 0; }
    .field input, .field select {
      min-height: 44px; width: 100%; min-width: 0; padding: 0 12px; border: 1px solid var(--hairline);
      border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px;
    }
    .field input:focus, .field select:focus { border-color: var(--ink); outline: none; }
    .editor .actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
    .err { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink); }
    .err:empty { display: none; }

    /* tickets: ruled typographic objects */
    section.part { margin-top: 64px; }
    .side > .part:first-child { margin-top: 40px; }
    .ticket { border-top: 1.5px solid var(--ink); }
    .line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; min-height: 48px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
    .line .k { color: var(--ink-2); min-width: 0; }
    .line .v { font: 500 15px/24px var(--mono); white-space: nowrap; text-align: right; }
    .line .v small { display: block; font-size: 13px; line-height: 16px; color: var(--ink-2); }
    .line.total .k { color: var(--ink); font-weight: 600; }
    .line.total { border-bottom: 1.5px solid var(--ink); }
    .line .grow { flex: 1; min-width: 0; }
    .line .name { display: block; color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
    table.ticket { display: block; width: 100%; border-spacing: 0; }
    table.ticket tbody { display: block; }
    table.ticket tr { display: flex; }
    table.ticket th { text-align: left; font-weight: 400; }

    .switch { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 16px 0 8px -8px; }
    .switch button { flex: none; min-height: 44px; padding: 0 8px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 15px; }
    .switch button[aria-selected="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--vermilion); text-decoration-thickness: 2px; text-underline-offset: 8px; }
    h3 { margin: 32px 0 8px; font: 600 15px/24px var(--sans); }

    .upcoming { list-style: none; margin: 8px 0 0; padding: 0; }
    .upcoming { border-top: 1.5px solid var(--ink); }
    .upcoming li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
    .upcoming time { font: 400 13px/24px var(--mono); color: var(--ink-2); }


    .empty-line { margin: 16px 0 0; }
    .lead { margin-top: 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
    .lead p { margin: 0; font-size: 17px; line-height: 24px; }

    dialog {
      width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); border: 1px solid var(--hairline); border-radius: 8px;
      padding: 24px; background: var(--surface); color: var(--ink);
    }
    dialog::backdrop { background: rgba(43, 37, 34, .24); }
    dialog .close { position: absolute; top: 8px; right: 8px; }
    dialog .big { margin: 0 0 24px; font: 600 28px/32px var(--sans); letter-spacing: -.025em; overflow-wrap: anywhere; padding-right: 40px; }
    dialog .label { color: var(--ink-2); padding-right: 64px; }
    dialog .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 16px; }
    dialog .acts .text-btn { padding: 0; }
    dialog h3:first-of-type { margin-top: 24px; }

    #status { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 12px 16px; border-radius: 8px; font-size: 13px; z-index: 5; }
    #status:empty { display: none; }

    @media (max-width: 900px) {
      .cols { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .side { position: static; }
    }
    @media (max-width: 420px) {
      .page { padding: 8px 24px 64px; }
      .worth .figure { font-size: 48px; }
    }
  </style>
</head>

    const root = document.getElementById('root');
    const sheet = document.getElementById('sheet');
    const statusEl = document.getElementById('status');
    let lang = 'en', locale = 'en-US', data = null, token = '', writes = true;
    let adding = null, editingRow = null, allocTab = 'asset_class', statusTimer = null;
    const expanded = new Set();

    // ------------------------------------------------------------ helpers (DOM only; never innerHTML)
    function t(key, vars) {
      const text = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
      return vars ? text.replace(/\{(\w+)\}/g, (_, k) => String(vars[k] ?? '')) : text;
    }
    const has = key => Object.prototype.hasOwnProperty.call(I18N.en, key);
    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'style') Object.assign(el.style, v);
        else el.setAttribute(k, v === true ? '' : String(v));

      return append(el, kids);
    }
    function append(el, kids) {
      for (const kid of kids.flat(Infinity)) {
        if (kid === null || kid === undefined || kid === false || kid === '') continue;
        el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));

      return el;
    }
    function fill(el, ...kids) { el.replaceChildren(); return append(el, kids); }
    const isNum = v => typeof v === 'number' && Number.isFinite(v);
    const minus = text => text.replace(/-/g, '−');  // negatives in ink with a true minus sign, never red
    function money(amount, currency, opts = {}) {
      if (!isNum(amount)) return null;
      const digits = Math.abs(amount) >= 1000 || Number.isInteger(amount) ? 0 : 2;
      let text;
      try {
        text = new Intl.NumberFormat(locale, { style: 'currency', currency: currency || 'XXX', currencyDisplay: 'narrowSymbol',

      } catch (_) { text = new Intl.NumberFormat(locale, { maximumFractionDigits: digits }).format(amount); }
      return minus(currency && !opts.bare ? `${text} ${currency}` : text);
    }
    const num = (v, d = 0) => isNum(v) ? minus(new Intl.NumberFormat(locale, { maximumFractionDigits: d }).format(v)) : null;
    const pct = (v, signed) => isNum(v) ? minus(new Intl.NumberFormat(locale, { style: 'percent', maximumFractionDigits: 1, signDisplay: signed ? 'exceptZero' : 'auto' }).format(v)) : null;
    const asDate = iso => { const d = new Date(String(iso).slice(0, 10) + 'T00:00:00Z'); return Number.isNaN(d.getTime()) ? null : d; };
    function day(iso) { const d = asDate(iso); return d ? new Intl.DateTimeFormat(locale, { dateStyle: 'medium', timeZone: 'UTC' }).format(d) : ''; }
    function monthYear(iso) { const d = asDate(iso); return d ? new Intl.DateTimeFormat(locale, { month: 'short', year: 'numeric', timeZone: 'UTC' }).format(d) : ''; }
    function short(iso) {
      const d = asDate(iso), now = asDate(data?.today);
      if (!d) return '';
      const sameYear = now && d.getUTCFullYear() === now.getUTCFullYear();
      return new Intl.DateTimeFormat(locale, { day: 'numeric', month: 'short', ...(sameYear ? {} : { year: 'numeric' }), timeZone: 'UTC' }).format(d);

    function daysSince(iso) {
      const d = asDate(iso), today = asDate(data?.today);
      return d && today ? Math.round((today - d) / 86400000) : 0;
    }
    function ago(iso) {
      const d = asDate(iso), today = asDate(data?.today);
      if (!d || !today) return '';
      const days = Math.round((today - d) / 86400000);
      const rtf = new Intl.RelativeTimeFormat(locale, { numeric: 'auto' });
      if (days < 14) return rtf.format(-days, 'day');
      if (days < 60) return rtf.format(-Math.round(days / 7), 'week');
      if (days < 730) return rtf.format(-Math.round(days / 30.4), 'month');
      return rtf.format(-Math.round(days / 365), 'year');
    }
    function announce(message) {
      statusEl.textContent = message;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 3600);
    }
    const labelOf = e => !e.derived && has('l_' + (e.field || e.key)) ? t('l_' + (e.field || e.key)) : e.label;

    const per = (e, period) => (period === 'month' || (!period && /^monthly_/.test(e.field || ''))) ? t('perMonth') : period === 'year' ? t('perYear') : '';
    const plural = n => new Intl.PluralRules(locale).select(Number(n));
    function currencyName(code) {
      try { return cap(new Intl.DisplayNames([locale], { type: 'currency' }).of(code)); } catch (_) { return code; }
    }
    function assetClass(name) {
      const k = 'ac_' + String(name).toLowerCase().replace(/\s+/g, '_');
      return has(k) ? t(k) : cap(String(name));
    }
    const cap = text => text ? text.charAt(0).toLocaleUpperCase(locale) + text.slice(1) : text;
    function valueText(e) {
      const v = e.value;
      switch (e.editor) {
        case 'amount': return (money(Number(v.amount), v.currency) ?? String(v.amount)) + per(e, v.period);
        case 'number':
          if (e.field === 'reserve_months') return t('months', { n: num(v, 1) });
          if (e.field === 'dependents') return t(plural(v) === 'one' ? 'dependent_one' : 'dependent_other', { n: num(v) });
          return e.currency ? money(v, e.currency) + per(e) : num(v, 4);
        case 'bool': return v ? t('yes') : '—';
        case 'list': return e.field === 'currencies' ? v.map(currencyName).join(', ') : v.join(', ');
        case 'text':
          if (e.key === 'preference.risk' && has('risk_' + String(v).toLowerCase())) return t('risk_' + String(v).toLowerCase());
          return String(v);  // the person's own words stay as written
        case 'goal': return String(v.name ?? e.label);
        case null: case undefined:
          if (e.derived) return money(v?.amount, v?.currency) ?? t('unknown');
          break;
        default:
          if (v?.type === 'household') return t('householdValue', { p: num(v.positions), a: num(v.accounts) });
          return v?.type === 'list' ? t('items', { n: num(v.items) }) : t('fieldsN', { n: num(v?.fields) });
      }
    }
    function quietText(e) {
      if (e.editor === 'goal') {
        const g = e.value;
        const target = g.target_amount !== undefined ? money(Number(g.target_amount), g.currency) : t('unknownTarget');
        const when = g.due ? t('by', { d: day(g.due) }) : null;
        return [target, when, isNum(e.funded_ratio) ? t('funded', { p: pct(e.funded_ratio) }) : null].filter(Boolean).join(' · ');
      }
      // Provenance only when it informs: another source, or an observation 30+ days old.
      const days = daysSince(e.observed_on);
      return [labelOf(e), e.source !== 'you_said' ? t('src_' + e.source) : null, days >= 30 ? ago(e.observed_on) : null].filter(Boolean).join(' · ');
    }

    // ------------------------------------------------------------ network
    async function load() {
      try {
        const state = await fetch('/api/state', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
        token = String(state.csrf_token || '');
        const response = await fetch('/api/profile', { credentials: 'same-origin' });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || t('loadError'));
        data = body;
        if (data.writes === false) writes = false;
        render();
      } catch (error) {
        fill(root, h('p', { class: 'empty-line', text: error instanceof Error ? error.message : t('loadError') }));
      } finally { root.setAttribute('aria-busy', 'false'); }
    }
    async function post(path, payload) {
      if (!writes) { announce(t('writesOff')); return false; }
      const response = await fetch(path, {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-Wealth-Token': token },
        body: JSON.stringify({ ...payload, expected_revision: data?.client?.revision ?? null })
      }).catch(() => null);
      if (!response) { announce(t('loadError')); return false; }
      const body = await response.json().catch(() => ({}));
      if ([404, 405, 501].includes(response.status)) { writes = false; if (sheet.open) sheet.close(); render(); announce(t('writesOff')); return false; }
      if (response.status === 409) { adding = editingRow = null; if (sheet.open) sheet.close(); await load(); announce(t('conflict')); return false; }
      if (!response.ok) return body.error || String(response.status);
      if (body?.profile?.version) data = body.profile; else await load();
      return true;
    }
    const factPath = key => '/api/facts/' + encodeURIComponent(key);

    // ------------------------------------------------------------ editors
    function currencies(current) {
      return [...new Set([current, data.reporting_currency, 'MXN', 'USD', 'EUR', 'CAD'].filter(c => typeof c === 'string' && /^[A-Z]{3}$/.test(c)))];
    }
    function editorForm({ kind, value, onSave, onCancel, label }) {
      const inputs = {};
      const err = h('p', { class: 'err', role: 'alert' });
      const input = (name, text, attrs, full) => {
        inputs[name] = h('input', { name, ...attrs });
        return h('label', { class: 'field' + (full ? ' full' : '') }, text, inputs[name]);
      };
      const select = (name, text, options) => {
        inputs[name] = h('select', { name }, options.map(([v, l, sel]) => h('option', { value: v, text: l, selected: sel })));
        return h('label', { class: 'field' }, text, inputs[name]);
      };
      const ccy = cur => select('currency', t('currency'), currencies(cur).map(c => [c, c, c === (cur || data.reporting_currency)]));
      let fields;
      if (kind === 'amount') fields = [input('amount', t('amount'), { type: 'number', min: '0', step: 'any', inputmode: 'decimal', value: value?.amount ?? '' }), ccy(value?.currency)];
      else if (kind === 'number') fields = [input('value', label || t('number'), { type: 'number', min: '0', step: 'any', value: value ?? '' }, true)];
      else if (kind === 'list') fields = [input('value', `${label || t('value')} · ${t('commaHelp')}`, { type: 'text', value: (value || []).join(', '), autocomplete: 'off' }, true)];
      else if (kind === 'risk') fields = [select('value', label || t('value'), [['', t('choose'), true], ...['low', 'moderate', 'high'].map(r => [r, t('risk_' + r), false])])];
      else if (kind === 'goal') fields = [input('name', t('goalName'), { type: 'text', value: value?.name ?? '', autocomplete: 'off' }, true),
        input('target_amount', t('goalTarget'), { type: 'number', min: '0', step: 'any', value: value?.target_amount ?? '' }), ccy(value?.currency),
        input('due', t('goalDue'), { type: 'date', value: value?.due ?? '' })];
      else if (kind === 'bool') fields = [select('value', label || t('value'), [['true', t('yes'), value === true], ['false', '—', value === false]])];
      else fields = [input('value', label || t('value'), { type: 'text', value: value ?? '', autocomplete: 'off' }, true)];
      const form = h('form', { class: 'editor', 'aria-label': label || t('edit'),
        onsubmit: async e => {
          e.preventDefault();
          let out;
          if (kind === 'amount') out = inputs.amount.value === '' ? null : { amount: inputs.amount.value, currency: inputs.currency.value, ...(value?.period ? { period: value.period } : {}) };
          else if (kind === 'goal') out = inputs.name.value.trim() ? { name: inputs.name.value, target_amount: inputs.target_amount.value, currency: inputs.currency.value, due: inputs.due.value } : null;
          else if (kind === 'bool') out = inputs.value.value === 'true';
          else out = inputs.value.value.trim() === '' ? null : inputs.value.value;
          if (out === null) { onCancel(); return; }  // blank stays unknown, never zero
          const result = await onSave(out);
          if (result !== true) err.textContent = typeof result === 'string' ? result : '';
        } },
        fields, err,
        h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'submit', text: t('save') }),
          h('button', { class: 'text-btn ink', type: 'button', text: t('cancel'), onclick: onCancel })));
      requestAnimationFrame(() => form.querySelector('input, select')?.focus());

    }
    const ADD_KIND = { income: 'amount', spending: 'amount', savings: 'amount', investments: 'amount', debts: 'amount',
      dependents: 'number', tax_residence: 'list', currencies: 'list', goals: 'goal', risk: 'risk' };
    async function saveAdd(field, value) {
      const form = { [field]: ['income', 'spending'].includes(field) ? { ...value, period: 'month' } : value };
      const result = await post('/api/profile/form', { form });
      if (result === true) { adding = null; render(); announce(t('saved')); }

    }
    async function act(entry, action, value) {

    // ------------------------------------------------------------ detail sheet (fetched on tap)
    async function openSheet(entry) {
      const detail = await fetch(factPath(entry.key), { credentials: 'same-origin' })
        .then(r => r.ok ? r.json() : null).catch(() => null);
      let mode = 'view';
      const draw = () => {
        const line = (k, v, mono) => h('div', { class: 'line' }, h('span', { class: 'k', text: k }),

        let actions;
        if (mode === 'edit') actions = editorForm({ kind: entry.editor, value: entry.value, label: labelOf(entry),
          onSave: v => act(entry, 'edit', v), onCancel: () => { mode = 'view'; draw(); } });

          h('button', { class: 'text-btn ink', type: 'button', text: t('keep'), onclick: () => { mode = 'view'; draw(); } }));
        else if (entry.derived) actions = h('div', { class: 'acts' },
          h('a', { class: 'text-btn', style: { display: 'inline-flex', alignItems: 'center', padding: 0 }, href: '/?draft=statement', text: t('upload') }));
        else actions = h('div', { class: 'acts' },
          entry.editor && writes ? h('button', { class: 'text-btn', type: 'button', text: t('edit'), style: { paddingLeft: 0 }, onclick: () => { mode = 'edit'; draw(); } })
            : h('span', { class: 'quiet', text: writes ? t('structured') : t('writesOff') }),
          writes ? h('button', { class: 'text-btn ink', type: 'button', text: t('forget'), onclick: () => { mode = 'forget'; draw(); } }) : null);
        const ov = data.overview || {};

          h('div', { class: 'label', id: 'sheet-title', text: entry.editor === 'goal' ? t('g_goals') : labelOf(entry) }),
          h('div', { class: 'big', text: valueText(entry) }),
          entry.editor === 'goal' ? h('p', { class: 'quiet', style: { margin: '-16px 0 24px' }, text: quietText(entry) }) : null,
          holdings ? [renderHoldings(ov, draw), h('h3', { text: t('source') })] : null,
          h('div', { class: 'ticket' }, lines), actions);
      };
      draw();
      if (!sheet.open) sheet.showModal();
    }

    // ------------------------------------------------------------ render
    function render() {

        h('a', { href: '#add-' + k, text: t('f_' + k), onclick: e => { e.preventDefault(); adding = k; render(); document.getElementById('add-' + k)?.scrollIntoView({ block: 'center' }); } })]));

    function renderGroups() {

    // ------------------------------------------------------------ boot
    function setLang(next, persist) {

      document.documentElement.lang = lang === 'es' ? 'es-MX' : 'en';
      if (persist) { try { localStorage.setItem('wealth.lang', lang); } catch (_) { /* optional */ } }
      document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      document.getElementById('back').textContent = t('chat');
      if (data) render();
    }
    document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang, true)));
    let stored = null;
    try { stored = localStorage.getItem('wealth.lang'); } catch (_) { /* optional */ }
    setLang(stored || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en'), false);
    load().then(() => { if (!stored && typeof data?.locale === 'string' && data.locale.toLowerCase().startsWith('es')) setLang('es', false); });
  })();
  </script>
</body>
</html>
