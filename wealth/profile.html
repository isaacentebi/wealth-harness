<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>You · Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:ital,wght@0,400;0,500;1,400&display=swap">
  <style>
    /* Dot tokens. Light only: Dot has no dark mode. */
    :root {
      --canvas: #FBF8F2;
      --surface: #FFFCF7;
      --blush: #F4DED9;
      --vermilion: #C84335;
      --pressed: #A9372E;
      --ink: #2B2522;
      --ink-2: color-mix(in srgb, #2B2522 66%, #FBF8F2);
      --ink-3: color-mix(in srgb, #2B2522 50%, #FBF8F2);
      --hairline: #D9CEC6;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      margin: 0; background: var(--canvas); color: var(--ink);
      font: 400 15px/24px var(--sans); -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    button, input, select { font: inherit; color: inherit; }
    a { color: var(--vermilion); text-decoration: none; }
    a:hover { color: var(--pressed); }
    :focus-visible { outline: 2px solid var(--vermilion); outline-offset: 4px; border-radius: 4px; }
    input:focus-visible, select:focus-visible { outline: none; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    .page { width: min(1120px, 100%); margin: 0 auto; padding: 16px 24px 96px; }
    .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 15px; }
    .lang { display: flex; }
    .lang button {
      min-width: 44px; min-height: 44px; border: 0; background: none; cursor: pointer;
      font: 500 13px var(--mono); color: var(--ink-2);
    }
    .lang button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--vermilion); text-underline-offset: 6px; text-decoration-thickness: 2px; }

    h1 { margin: 24px 0 0; font: 700 44px/48px var(--sans); letter-spacing: -.045em; }
    h1 .dot { color: var(--vermilion); }

    /* A reading column (≤ 62ch of 18px Inter) and the side rail. */
    .cols { display: grid; grid-template-columns: minmax(0, 620px) 300px; justify-content: space-between; gap: 64px; align-items: start; }
    .side { position: sticky; top: 24px; }

    /* one dominant fact */
    .worth { margin-top: 40px; }
    .worth .label { color: var(--ink-2); }
    .worth .figure { margin: 0; font: 600 56px/64px var(--sans); letter-spacing: -.035em; overflow-wrap: anywhere; }
    .worth .ccy { font: 500 15px var(--mono); letter-spacing: 0; margin-left: 8px; color: var(--ink-2); vertical-align: 6px; }
    .quiet { font-size: 13px; line-height: 16px; color: var(--ink-2); }
    .mono { font-family: var(--mono); }

    /* ---------------------------------------------------------- the notes */
    .notes { margin-top: 64px; }
    .notes > h2 { margin: 0; font: 600 13px/16px var(--sans); letter-spacing: .02em; color: var(--ink-2); }
    .v { font-weight: 600; color: var(--ink); }
    .say { margin: 0; font: 400 18px/28px var(--sans); letter-spacing: -.011em; color: var(--ink); text-wrap: pretty; }

    .area { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--hairline); }
    .area:first-of-type { margin-top: 24px; }
    .area h3 { margin: 0; font: 500 13px/16px var(--sans); letter-spacing: .01em; color: var(--ink-2); }
    .summary { margin: 12px 0 0; font: 400 24px/32px var(--sans); letter-spacing: -.022em; color: var(--ink); text-wrap: balance; }
    .facts { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 24px; }

    .fact-say {
      display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; cursor: pointer;
      font: 400 18px/28px var(--sans); letter-spacing: -.011em; color: var(--ink); text-wrap: pretty;
    }
    .fact-say:hover .v { text-decoration: underline; text-decoration-color: var(--hairline); text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
    .fact.guess .fact-say { color: var(--ink-2); }
    .fact.guess .fact-say .v { color: var(--ink); }
    .cue { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; margin-top: 4px; min-height: 24px; }
    .cue-btn {
      padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
      font: 400 13px/20px var(--mono); color: var(--ink-3); letter-spacing: -.01em;
    }
    .cue-btn:hover { color: var(--ink); }
    .cue-btn em { font-style: italic; }
    .cue-btn[disabled] { cursor: default; color: var(--ink-3); }
    /* 44px targets without 44px of visual weight */
    .cue-btn, .txt { position: relative; }
    .cue-btn::after, .txt::after { content: ""; position: absolute; inset: -12px -4px; }
    .txt {
      padding: 0; border: 0; background: none; cursor: pointer; min-height: 24px;
      font: 500 15px/24px var(--sans); color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline);
      text-underline-offset: 4px; text-decoration-thickness: 1px;
    }
    .txt:hover { text-decoration-color: currentColor; }
    .txt.act { color: var(--vermilion); text-decoration-color: color-mix(in srgb, var(--vermilion) 35%, transparent); }
    .txt.act:hover { color: var(--pressed); }
    .txt.small { font-size: 13px; line-height: 20px; }
    .txt:disabled { color: var(--ink-3); cursor: not-allowed; }
    .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 16px; }

    /* stated vs statement: the one card on the page */
    .card { margin-top: 40px; padding: 20px 24px 24px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px; }
    .origin { margin: 0 0 8px; font: 400 12px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

    /* worth a quick check */
    .check { margin-top: 40px; }
    .check h2 { margin: 0; font: 600 13px/16px var(--sans); letter-spacing: .02em; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
    .check h2::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--vermilion); }
    .check ol { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 24px; }

    /* inline edit */
    .edit { margin-top: 12px; }
    .amount-row { display: flex; gap: 8px; align-items: stretch; max-width: 360px; }
    .money-input { flex: 1; min-width: 0; display: flex; align-items: center; border-bottom: 1.5px solid var(--ink); }
    .money-input span { font: 600 20px/28px var(--sans); color: var(--ink-2); padding-right: 2px; }
    .money-input input {
      flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; padding: 0;
      font: 600 20px/28px var(--sans); letter-spacing: -.015em; color: var(--ink);
    }
    .money-input .unit { font: 400 15px var(--sans); color: var(--ink-2); padding-left: 8px; }
    .amount-row select {
      min-height: 44px; border: 0; border-bottom: 1.5px solid var(--hairline); background: transparent; padding: 0 4px;
      font: 500 13px var(--mono); color: var(--ink);
    }
    .money-input:focus-within { border-bottom-color: var(--vermilion); }
    .edit .acts { margin-top: 16px; }
    .edit .push { margin-left: auto; }
    .err { margin: 8px 0 0; font-size: 13px; color: var(--ink); }
    .err:empty { display: none; }

    .btn {
      min-height: 44px; padding: 0 20px; border-radius: 8px; border: 1.5px solid var(--vermilion);
      background: var(--vermilion); color: var(--surface); font: 600 15px var(--sans); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn:hover { background: var(--pressed); border-color: var(--pressed); color: var(--surface); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .unknown { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--hairline); }
    .unknown .say { color: var(--ink-2); }
    .unknown .acts { margin-top: 8px; }

    .lead { margin-top: 48px; }
    .lead .say { font-size: 24px; line-height: 32px; letter-spacing: -.022em; max-width: 24ch; }
    .lead .acts { margin-top: 24px; gap: 16px 24px; }

    /* tickets: ruled typographic objects (side rail, sheet) */
    section.part { margin-top: 64px; }
    .side > .part:first-child { margin-top: 40px; }
    .part h2 { margin: 0; font: 600 17px/24px var(--sans); letter-spacing: -.01em; }
    .ticket { border-top: 1.5px solid var(--ink); }
    .line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; min-height: 48px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
    .line .k { color: var(--ink-2); min-width: 0; }
    .line .v { font: 500 15px/24px var(--mono); white-space: nowrap; text-align: right; }
    .line .v small { display: block; font-size: 13px; line-height: 16px; color: var(--ink-2); }
    .line.total .k { color: var(--ink); font-weight: 600; }
    .line.total { border-bottom: 1.5px solid var(--ink); }
    .line .grow { flex: 1; min-width: 0; }
    .line .name { display: block; color: var(--ink); font-weight: 500; overflow-wrap: anywhere; }
    table.ticket { display: block; width: 100%; border-spacing: 0; }
    table.ticket tbody { display: block; }
    table.ticket tr { display: flex; }
    table.ticket th { text-align: left; font-weight: 400; }
    .bar { display: block; height: 2px; background: var(--hairline); margin-top: 8px; }
    .bar > span { display: block; height: 2px; background: var(--ink); }
    .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 8px; }

    .switch { display: flex; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 16px 0 8px -8px; }
    .switch button { flex: none; min-height: 44px; padding: 0 8px; border: 0; background: none; cursor: pointer; color: var(--ink-2); font-size: 15px; }
    .switch button[aria-selected="true"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-decoration-color: var(--vermilion); text-decoration-thickness: 2px; text-underline-offset: 8px; }
    h4 { margin: 32px 0 8px; font: 600 15px/24px var(--sans); }

    .upcoming { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1.5px solid var(--ink); }
    .upcoming li { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--hairline); }
    .upcoming time { font: 400 13px/24px var(--mono); color: var(--ink-2); }

    dialog {
      width: min(560px, calc(100% - 32px)); max-height: calc(100% - 32px); border: 1px solid var(--hairline); border-radius: 8px;
      padding: 24px; background: var(--surface); color: var(--ink);
    }
    dialog::backdrop { background: rgba(43, 37, 34, .24); }
    dialog .close { position: absolute; top: 20px; right: 24px; }
    dialog .say { margin: 32px 0 24px; font-size: 20px; line-height: 28px; }
    dialog .acts { margin-top: 16px; }

    /* status and undo */
    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 5;
      display: flex; align-items: center; gap: 16px; max-width: calc(100% - 32px);
      background: var(--ink); color: var(--surface); padding: 8px 8px 8px 16px; border-radius: 8px; font-size: 15px;
    }
    #toast:empty { display: none; }
    #toast .txt { color: var(--surface); text-decoration-color: color-mix(in srgb, var(--surface) 45%, transparent); padding: 0 8px; min-height: 36px; }
    #toast p { margin: 4px 8px 4px 0; }

    @media (max-width: 960px) {
      .cols { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .side { position: static; }
    }
    @media (max-width: 420px) {
      .page { padding: 8px 24px 96px; }
      .worth .figure { font-size: 48px; line-height: 56px; }
      .summary { font-size: 22px; line-height: 30px; }
      .card { padding: 16px 16px 20px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .fact.gone { animation: fade .2s ease-out; }
      @keyframes fade { from { opacity: 0; } }
    }
  </style>
</head>

        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <main id="root" aria-busy="true"></main>
  </div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
  (() => {

    const I18N = {

        freshStatement: 'Sube un estado de cuenta más reciente', notHere: 'Cámbialo en el chat.',
        writesOff: 'Aún no se puede editar aquí. Díselo a Wealth en el chat.', conflict: 'Tu perfil cambió. Se recargó; inténtalo de nuevo.',
        comingUp: 'Pendiente', up_review: 'Revisar', up_decision: 'Decisión', up_decision_review: 'Revisar decisión',
        returns: 'Rendimiento', twr: 'Ponderado por tiempo', irr: 'Ponderado por dinero', vs: 'Diferencia', annual: '{v} anual',
        noReturns: 'Aún no hay suficiente historial.', flowsMissing: 'Faltan los depósitos y retiros entre estados de cuenta.',

      }
    };
    const root = document.getElementById('root');
    const sheet = document.getElementById('sheet');
    const toast = document.getElementById('toast');
    let lang = 'en', locale = 'en-US', data = null, token = '', writes = true, allocTab = 'account', toastTimer = null;
    let editing = null;            // id of the sentence being edited in place
    const hidden = new Set();      // sentences forgotten but still undoable
    let pending = null;            // { item, timer } — the delete waiting out its undo window

    // ------------------------------------------------------------ helpers (DOM only; never innerHTML)
    function t(key, vars) {
      const text = (I18N[lang] && I18N[lang][key]) ?? I18N.en[key] ?? key;
      return vars ? text.replace(/\{(\w+)\}/g, (_, k) => String(vars[k] ?? '')) : text;
    }
    const has = key => Object.prototype.hasOwnProperty.call(I18N.en, key);
    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'style') Object.assign(el.style, v);
        else el.setAttribute(k, v === true ? '' : String(v));
      }
      return append(el, kids);
    }
    function append(el, kids) {
      for (const kid of kids.flat(Infinity)) {
        if (kid === null || kid === undefined || kid === false || kid === '') continue;
        el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
      }
      return el;
    }
    function fill(el, ...kids) { el.replaceChildren(); return append(el, kids); }
    const isNum = v => typeof v === 'number' && Number.isFinite(v);
    const minus = text => text.replace(/-/g, '−');
    function money(amount, currency, opts = {}) {
      if (!isNum(amount)) return null;
      const digits = Math.abs(amount) >= 1000 || Number.isInteger(amount) ? 0 : 2;
      let text;
      try {
        text = new Intl.NumberFormat(locale, { style: 'currency', currency: currency || 'XXX', currencyDisplay: 'narrowSymbol',
          maximumFractionDigits: digits, minimumFractionDigits: 0 }).format(amount);
      } catch (_) { text = new Intl.NumberFormat(locale, { maximumFractionDigits: digits }).format(amount); }
      return minus(currency && !opts.bare ? `${text} ${currency}` : text);
    }
    const num = (v, d = 0) => isNum(v) ? minus(new Intl.NumberFormat(locale, { maximumFractionDigits: d }).format(v)) : null;
    const pct = (v, signed) => isNum(v) ? minus(new Intl.NumberFormat(locale, { style: 'percent', maximumFractionDigits: 1, signDisplay: signed ? 'exceptZero' : 'auto' }).format(v)) : null;
    const asDate = iso => { const d = new Date(String(iso).slice(0, 10) + 'T00:00:00Z'); return Number.isNaN(d.getTime()) ? null : d; };

      return new Intl.DateTimeFormat(locale, { day: 'numeric', month: lang === 'es' ? 'long' : 'short', ...(sameYear ? {} : { year: 'numeric' }), timeZone: 'UTC' }).format(d);
    }
    function ago(days) {

    // ------------------------------------------------------------ network
    async function load() {

          const state = await fetch('/api/state', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
          token = String(state.csrf_token || '');
        }
        const response = await fetch('/api/profile?lang=' + lang, { credentials: 'same-origin' });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || t('loadError'));

    }
    async function post(path, payload) {

        body: JSON.stringify({ ...payload, expected_revision: data?.client?.revision ?? null })
      }).catch(() => null);
      if (!response) { say(t('loadError')); return false; }
      const body = await response.json().catch(() => ({}));
      if ([404, 405, 501].includes(response.status)) { writes = false; if (sheet.open) sheet.close(); render(); say(t('writesOff')); return false; }
      if (response.status === 409) { editing = null; if (sheet.open) sheet.close(); await load(); say(t('conflict')); return false; }
      if (!response.ok) return body.error || String(response.status);

    }
    const factPath = key => '/api/facts/' + encodeURIComponent(key);
    async function act(key, action, field, value) {
      const result = await post(factPath(key), { action, field: field ?? null, value });
      if (result === true) {
        editing = null;
        if (sheet.open) sheet.close();

    }
    // The value an edit spec sends: an amount with its currency, or a count.
    const editValue = (spec, amount, currency) => spec.kind === 'number' ? Number(amount)

    // ------------------------------------------------------------ forget, with a five-second undo
    function forget(item) {
      if (!writes) { say(t('writesOff')); return; }

      hidden.add(item.text);
      editing = null;
      if (sheet.open) sheet.close();
      render();
      const undo = h('button', { class: 'txt', type: 'button', text: t('undo'), onclick: () => {
        clearTimeout(pending?.timer); pending = null; hidden.delete(item.text); toast.replaceChildren(); render();
        document.querySelector(`[data-say="${CSS.escape(item.id)}"]`)?.focus();
      } });
      say(t('forgetting'), undo);
      pending = { item, timer: setTimeout(commitForget, 5000) };
    }
    async function commitForget() {
      if (!pending) return;
      const { item, timer } = pending;
      clearTimeout(timer);

      hidden.delete(item.text);
      render();
      if (result !== true && result !== false) say(String(result));
    }
    window.addEventListener('pagehide', () => { if (pending) {
      navigator.sendBeacon?.(factPath(pending.item.key), new Blob([JSON.stringify({ action: 'delete', field: pending.item.forget?.field ?? null,
        expected_revision: data?.client?.revision ?? null })], { type: 'application/json' }));
    } });

    // ------------------------------------------------------------ inline edit
    function currencies(current) {
      return [...new Set([current, data.reporting_currency, 'MXN', 'USD', 'EUR', 'CAD'].filter(c => typeof c === 'string' && /^[A-Z]{3}$/.test(c)))];
    }
    function editor(item, spec, { onDone, allowForget = true } = {}) {

        value: isNum(spec.amount) ? new Intl.NumberFormat(locale, { maximumFractionDigits: 2 }).format(spec.amount) : '' });
      const ccy = spec.kind === 'amount' ? h('select', { 'aria-label': t('currency') },
        currencies(spec.currency).map(c => h('option', { value: c, text: c, selected: c === (spec.currency || data.reporting_currency) }))) : null;
      const close = () => { editing = null; onDone?.(); render(); document.querySelector(`[data-say="${CSS.escape(item.id)}"]`)?.focus(); };
      const form = h('form', { class: 'edit', 'aria-label': item.text,
        onsubmit: async e => {
          e.preventDefault();
          const amount = Number(input.value.replace(/[^\d.,-]/g, '').replace(/,/g, ''));
          if (input.value.trim() === '' || !Number.isFinite(amount) || amount < 0) { err.textContent = t('amount'); input.focus(); return; }
          const result = await act(item.key, 'edit', spec.field, editValue(spec, amount, ccy?.value));
          if (result === true) onDone?.();
          else if (typeof result === 'string') err.textContent = result;
        } },
        h('div', { class: 'amount-row' },
          h('label', { class: 'money-input' }, spec.kind === 'amount' ? h('span', { 'aria-hidden': 'true', text: '$' }) : null, input,
            spec.unit === 'months' ? h('span', { class: 'unit', text: t('months') }) : null),

          h('button', { class: 'btn', type: 'submit', text: t('save') }),
          h('button', { class: 'txt', type: 'button', text: t('cancel'), onclick: close }),
          allowForget && item.forget ? h('button', { class: 'txt push', type: 'button', text: t('forget'), onclick: () => forget(item) }) : null));

    // ------------------------------------------------------------ provenance, told quietly
    function cueText(item) {
      const o = item.origin || {};
      const parts = [];
      if (o.kind === 'statement') {

        if (o.as_of) parts.push(t('o_asof', { d: short(o.as_of) }));
      } else parts.push(t('o_' + (o.kind || 'calculated')));

    function cue(item) {

        (lt.rows || []).length ? [h('h4', { text: t('throughFunds') }),
          ruled(t('throughFunds'), lt.rows.map(r => tr(r.instrument === 'unidentified' ? t('unidentified') : String(r.instrument),
            r.direct > 0 ? t('directVia', { a: money(r.direct, ov.currency), b: money(r.via_funds, ov.currency) }) : null, money(r.total, ov.currency))))] : null);
    }

    // ------------------------------------------------------------ boot
    function setLang(next, persist) {
      lang = next === 'es' ? 'es' : 'en';
      const nav = navigator.language || 'en-US';
      locale = lang === 'es' ? 'es-MX' : (nav.toLowerCase().startsWith('en') ? nav : 'en-US');
      document.documentElement.lang = lang === 'es' ? 'es-MX' : 'en';
      if (persist) { try { localStorage.setItem('wealth.lang', lang); } catch (_) { /* optional */ } }
      document.querySelectorAll('#lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
      document.getElementById('back').textContent = t('chat');
      editing = null;
      if (data && data.memory && data.memory[lang]) render();
      else if (data) load();  // sentences come from the server in the page's language
    }
    document.querySelectorAll('#lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang, true)));
    let stored = null;
    try { stored = localStorage.getItem('wealth.lang'); } catch (_) { /* optional */ }
    setLang(stored || ((navigator.language || '').toLowerCase().startsWith('es') ? 'es' : 'en'), false);
    load().then(() => { if (!stored && !(navigator.language || '').toLowerCase().startsWith('es') && typeof data?.locale === 'string' && data.locale.toLowerCase().startsWith('es')) setLang('es', false); });
  })();
  </script>
</body>
</html>
