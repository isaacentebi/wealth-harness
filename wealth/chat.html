        later.addEventListener('click', () => hoyAck('snooze', item.id, line));
        const x = el('button', 'hoy-x');
        x.type = 'button';
        x.setAttribute('aria-label', HOY.dismiss(title));
        x.append(svg('M7 7l10 10M17 7 7 17', 14));
        x.addEventListener('click', () => hoyAck('dismiss', item.id, line));
        line.append(later, x);
        return line;
      }
      // Touch: one quiet "⋯" opens Later and Dismiss in a row under this line (one line open at a time).
      const more = el('button', 'hoy-more', '⋯');
      more.type = 'button';
      more.setAttribute('aria-label', HOY.more(title));
      more.setAttribute('aria-expanded', 'false');
      const acts = el('div', 'hoy-acts');
      acts.id = `hoy-acts-${index}`;
      more.setAttribute('aria-controls', acts.id);
      const snooze = el('button', '', HOY.later);
      snooze.type = 'button';
      snooze.setAttribute('aria-label', HOY.laterLabel(title));
      snooze.addEventListener('click', () => hoyAck('snooze', item.id, line));
      const drop = el('button', '', HOY.dismissText);
      drop.type = 'button';
      drop.setAttribute('aria-label', HOY.dismiss(title));
      drop.addEventListener('click', () => hoyAck('dismiss', item.id, line));
      acts.append(snooze, drop);
      more.addEventListener('click', () => {
        const open = !line.classList.contains('open');
        hoyClose(line);
        line.classList.toggle('open', open);
        more.setAttribute('aria-expanded', String(open));
      });
      line.addEventListener('keydown', event => {
        if (event.key === 'Escape' && line.classList.contains('open')) { event.preventDefault(); hoyClose(); more.focus(); }
      });
      line.append(more, acts);
      return line;
    }
    let hoyItems = [];
    hoyTouch.addEventListener('change', () => hoyRender(hoyItems));  // the controls follow the input, one set at a time

    function hoyRender(items) {
      hoyItems = Array.isArray(items) ? items : [];
      const shown = hoyItems.slice(0, 3);
      if (!shown.length) { if (hoyNode) hoyNode.remove(); hoyNode = null; return; }
      if (!hoyNode) {
        hoyNode = el('section', 'hoy');
        hoyNode.setAttribute('aria-label', HOY.region);
        form.before(hoyNode);
      }
      const list = el('ul');
      const lines = shown.map((item, i) => hoyLine(item, i));
      list.append(...lines);
      hoyNode.replaceChildren(list);
      // On touch the lines stay under ~30% of the screen: past that, two show and the rest wait behind "n more".
      if (hoyTouch.matches && lines.length > 2 && hoyNode.getBoundingClientRect().height > window.innerHeight * HOY_SHARE) {
        const hidden = lines.slice(2);
        hidden.forEach(li => { li.hidden = true; });
        const rest = el('li');
        const button = el('button', 'hoy-rest', HOY.rest(hidden.length));
        button.type = 'button';
        button.addEventListener('click', () => { hidden.forEach(li => { li.hidden = false; }); rest.remove(); hidden[0].querySelector('.hoy-go').focus(); });
        rest.append(button);
        list.append(rest);
      }
    }

    async function hoyAck(action, id, line) {
      line.hidden = true;
      try {
        const data = await json(await api('/api/today', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ [action]: id, timezone: timezone() })
        }));
        hoyRender(data.items);
        const first = hoyNode && hoyNode.querySelector('.hoy-go');
        if (first) first.focus(); else if (!coarse.matches) input.focus();
      } catch (_) {
        line.hidden = false;
        live.textContent = HOY.failed;
      }
    }

    // Other pages hand the chat a prompt through sessionStorage (never the address): prefilled, or sent.
    function takeHandoff() {
      let item = null;
      try { item = JSON.parse(sessionStorage.getItem('wealth.handoff') || 'null'); sessionStorage.removeItem('wealth.handoff'); } catch (_) { return; }
      const text = item && typeof item.text === 'string' ? item.text.trim().slice(0, 2000) : '';
      if (!text) return;
      if (item.send && !busy) { submit(text); return; }
      input.value = text;
      resize();
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }

    // Loaded before the conversation is drawn (briefly), so the lines arrive without moving what is on screen.
    async function startToday(state) {
      setTimeout(takeHandoff, 0);
      const setupFlow = (state.onboarding || {}).active && state.onboarding.mode === 'flow';
      if (setupFlow) return;  // the setup cards own the screen; a resumed setup hides the lines through CSS
      const load = api(`/api/today?tz=${encodeURIComponent(timezone() || '')}`).then(json).then(data => hoyRender(data.items)).catch(() => {});
      await Promise.race([load, new Promise(resolve => setTimeout(resolve, 700))]);
    }

    // ------------------------------------------------------------------ start

    // The profile is a sibling view; show its link only when the server has it.
    async function revealProfile() {
      try {
        const response = await fetch('/profile', { credentials: 'same-origin', cache: 'no-store' });
        profileLink.hidden = !response.ok;
      } catch (_) { profileLink.hidden = true; }
    }

    async function initialize() {
      localizeChrome();
      let state;
      try {
        state = await refreshToken();
        if (!token) throw new Error(state.error || 'Could not load your session.');
        if (!askedLang && (state.language === 'es' || state.language === 'en') && state.language !== LANG) {
          // Match the language they set Wealth up in, not only the browser's.
          const url = new URL(location.href);
          url.searchParams.set('lang', state.language);
          location.replace(url.toString());
          return;
        }
      } catch (err) {
        const box = el('div', 'fatal');
        box.setAttribute('role', 'alert');
        box.append(el('h2', '', T.offlineTitle));
        const p = el('p');
        T.offlineText.split(/(`[^`]+`)/).forEach(part => {
          p.append(part.startsWith('`') ? el('code', '', part.slice(1, -1)) : document.createTextNode(part));
        });
        box.append(p);
        messages.append(box);
        return;
      }
      if (state.display_name) document.title = `Wealth · ${state.display_name}`;
      if (state.uploads && state.uploads.max_bytes) uploadLimit = state.uploads.max_bytes;
      const level = form.querySelector(`input[name="depth"][value="${state.reasoning}"]`);
      if (level) level.checked = true;
      refreshDepth();
      revealProfile();
      await startToday(state);

      const history = Array.isArray(state.messages) ? state.messages : [];
      const onboarding = state.onboarding || {};
      const flow = onboarding.active && onboarding.mode === 'flow';
      if (!history.length && !(state.turn && (state.turn.message || state.turn.internal)) && !flow) renderIntro(state);
      let spoken = LANG;
      let lastUser = null;
      // An unfinished message offers Retry only while it was not asked again later.
      const askedLater = index => history.slice(index + 1).some(m => m && m.role === 'user' && m.content === history[index].content);
      const again = (record, index) => (!record || askedLater(index)) ? null : () => submit(record.text, record.attachments, record.node);
      history.forEach((item, index) => {
        if (!item || typeof item.content !== 'string') return;
        if (item.role === 'user') {
          const node = userMessage(item.content, item.attachments || []);
          spoken = languageOf(item.content);
          lastUser = { text: item.content, attachments: item.attachments || [], node, index };
          if (item.status === 'failed') showError(node, { kind: 'unanswered', message: T.errors.unanswered }, again(lastUser, index));
          if (item.status === 'stopped') showError(node, { kind: 'stoppedEarly', message: T.errors.stoppedEarly }, again(lastUser, index));
        } else if (item.role === 'assistant') {
          const retry = item.status === 'stopped' && lastUser ? again(lastUser, lastUser.index) : null;
          assistantMessage(item.content, { memory: item.memory, message: item, lang: spoken, views: item.views,
                                           stopped: item.status === 'stopped', retry });
        }
      });

      input.disabled = false;
      attachButton.disabled = false;
      newChat.disabled = false;
      depthToggle.disabled = false;

      if (flow) startSetup(onboarding, state);
      loadOrders();

      const turn = state.turn;
      if (turn && (turn.message || turn.internal)) {
        // The reveal's request is Wealth's own and never shows as the person's words.
        const node = turn.internal ? messages.appendChild(el('div')) : userMessage(turn.message, turn.attachments || []);
        const record = { id: turn.id, message: turn.message, attachments: turn.attachments || [], userNode: node, after: 0, elapsed: turn.elapsed, lang: turn.internal ? LANG : languageOf(turn.message), internal: !!turn.internal };
        const retry = retryFor(record);
        if (turn.status === 'running') {
          current = record;
          setBusy(true);
          record.pendingNode = pendingMessage(turn.progress ? turn.progress : 'Response in progress', record.lang,
                                              Date.now() - Math.max(0, Number(turn.elapsed) || 0) * 1000);
          if (!turn.progress) record.pendingNode._step.textContent = STRINGS[record.lang].inProgress;
          track(record);
        } else if (turn.error) {
          showError(node, turn.error, retry);
        }
      }
      resize();
      follow(true);
      if (!coarse.matches && !busy && !flow) input.focus();
    }

    initialize();
  })();
  </script>
</body>
</html>
