<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    /* Dot design language: light only, flat paper, hairlines that separate, one vermilion primary. */
    :root {
      --canvas: #FBF8F2;
      --surface: #FFFCF7;
      --blush: #F4DED9;
      --vermilion: #C84335;
      --pressed: #A9372E;
      --cobalt: #4358C7;           /* live information only: the working state */
      --ink: #2B2522;
      --ink-soft: #4A413C;         /* warm-ink tints for secondary text */
      --muted: #6E625B;
      --hairline: #D9CEC6;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --column: 44rem;
      --gutter: 24px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: var(--canvas);
      font: 400 16px/24px var(--sans);
      font-feature-settings: "cv11", "ss01";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
    .text-control:focus-visible { outline-offset: -2px; }
    .send:focus-visible { outline-offset: 3px; border-radius: 8px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- frame ---------- */

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .column { width: min(var(--column), 100%); margin: 0 auto; padding: 0 var(--gutter); }

    .topbar { padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; }
    .topbar.scrolled { border-bottom-color: var(--hairline); }

    .topbar .column {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
    }

    .wordmark {
      flex: 1;
      margin: 0;
      font: 600 17px/1 var(--sans);
      letter-spacing: -.01em;
    }

    .text-control {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }
    .text-control:last-child { margin-right: -8px; }
    .text-control:hover:not(:disabled) { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 6px; }
    .text-control:disabled { opacity: .45; cursor: default; }
    .text-control[hidden] { display: none; }

    .conversation {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--hairline) transparent;
    }

    .conversation .column { padding-top: 24px; padding-bottom: 32px; }

    .messages { display: flex; flex-direction: column; gap: 32px; }

    /* ---------- turns ---------- */

    .message { animation: arrive .24s cubic-bezier(.2, .7, .2, 1); min-width: 0; }

    /* The user's turn hugs the right; a failure under it spans the full column, like any reply. */
    .message.user { display: flex; flex-direction: column; align-items: flex-end; }
    .message.user > .bubble, .message.user > .attachments { max-width: min(85%, 34rem); }
    .message.user > .alert { align-self: stretch; }

    .message.user .bubble {
      padding: 11px 16px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer { color: var(--ink); overflow-wrap: break-word; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 12px; }
    .answer h2, .answer h3, .answer h4, .answer h5 {
      margin: 32px 0 8px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -.01em;
    }
    .answer h2 { font-size: 20px; }
    .answer h3 { font-size: 17px; }
    .answer h4, .answer h5 { font-size: 16px; }
    .answer ul, .answer ol { margin: 0 0 16px; padding-left: 20px; }
    .answer li { margin: 4px 0; padding-left: 4px; }
    .answer li::marker { color: var(--muted); }
    .answer ol li::marker { font-variant-numeric: tabular-nums; }
    .answer strong { font-weight: 600; }
    .answer a, .message.user a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: var(--hairline);
    }
    .answer a:hover { text-decoration-color: var(--ink); }
    .answer hr { border: 0; border-top: 1px solid var(--hairline); margin: 24px 0; }

    .answer code {
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--blush);
      font: .875em/1.4 var(--mono);
    }

    .answer pre {
      margin: 0 0 16px;
      padding: 12px 16px;
      overflow-x: auto;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .answer pre code { padding: 0; background: none; font-size: 13px; line-height: 1.6; }

    .answer blockquote {
      margin: 0 0 16px;
      padding: 0 0 0 16px;
      border-left: 1.5px solid var(--hairline);
      color: var(--ink-soft);
    }

    .answer .provenance { color: var(--muted); font: 400 12px/1.5 var(--mono); }

    /* Ticket: a two-column table read as ruled label / value rows. */
    .ticket {
      margin: 0 0 16px;
      padding: 4px 16px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .ticket dl { margin: 0; }
    .ticket .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 11px;
      border-top: 1px solid var(--hairline);
    }
    .ticket .row:first-child { border-top: 0; }
    .ticket .caption { padding: 12px 0 8px; color: var(--muted); font-size: 13px; }
    .ticket .caption + .row { border-top: 1px solid var(--hairline); }
    .ticket dt { min-width: 0; color: var(--ink-soft); font-size: 15px; line-height: 24px; }
    .ticket dd { margin: 0; text-align: right; font-size: 15px; overflow-wrap: anywhere; }
    .ticket dd.num { font: 400 15px/24px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ticket .row.total { border-top: 1.5px solid var(--ink); margin-top: 4px; }
    .ticket .row.total dt, .ticket .row.total dd { color: var(--ink); font-weight: 600; }
    .ticket .row.total dd.num { font-weight: 500; }

    /* Multi-column tables stay typographic: hairline rows, right-aligned tabular numbers. */
    .table-wrap { margin: 0 0 16px; overflow-x: auto; }
    .answer table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .answer th, .answer td {
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid var(--hairline);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .answer th:last-child, .answer td:last-child { padding-right: 0; }
    .answer td:first-child, .answer th:first-child { white-space: normal; min-width: 7rem; }
    .answer tbody tr:last-child td { border-bottom: 0; }
    .answer td:has(a) { white-space: normal; min-width: 6rem; }   /* a linked reference wraps instead of clipping */
    .answer th {
      padding-top: 0;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--ink);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    .answer .num { text-align: right; }
    .answer .center { text-align: center; }

    /* Assumptions sit on plain surface; missing inputs on a quiet blush plane. */
    .callout {
      margin: 0 0 16px;
      padding: 16px 16px 4px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      font-size: 15px;
    }
    .callout[data-kind="missing"] { border-color: transparent; background: var(--blush); }
    .callout > :is(h2, h3, h4, h5):first-child {
      margin: 0 0 8px;
      color: var(--ink);
      font: 600 15px/1.4 var(--sans);
      letter-spacing: 0;
    }
    .callout ul, .callout ol { margin-bottom: 12px; }

    /* Remembering: one quiet line. */
    .memory {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* Citations: a quiet numbered mark in the text; the sources themselves open under the message. */
    .answer a.cite {
      position: relative;
      padding: 15px 16px;          /* 44px hit area around a 12px numeral; margins give the space back */
      margin: 0 -14px 0 -15px;
      color: var(--muted);
      font: 500 11px/1 var(--sans);
      font-variant-numeric: tabular-nums;
      vertical-align: super;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .answer a.cite:hover, .answer a.cite[aria-expanded="true"] { color: var(--ink); }
    .answer a.cite:focus-visible { outline: none; }
    .answer a.cite:focus-visible::after {
      content: ""; position: absolute; inset: 11px 12px; border-radius: 4px; outline: 2px solid var(--ink);
    }

    .sources {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--hairline);
      counter-reset: source;
    }
    .sources[hidden] { display: none; }
    .sources li { counter-increment: source; border-bottom: 1px solid var(--hairline); }
    .sources a {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      column-gap: 8px;
      min-height: 44px;
      padding: 10px 0;
      color: var(--ink);
      text-decoration: none;
    }
    .sources a::before {
      content: counter(source);
      grid-row: span 2;
      color: var(--muted);
      font: 500 12px/20px var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .sources li.current a::before { color: var(--ink); }
    .sources .domain { color: var(--muted); font: 400 12px/20px var(--mono); overflow-wrap: anywhere; }
    .sources .title { font-size: 15px; line-height: 20px; overflow-wrap: anywhere; }
    .sources a:hover .title { text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 3px; }

    .attachments { display: flex; flex-wrap: wrap; gap: 8px; }
    .message.user .attachments { justify-content: flex-end; margin-bottom: 8px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      font-size: 14px;
    }
    .chip svg { color: var(--muted); flex: none; }
    .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14rem; }
    .chip .meta { color: var(--muted); font: 400 12px var(--mono); white-space: nowrap; }
    .chip.error { background: var(--blush); border-color: transparent; }
    .chip.error .meta { color: var(--ink-soft); font-family: var(--sans); }
    .chip button {
      display: grid; place-items: center;
      width: 44px; height: 44px; margin: 0 -12px 0 -8px;
      padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted);
    }
    .chip button:hover { color: var(--ink); }

    /* ---------- presence and worktrace ---------- */

    .presence { display: block; flex: none; width: 24px; height: 24px; }
    /* Only the cobalt live element moves: the channel feeds the housing, the seam breathes. */
    .presence .channel { transform-box: fill-box; transform-origin: 0 50%; animation: feed 1.2s cubic-bezier(.45, 0, .25, 1) infinite alternate; }
    .presence .seam { animation: seam 1.8s ease-in-out infinite; }

    /* Same 24px line box as the answer's first line, so nothing moves when the answer replaces it. */
    .worktrace {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 24px;
    }
    .worktrace .step { color: var(--ink-soft); font-size: 16px; line-height: 24px; min-width: 0; }

    /* ---------- failure: statement, cause, recovery ---------- */

    .alert {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 0 12px;
      margin-top: 8px;
      padding: 16px 16px 4px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      line-height: 24px;
      text-align: left;
    }
    .alert.quiet { grid-template-columns: minmax(0, 1fr); }
    .alert p { margin: 0; text-wrap: pretty; }
    .alert code { font: .875em var(--mono); }
    .alert .detail { grid-column: -2 / -1; color: var(--muted); font-size: 13px; }
    .alert .detail summary { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; margin-left: -8px; cursor: pointer; list-style: none; }
    .alert .detail summary::-webkit-details-marker { display: none; }
    .alert .detail summary:hover { color: var(--ink); }
    .alert .detail code { display: block; margin-bottom: 8px; font: 400 12px/1.5 var(--mono); overflow-wrap: anywhere; }
    .alert button {
      grid-column: -2 / -1;
      justify-self: start;
      min-height: 44px;
      margin-left: -8px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--hairline);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 6px;
    }
    .alert button:hover { text-decoration-color: var(--ink); }

    /* ---------- welcome ---------- */

    .intro { padding-top: 16px; }
    .intro .greeting {
      margin: 0;
      max-width: 36rem;
      font: 600 32px/40px var(--sans);
      letter-spacing: -.02em;
      text-wrap: balance;
    }
    .intro .welcome {
      margin: 0;
      max-width: 34rem;
      font: 500 22px/32px var(--sans);
      letter-spacing: -.01em;
      text-wrap: pretty;
    }
    .starters { margin: 32px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--hairline); }
    .starters li { border-bottom: 1px solid var(--hairline); }
    .starter {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 16px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      text-wrap: balance;
    }
    .starter:hover { color: var(--pressed); }
    .privacy { margin-top: 24px; color: var(--muted); font-size: 13px; }
    .privacy summary { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer; list-style: none; }
    .privacy summary::-webkit-details-marker { display: none; }
    .privacy summary:hover { color: var(--ink); }
    .privacy p { margin: 0 0 8px; max-width: 34rem; }

    /* ---------- setup: one question per card, inline in the conversation ---------- */

    .setup { display: flex; flex-direction: column; gap: 8px; animation: arrive .24s cubic-bezier(.2, .7, .2, 1); }
    .setup[hidden] { display: none; }
    .setup .done-list { margin: 0; padding: 0; list-style: none; }
    .setup .done-list:empty { display: none; }

    /* An answered card: one quiet line, the whole row a 44px button that reopens it. */
    .answered {
      display: flex;
      align-items: baseline;
      gap: 16px;
      width: 100%;
      min-height: 44px;
      padding: 10px 0;
      border: 0;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 24px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
    .answered .summary { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .answered .edit { flex: none; color: var(--muted); font-size: 13px; }
    .answered:hover { color: var(--ink); }
    .answered:hover .edit { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px; }
    .answered:focus-visible { outline-offset: -2px; }

    /* The running picture: numbers so far, settled ink on quiet text. */
    .picture {
      margin: 8px 0 0;
      color: var(--ink);
      font: 500 13px/20px var(--mono);
      font-variant-numeric: tabular-nums;
      letter-spacing: -.01em;
      text-wrap: pretty;
    }
    .picture:empty { display: none; }

    .card { margin: 16px 0 0; padding: 0; border: 0; }
    .card.paused { opacity: .35; }
    .done-list .card { margin: 16px 0 24px; }
    .card .origin {
      margin: 0 0 8px;
      color: var(--muted);
      font: 500 11px/16px var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }
    .card .prompt {
      margin: 0 0 24px;
      max-width: 34rem;
      font: 600 24px/32px var(--sans);
      letter-spacing: -.015em;
      text-wrap: balance;
    }
    .card .prompt:focus { outline: none; }
    .card .fields { display: flex; flex-direction: column; gap: 24px; }
    .card .field { margin: 0; padding: 0; border: 0; min-width: 0; }
    .card .field[hidden] { display: none; }
    .card .label {
      display: block;
      margin: 0 0 8px;
      padding: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 20px;
    }

    .card input[type="text"], .card input[inputmode] {
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
      color: var(--ink);
      font-size: 17px;
    }
    .card input:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -1.5px; border-radius: 8px; }
    .card input::placeholder { color: var(--muted); opacity: 1; }
    .card input[aria-invalid="true"] { outline: 1.5px solid var(--vermilion); outline-offset: -1.5px; }
    .card .year input { width: 8.5rem; font-variant-numeric: tabular-nums; }

    /* Amount: the value is the largest thing on the card; the currency is a quiet toggle beside it. */
    .money { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .money .box { position: relative; flex: 1; min-width: 0; max-width: 20rem; }
    .money .box input { padding-left: 32px; font: 500 24px/1 var(--sans); font-variant-numeric: tabular-nums; min-height: 56px; }
    .money .box .sign { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font: 500 20px/1 var(--sans); pointer-events: none; }
    .money.small .box input { min-height: 48px; font-size: 17px; }
    .money.small .box .sign { font-size: 17px; }
    .percent { position: relative; max-width: 8.5rem; }
    .percent input { padding-right: 32px; font-variant-numeric: tabular-nums; }
    .percent .sign { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .currency { display: inline-flex; flex: none; }
    .currency button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 500 13px/1 var(--mono);
    }
    .currency button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 8px; }
    .currency button:hover { color: var(--ink); }

    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      font-weight: 500;
    }
    .choice:hover { outline-color: var(--ink-soft); }
    .choice[aria-pressed="true"] { outline: 1.5px solid var(--ink); outline-offset: -1.5px; background: var(--blush); }
    .choice:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .card .hint { margin: 8px 0 0; color: var(--muted); font-size: 13px; }

    /* A chosen item opens its own small ruled block: amount, or "I'll upload it". */
    .items { display: flex; flex-direction: column; margin-top: 16px; }
    .items:empty { display: none; }
    .item { display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid var(--hairline); }
    .item:last-child { border-bottom: 1px solid var(--hairline); }
    .item .name { margin: 0; font-size: 15px; font-weight: 600; }
    .item .row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
    .item .row > div { min-width: 0; flex: 1 1 12rem; }
    .item .row > div.narrow { flex: 0 1 8.5rem; }
    .item .row[hidden] { display: none; }
    .item .later { align-self: flex-start; margin-left: -8px; }
    .item .later[aria-pressed="true"] { color: var(--ink); }

    .card .files { margin-top: 0; }
    .card .files:empty { display: none; }

    .card .problem { margin: 16px 0 0; color: var(--ink); font-size: 14px; line-height: 20px; }
    .card .problem:empty { display: none; }

    .card .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 32px; }
    .primary {
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      background: var(--vermilion);
      color: var(--surface);
      font-size: 16px;
      font-weight: 600;
    }
    .primary:hover:not(:disabled), .primary:active:not(:disabled) { background: var(--pressed); }
    .primary:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); cursor: default; }
    .primary:focus-visible { outline-offset: 3px; border-radius: 8px; }
    .card .actions .text-control { margin: 0 -8px; }
    .card .actions .text-control:last-child { margin-right: -8px; }

    .setup .privacy { margin-top: 32px; }

    /* Resume: one row, not the whole flow. */
    .starter.resume { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .starter.resume .meta { color: var(--muted); font: 400 12px/1 var(--mono); white-space: nowrap; }

    .reveal-ticket { margin: 0; }
    .reveal-ticket .ticket { margin: 0; }
    .reveal-ticket .row.sub { border-top: 0; padding-top: 0; margin-top: -4px; }
    .reveal-ticket .row.sub dt, .reveal-ticket .row.sub dd { color: var(--muted); font-size: 13px; line-height: 20px; }
    .card .field:has(> .files:empty) { display: none; }

    /* ---------- composer ---------- */

    .dock { padding: 8px 0 max(16px, env(safe-area-inset-bottom)); background: var(--canvas); }

    /* The edge is drawn inside the box (outline, offset -1) so the composer sits exactly on the 8px grid. */
    .composer {
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
    }
    .composer:focus-within { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }

    .composer .attachments { padding: 8px 8px 0; }
    .composer .attachments:empty { display: none; }

    textarea {
      display: block;
      width: 100%;
      min-height: 40px;
      max-height: 40vh;
      padding: 12px 16px 4px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }
    textarea:focus-visible { outline: none; }
    textarea::placeholder { color: var(--muted); opacity: 1; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px 4px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      flex: none;
    }
    .icon-button:hover:not(:disabled) { color: var(--ink); }
    .icon-button:disabled { opacity: .4; cursor: default; }

    .depth { display: flex; min-width: 0; margin: 0; padding: 0; border: 0; }
    .segmented { display: inline-flex; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .segmented input:checked + label { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 8px; }
    .segmented input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 0; border-radius: 4px; }
    .segmented input:disabled + label { cursor: default; opacity: .55; }

    .send {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: var(--vermilion);
      color: var(--surface);
      flex: none;
    }
    .send:hover:not(:disabled), .send:active:not(:disabled) { background: var(--pressed); }
    /* Disabled: the same 44px square, drawn as a hairline with a quiet arrow. Box-shadow, so nothing shifts. */
    .send:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); cursor: default; }
    .send .stop-icon { display: none; }
    .send.stopping .stop-icon { display: block; }
    .send.stopping .send-icon { display: none; }

    .drop {
      position: fixed;
      inset: 16px;
      z-index: 10;
      display: none;
      place-items: center;
      border: 1.5px dashed var(--ink);
      border-radius: 8px;
      background: var(--canvas);
      color: var(--ink);
      font: 500 17px var(--sans);
      pointer-events: none;
    }
    .drop.active { display: grid; }

    .fatal { margin: 12vh 0 0; max-width: 28rem; color: var(--ink-soft); }
    .fatal h2 { margin: 0 0 8px; color: var(--ink); font: 600 24px/1.2 var(--sans); letter-spacing: -.01em; }
    .fatal code { font: .9em var(--mono); }

    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes seam { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes feed { from { transform: scaleX(.3); } to { transform: scaleX(1); } }

    @media (min-width: 768px) {
      .conversation .column { padding-top: 48px; }
      .intro .greeting { font-size: 40px; line-height: 48px; }
    }

    @media (max-width: 420px) {
      .message.user > .bubble, .message.user > .attachments { max-width: 92%; }
      .segmented label { padding: 0 6px; }
      .answer th, .answer td { padding-right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
    }

    // ------------------------------------------------------------------ markdown (DOM only)

    function safeUrl(raw) {

    const NUMERIC = /^[(]?\s*[-−+]?\s*[$€£¥₹]?\s*[-−+]?\d[\d,]*(\.\d+)?\s*(%|x|×|bps?|pp|[kKmMbB]n?|MXN|USD|EUR)?\s*[)]?$/;
    const NEGATIVE = /^\s*(\(\s*[$€£¥₹]?\s*\d|[-−]\s*[$€£¥₹]?\s*\d|[$€£¥₹]\s*[-−]\s*\d)/;

      let s = line.trim();

    const minus = cell => cell.replace(/^(\s*(?:\*\*)?\s*)-(?=\s*[$€£¥₹]?\s*\d)/, '$1−').replace(/^(\s*(?:\*\*)?\s*[$€£¥₹])\s*-(?=\s*\d)/, '$1−');
    const TOTAL = /^(\*\*)?\s*(total|subtotal|net\b|grand total|sum\b|remaining|left over|leftover|surplus|shortfall|monthly surplus|free cash|neto|saldo|restante|sobrante|faltante|suma)/i;

    // A two-column table reads as a ticket: ruled label / value rows with a clear total.
    function ticket(head, rows, numeric) {
      const box = el('section', 'ticket');
      const label = head.map(c => c.replace(/[*_`]/g, '').trim()).filter(Boolean).join(' · ');
      box.setAttribute('aria-label', label || T.table);
      const list = el('dl');
      const generic = /^(item|label|category|metric|field|concept|concepto|rubro|partida)?$/i;
      // The caption names the ticket; a generic value header ("Amount") adds nothing and is dropped.
      const plain = c => c.replace(/[*_`]/g, '').trim();
      const showLeft = plain(head[0]) && !generic.test(plain(head[0]));
      const showRight = plain(head[1]) && !/^(value|values|amount|amounts|monto|importe|valor|cantidad|usd|mxn|\$)$/i.test(plain(head[1]));

      }
      rows.forEach(row => {
        const [name = '', value = ''] = row;

        const line = el('div', TOTAL.test(name.trim()) || (bold && row === rows[rows.length - 1]) ? 'row total' : 'row');

    function table(head, divider, rows) {

    const LIST_ITEM = /^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/;

    const CALLOUT = /^(key\s+)?(assumptions?|missing\s+(data|information|inputs?)|what(?:'|’)?s\s+missing|data\s+gaps?|supuestos?|datos\s+faltantes|informaci[oó]n\s+faltante|lo\s+que\s+falta)\b[:\s]*$/i;

    // ------------------------------------------------------------------ memory line

    // Items arrive as raw keys ("account.gbm-4321"), as the server's mechanical labels ("Account gbm 4321"),

    const LABEL_KEYS = [
      [/^accounts?\b\s*(.*)$/i, m => `account.${m[1]}`], [/^liabilit(?:y|ies)\b/i, () => 'liability'],
      [/^debts?\b/i, () => 'liability'], [/^income\b/i, () => 'income'], [/^thread\b/i, () => 'thread'],
      [/^goals?$/i, () => 'goals'], [/^planning resources$/i, () => 'plan.resources'], [/^profile$/i, () => 'client.profile'],

    function institutionsFrom(...sources) {

        if (inst && typeof inst === 'object' && !Array.isArray(inst)) Object.entries(inst).forEach(([id, name]) => add(id, name));

    function memoryPhrase(items, lang, data = {}) {

      const accounts = new Map();   // institution ('' when unknown) -> count

        else if (head === 'income') push(M.income);
        else if (head === 'goals' || head === 'goal') push(M.goals);
        else if (key === 'client.profile' || head === 'profile') push(M.profile);
        else if (key === 'plan.resources') push(M.plan);
        else if (head === 'household') push(M.holdings);
        else if (head === 'portfolio') push(M.portfolio);
        else if (head === 'preference') push(M.preferences);
        else if (head === 'constraint') push(M.constraints);
        else if (head === 'decision' || head === 'decisions') push(M.decisions);
        else if (head === 'spending') push(M.spending);
        else if (head === 'cash') push(M.cash);

    }

    // ------------------------------------------------------------------ citations

    // Source names and trailing piles of links become quiet numbered marks; the list opens under the message.
    // A link that reads as prose inside a sentence stays a link. Only http(s) links ever reach here.
    const SOURCE_WORDS = /\b(art[íi]culo|article|ley|law|lisr|liva|lieps|sat|dof|cnbv|banxico|condusef|irs|sec|reglamento|regulation|publication|prospect(?:o|us)|factsheet|fact sheet|kid|comisiones|tarifas|fees|pricing|documentation|faq)\b/i;

    let citeSeq = 0;

    function isSourceName(text, href) {
      const t = text.trim();
      if (!t) return false;

    const domainOf = href => { try { return new URL(href).hostname.replace(/^www\./, ''); } catch (_) { return ''; } };

    function citations(body, lang) {
      const S = STRINGS[lang];
      const listId = `sources-${citeSeq += 1}`;
      const sources = [];
      const numberFor = (href, title) => {
        let index = sources.findIndex(s => s.href === href);
        if (index < 0) { sources.push({ href, title, domain: domainOf(href) }); index = sources.length - 1; }
        return index + 1;
