<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Wealth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    /* Dot design language: light only, flat paper, hairlines that separate, one vermilion primary. */
    :root {
      --canvas: #FBF8F2;
      --surface: #FFFCF7;
      --blush: #F4DED9;
      --vermilion: #C84335;
      --pressed: #A9372E;
      --cobalt: #4358C7;           /* live information only: the working state */
      --ink: #2B2522;
      --ink-soft: #4A413C;         /* warm-ink tints for secondary text */
      --muted: #6E625B;
      --hairline: #D9CEC6;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --column: 44rem;
      --gutter: 24px;
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: var(--canvas);
      font: 400 16px/24px var(--sans);
      font-feature-settings: "cv11", "ss01";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
    .text-control:focus-visible { outline-offset: -2px; }
    .send:focus-visible { outline-offset: 3px; border-radius: 8px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- frame ---------- */

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .column { width: min(var(--column), 100%); margin: 0 auto; padding: 0 var(--gutter); }

    .topbar { padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; }
    .topbar.scrolled { border-bottom-color: var(--hairline); }

    .topbar .column {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
    }

    .wordmark {
      flex: 1;
      margin: 0;
      font: 600 17px/1 var(--sans);
      letter-spacing: -.01em;
    }

    .text-control {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }
    .text-control:last-child { margin-right: -8px; }
    .text-control:hover:not(:disabled) { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 6px; }
    .text-control:disabled { opacity: .45; cursor: default; }
    .text-control[hidden] { display: none; }

    .conversation {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--hairline) transparent;
    }

    .conversation .column { padding-top: 24px; padding-bottom: 32px; }

    .messages { display: flex; flex-direction: column; gap: 32px; }

    /* ---------- turns ---------- */

    .message { animation: arrive .24s cubic-bezier(.2, .7, .2, 1); min-width: 0; }

    /* The user's turn hugs the right; a failure under it spans the full column, like any reply. */
    .message.user { display: flex; flex-direction: column; align-items: flex-end; }
    .message.user > .bubble, .message.user > .attachments { max-width: min(85%, 34rem); }
    .message.user > .alert { align-self: stretch; }

    .message.user .bubble {
      padding: 11px 16px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer { color: var(--ink); overflow-wrap: break-word; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 12px; }
    .answer h2, .answer h3, .answer h4, .answer h5 {
      margin: 32px 0 8px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -.01em;
    }
    .answer h2 { font-size: 20px; }
    .answer h3 { font-size: 17px; }
    .answer h4, .answer h5 { font-size: 16px; }
    .answer ul, .answer ol { margin: 0 0 16px; padding-left: 20px; }
    .answer li { margin: 4px 0; padding-left: 4px; }
    .answer li::marker { color: var(--muted); }
    .answer ol li::marker { font-variant-numeric: tabular-nums; }
    .answer strong { font-weight: 600; }
    .answer a, .message.user a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: var(--hairline);
    }
    .answer a:hover { text-decoration-color: var(--ink); }
    .answer hr { border: 0; border-top: 1px solid var(--hairline); margin: 24px 0; }

    .answer code {
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--blush);
      font: .875em/1.4 var(--mono);
    }

    .answer pre {
      margin: 0 0 16px;
      padding: 12px 16px;
      overflow-x: auto;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .answer pre code { padding: 0; background: none; font-size: 13px; line-height: 1.6; }

    .answer blockquote {
      margin: 0 0 16px;
      padding: 0 0 0 16px;
      border-left: 1.5px solid var(--hairline);
      color: var(--ink-soft);
    }

    .answer .provenance { color: var(--muted); font: 400 12px/1.5 var(--mono); }

    /* Ticket: a two-column table read as ruled label / value rows. */
    .ticket {
      margin: 0 0 16px;
      padding: 4px 16px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .ticket dl { margin: 0; }
    .ticket .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 11px;
      border-top: 1px solid var(--hairline);
    }
    .ticket .row:first-child { border-top: 0; }
    .ticket .caption { padding: 12px 0 8px; color: var(--muted); font-size: 13px; }
    .ticket .caption + .row { border-top: 1px solid var(--hairline); }
    .ticket dt { min-width: 0; color: var(--ink-soft); font-size: 15px; line-height: 24px; }
    .ticket dd { margin: 0; text-align: right; font-size: 15px; overflow-wrap: anywhere; }
    .ticket dd.num { font: 400 15px/24px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ticket .row.total { border-top: 1.5px solid var(--ink); margin-top: 4px; }
    .ticket .row.total dt, .ticket .row.total dd { color: var(--ink); font-weight: 600; }
    .ticket .row.total dd.num { font-weight: 500; }

    /* Multi-column tables stay typographic: hairline rows, right-aligned tabular numbers. */
    .table-wrap { margin: 0 0 16px; overflow-x: auto; }
    .answer table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .answer th, .answer td {
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid var(--hairline);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .answer th:last-child, .answer td:last-child { padding-right: 0; }
    .answer td:first-child, .answer th:first-child { white-space: normal; min-width: 7rem; }
    .answer tbody tr:last-child td { border-bottom: 0; }
    .answer th {
      padding-top: 0;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--ink);
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }
    .answer .num { text-align: right; }
    .answer .center { text-align: center; }

    /* Assumptions sit on plain surface; missing inputs on a quiet blush plane. */
    .callout {
      margin: 0 0 16px;
      padding: 16px 16px 4px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      font-size: 15px;
    }
    .callout[data-kind="missing"] { border-color: transparent; background: var(--blush); }
    .callout > :is(h2, h3, h4, h5):first-child {
      margin: 0 0 8px;
      color: var(--ink);
      font: 600 15px/1.4 var(--sans);
      letter-spacing: 0;
    }
    .callout ul, .callout ol { margin-bottom: 12px; }

    /* Remembering: one quiet line. */
    .memory {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .attachments { display: flex; flex-wrap: wrap; gap: 8px; }
    .message.user .attachments { justify-content: flex-end; margin-bottom: 8px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      font-size: 14px;
    }
    .chip svg { color: var(--muted); flex: none; }
    .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14rem; }
    .chip .meta { color: var(--muted); font: 400 12px var(--mono); white-space: nowrap; }
    .chip.error { background: var(--blush); border-color: transparent; }
    .chip.error .meta { color: var(--ink-soft); font-family: var(--sans); }
    .chip button {
      display: grid; place-items: center;
      width: 44px; height: 44px; margin: 0 -12px 0 -8px;
      padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted);
    }
    .chip button:hover { color: var(--ink); }

    /* ---------- presence and worktrace ---------- */

    .presence { display: block; flex: none; width: 24px; height: 24px; }
    .presence .live { animation: seam 1.6s ease-in-out infinite; }

    /* Same 24px line box as the answer's first line, so nothing moves when the answer replaces it. */
    .worktrace {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 24px;
    }
    .worktrace .step { color: var(--ink-soft); font-size: 16px; line-height: 24px; min-width: 0; }

    /* ---------- failure: statement, cause, recovery ---------- */

    .alert {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 0 12px;
      margin-top: 8px;
      padding: 16px 16px 4px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: 15px;
      line-height: 24px;
      text-align: left;
    }
    .alert.quiet { grid-template-columns: minmax(0, 1fr); }
    .alert p { margin: 0; text-wrap: pretty; }
    .alert code { font: .875em var(--mono); }
    .alert .detail { grid-column: -2 / -1; color: var(--muted); font-size: 13px; }
    .alert .detail summary { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; margin-left: -8px; cursor: pointer; list-style: none; }
    .alert .detail summary::-webkit-details-marker { display: none; }
    .alert .detail summary:hover { color: var(--ink); }
    .alert .detail code { display: block; margin-bottom: 8px; font: 400 12px/1.5 var(--mono); overflow-wrap: anywhere; }
    .alert button {
      grid-column: -2 / -1;
      justify-self: start;
      min-height: 44px;
      margin-left: -8px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--hairline);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 6px;
    }
    .alert button:hover { text-decoration-color: var(--ink); }

    /* ---------- welcome ---------- */

    .intro { padding-top: 16px; }
    .intro .greeting {
      margin: 0;
      max-width: 36rem;
      font: 600 32px/40px var(--sans);
      letter-spacing: -.02em;
      text-wrap: balance;
    }
    .intro .welcome {
      margin: 0;
      max-width: 34rem;
      font: 500 22px/32px var(--sans);
      letter-spacing: -.01em;
      text-wrap: pretty;
    }
    .starters { margin: 32px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--hairline); }
    .starters li { border-bottom: 1px solid var(--hairline); }
    .starter {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 16px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      font-weight: 500;
      text-align: left;
      text-wrap: balance;
    }
    .starter:hover { color: var(--pressed); }
    .privacy { margin-top: 24px; color: var(--muted); font-size: 13px; }
    .privacy summary { display: inline-flex; align-items: center; min-height: 44px; cursor: pointer; list-style: none; }
    .privacy summary::-webkit-details-marker { display: none; }
    .privacy summary:hover { color: var(--ink); }
    .privacy p { margin: 0 0 8px; max-width: 34rem; }

    /* ---------- composer ---------- */

    .dock { padding: 8px 0 max(16px, env(safe-area-inset-bottom)); background: var(--canvas); }

    /* The edge is drawn inside the box (outline, offset -1) so the composer sits exactly on the 8px grid. */
    .composer {
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
    }
    .composer:focus-within { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }

    .composer .attachments { padding: 8px 8px 0; }
    .composer .attachments:empty { display: none; }

    textarea {
      display: block;
      width: 100%;
      min-height: 40px;
      max-height: 40vh;
      padding: 12px 16px 4px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }
    textarea:focus-visible { outline: none; }
    textarea::placeholder { color: var(--muted); opacity: 1; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px 4px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      flex: none;
    }
    .icon-button:hover:not(:disabled) { color: var(--ink); }
    .icon-button:disabled { opacity: .4; cursor: default; }

    .depth { display: flex; min-width: 0; margin: 0; padding: 0; border: 0; }
    .segmented { display: inline-flex; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .segmented input:checked + label { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 8px; }
    .segmented input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 0; border-radius: 4px; }
    .segmented input:disabled + label { cursor: default; opacity: .55; }

    .send {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: var(--vermilion);
      color: var(--surface);
      flex: none;
    }
    .send:hover:not(:disabled), .send:active:not(:disabled) { background: var(--pressed); }
    .send:disabled { background: var(--blush); color: var(--surface); cursor: default; }
    .send .stop-icon { display: none; }
    .send.stopping .stop-icon { display: block; }
    .send.stopping .send-icon { display: none; }

    .drop {
      position: fixed;
      inset: 16px;
      z-index: 10;
      display: none;
      place-items: center;
      border: 1.5px dashed var(--ink);
      border-radius: 8px;
      background: var(--canvas);
      color: var(--ink);
      font: 500 17px var(--sans);
      pointer-events: none;
    }
    .drop.active { display: grid; }

    .fatal { margin: 12vh 0 0; max-width: 28rem; color: var(--ink-soft); }
    .fatal h2 { margin: 0 0 8px; color: var(--ink); font: 600 24px/1.2 var(--sans); letter-spacing: -.01em; }
    .fatal code { font: .9em var(--mono); }

    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes seam { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    @media (min-width: 768px) {
      .conversation .column { padding-top: 48px; }
      .intro .greeting { font-size: 40px; line-height: 48px; }
    }

    @media (max-width: 420px) {
      .message.user > .bubble, .message.user > .attachments { max-width: 92%; }
      .segmented label { padding: 0 6px; }
      .answer th, .answer td { padding-right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="column">
        <h1 class="wordmark">Wealth</h1>
        <a class="text-control" id="profile-link" href="/profile" hidden>Profile</a>
        <button class="text-control" id="new-chat" type="button" disabled>New conversation</button>
      </div>
    </header>

    <main class="conversation" id="conversation" aria-label="Conversation">
      <div class="column">
        <div class="messages" id="messages"></div>
      </div>
    </main>

    <div class="dock">
      <div class="column">
        <form class="composer" id="chat-form" novalidate>
          <div class="attachments" id="tray" aria-label="Attachments"></div>
          <label class="sr-only" for="input" id="input-label">Message</label>
          <textarea id="input" rows="1" placeholder="Ask me something…" disabled></textarea>
          <div class="toolbar">
            <button class="icon-button" id="attach" type="button" aria-label="Attach a file (PDF, CSV or image)" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12.4 19.6a5 5 0 0 1-7.1-7.1l8.3-8.3a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input type="file" id="file" hidden multiple accept=".pdf,.csv,.png,.jpg,.jpeg,.webp,application/pdf,text/csv,image/png,image/jpeg,image/webp">
            <fieldset class="depth" id="depth">
              <legend class="sr-only" id="depth-legend">Response depth</legend>
              <div class="segmented">
                <input type="radio" name="depth" id="depth-low" value="low" checked><label for="depth-low">Fast</label>
                <input type="radio" name="depth" id="depth-medium" value="medium"><label for="depth-medium">Balanced</label>
                <input type="radio" name="depth" id="depth-high" value="high"><label for="depth-high">Deep</label>
              </div>
            </fieldset>
            <button class="send" id="send" type="submit" aria-label="Send message" disabled>
              <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
              <svg class="stop-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="drop" id="drop" aria-hidden="true">Drop PDF, CSV or image to attach</div>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>


  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const conversation = $('conversation'), messages = $('messages'), form = $('chat-form');
    const input = $('input'), send = $('send'), attachButton = $('attach'), fileInput = $('file');
    const tray = $('tray'), live = $('live'), profileLink = $('profile-link'), newChat = $('new-chat');
    const drop = $('drop');
    const coarse = window.matchMedia('(pointer: coarse)');

    // ------------------------------------------------------------------ language (UI chrome only)

    const STRINGS = {
      en: {
        message: 'Message', placeholder: 'Ask me something…', attach: 'Attach a file (PDF, CSV or image)',
        depth: 'Response depth', low: 'Fast', medium: 'Balanced', high: 'Deep',
        send: 'Send message', stopResponse: 'Stop response', newChat: 'New conversation', profile: 'Profile',
        conversation: 'Conversation', attachments: 'Attachments', drop: 'Drop PDF, CSV or image to attach',
        you: 'You', wealth: 'Wealth', replied: 'Wealth replied.', table: 'Table', welcome: 'Welcome',
        returning: 'What’s on your mind?',
        privacy: 'How your data is handled',
        privacyText: 'Client memory and attachments are stored on this computer. Messages and selected context are sent to the model provider; research uses external search and market-data services.',
        webOn: 'Web search is on.', webOff: 'Web search is off.',
        working: 'Working on it', inProgress: 'Response in progress', stopping: 'Stopping…',
        remembered: 'Remembered', attachedOnly: 'I’ve attached a file.',
        retry: 'Retry', askAgain: 'Ask again', details: 'Details', uploading: 'Uploading…',
        badType: 'Use PDF, CSV or image', tooBig: 'Over 25 MB', empty: 'Empty file', uploadFailed: 'Upload failed',
        remove: name => `Remove ${name}`,
        offlineTitle: 'Wealth isn’t reachable', offlineText: 'Start it again with `uv run wealth-chat`, then reload this page.',
        errors: {
          connection: 'Lost connection to Wealth. Make sure the local server is still running, then retry.',
          gone: 'This response was interrupted when the server restarted. Retry to ask again.',
          busy: 'Another response is still in progress.',
          forbidden: 'This page lost its session. Reload to reconnect.',
          other: 'Something went wrong.'
        },
        steps: {}, starters: {}

        if (LIST_ITEM.test(line)) {
          const [node, next] = list(lines, i);
          blocks.push({ node }); i = next; continue;
        }
        const para = [];
        while (i < lines.length && lines[i].trim() && !LIST_ITEM.test(lines[i]) && !/^\s{0,3}(#{1,6}\s|>|```|~~~)/.test(lines[i])
               && !(lines[i].includes('|') && i + 1 < lines.length && isDivider(lines[i + 1]))) {
          para.push(lines[i].trim()); i += 1;
        }
        // A bold-only line such as "**Assumptions**" acts as a heading for callouts.
        const boldOnly = para.length === 1 && para[0].match(/^\*\*([^*]+?):?\*\*:?$/);
        const p = el('p', PROVENANCE.test(para[0].replace(/[*_]/g, '')) ? 'provenance' : ''); inlineLines(p, para);
        blocks.push(boldOnly ? { node: p, heading: 6, text: boldOnly[1].trim() } : { node: p });
      }
      // Group "Assumptions" / "Missing data" sections into callouts.
      for (let b = 0; b < blocks.length; b += 1) {
        const block = blocks[b];
        if (block.heading && CALLOUT.test(block.text)) {
          const aside = el('aside', 'callout');
          aside.dataset.kind = /assum|supuest/i.test(block.text) ? 'assumptions' : 'missing';
          aside.setAttribute('aria-label', block.text);
          let node = block.node;
          if (block.heading === 6) { node = el('h4'); node.textContent = block.text; }
          aside.append(node);
          let j = b + 1;
          // The section ends at the next heading, after its first list, or after three paragraphs.
          let taken = 0;
          while (j < blocks.length && !blocks[j].heading && taken < 3) {
            const node = blocks[j].node;
            aside.append(node); j += 1; taken += 1;
            if (node.tagName === 'UL' || node.tagName === 'OL') break;
          }
          container.append(aside);
          b = j - 1;
        } else {
          container.append(block.node);
        }
      }
    }

    // ------------------------------------------------------------------ rendering

    function attachmentChips(items) {
      const box = el('div', 'attachments');
      items.forEach(item => {
        const chip = el('span', 'chip');
        chip.append(svg('M7 3h7l5 5v13H7zM14 3v5h5', 15));
        chip.append(el('span', 'name', item.name || 'file'));
        if (item.size) chip.append(el('span', 'meta', formatSize(item.size)));
        box.append(chip);
      });
      return box;
    }

    function userMessage(text, attachments = []) {
      const article = el('article', 'message user');
      article.setAttribute('aria-label', T.you);
      if (attachments.length) article.append(attachmentChips(attachments));
      article.append(el('div', 'bubble', text));
      messages.append(article);
      return article;
    }

    function assistantMessage(content, options = {}) {
      const article = el('article', 'message assistant');
      article.setAttribute('aria-label', T.wealth);
      const body = el('div', 'answer');
      markdown(body, content);
      article.append(body);
      if (options.memory && options.memory.length) {
        // Remembering, settled: one quiet line, no mark.
        article.append(el('p', 'memory', `${T.remembered}: ${options.memory.join(', ')}`));
      }
      messages.append(article);
      if (options.announce) {
        live.textContent = '';
        setTimeout(() => { live.textContent = `${T.replied} ${(body.innerText || body.textContent).slice(0, 1200)}`; }, 50);
      }
      return article;
    }

    // Worktrace row: live presence mapped to the step, the step itself, elapsed time.
    function pendingMessage(raw = '') {
      const article = el('article', 'message assistant pending');
      article.setAttribute('aria-label', T.wealth);
      const line = el('div', 'worktrace');
      const mark = presence(presenceFor(raw || 'Working on it'));
      const step = el('span', 'step', raw ? stepText(raw) : T.working);
      step.setAttribute('role', 'status');
      line.append(mark, step);
      article.append(line);
      messages.append(article);
      article._step = step;
      article._mark = mark;
      return article;
    }

    function setStep(node, raw, state) {
      if (!node) return;
      const text = stepText(raw);
      if (node._step.textContent !== text) node._step.textContent = text;
      setPresence(node._mark, state || presenceFor(raw));
    }

    function clearPending(node) {
      if (!node) return;
      clearInterval(node._timer);
      node.remove();
    }

    function showError(userNode, error, retry) {
      if (!userNode) return;
      const prior = userNode.querySelector('.alert');
      if (prior) prior.remove();
      const kind = error.kind || 'other';
      const box = el('div', kind === 'cancelled' ? 'alert quiet' : 'alert');
      box.setAttribute('role', 'alert');
      // Failure statement, cause, recovery. The route-broke mark replaces any warning glyph.
      if (kind !== 'cancelled') box.append(presence('exception'));
      const p = el('p');
      const message = errorText(Object.assign({}, error, { kind }));
      // Render `codex login` style hints as code without using innerHTML.
      message.split(/(`[^`]+`)/).forEach(part => {
        p.append(part.startsWith('`') && part.endsWith('`') ? el('code', '', part.slice(1, -1)) : document.createTextNode(part));
      });
      box.append(p);
      if (error.detail && kind !== 'cancelled') {
        // The raw cause is for diagnosis, not the first read: behind a tap.
        const more = el('details', 'detail');
        more.append(el('summary', '', T.details), el('code', '', error.detail));
        box.append(more);
      }
      if (retry) {
        const button = el('button', '', kind === 'cancelled' ? T.askAgain : T.retry);
        button.type = 'button';
        button.addEventListener('click', () => { box.remove(); retry(); });
        box.append(button);
      }
      userNode.append(box);
      follow();
    }

    function renderIntro(state) {
      const box = el('section', 'intro');
      box.setAttribute('aria-label', T.welcome);
      // One dominant text: the first-run welcome in the reader's language, or a short question on later visits.
      const welcome = state.welcome && typeof state.welcome === 'object' ? (state.welcome[LANG] || state.welcome.en) : state.welcome;
      if (welcome) {
        box.append(el('h2', 'welcome', String(welcome)));
      } else {
        const title = el('h2', 'greeting', T.returning);
        box.append(title);
      }
      const starters = Array.isArray(state.starters) ? state.starters.slice(0, 3) : [];
      if (starters.length) {
        const rows = el('ul', 'starters');
        starters.forEach(item => {
          const [label, prompt] = T.starters[item.label] || [String(item.label || item.prompt), String(item.prompt)];
          const row = el('li');
          const button = el('button', 'starter', label);
          button.type = 'button';
          button.addEventListener('click', () => {
            if (item.attach) { fileInput.click(); return; }
            if (item.send) { submit(prompt); return; }
            input.value = prompt;
            resize();
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          });
          row.append(button);
          rows.append(row);
        });
        box.append(rows);
      }
      const privacy = el('details', 'privacy');
      privacy.append(el('summary', '', T.privacy));
      const web = state.capabilities && state.capabilities.web_search === true;
      privacy.append(el('p', '', `${T.privacyText} ${web ? T.webOn : T.webOff}`));
      box.append(privacy);
      messages.append(box);
    }

    const removeIntro = () => { const intro = messages.querySelector('.intro'); if (intro) intro.remove(); };

    // ------------------------------------------------------------------ network

    async function refreshToken() {
      const response = await fetch('/api/state', { credentials: 'same-origin', cache: 'no-store' });
      const state = await response.json().catch(() => ({}));
      if (response.ok && state.csrf_token) token = String(state.csrf_token);
      return state;
    }

    async function api(path, options = {}, retried = false) {
      const headers = Object.assign({}, options.headers || {}, { 'X-Wealth-Token': token });
      let response;
      try {
        response = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, options, { headers }));
      } catch (err) {
        if (err && err.name === 'AbortError') throw err;
        const e = new Error(T.errors.connection); e.kind = 'connection'; throw e;
      }
      if (response.status === 403 && !retried) {
        // The server may have restarted with a new session token.
        try { await refreshToken(); } catch (_) { /* fall through */ }
        return api(path, options, true);
      }
      return response;
    }

    async function json(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const e = new Error(data.error || `Request failed (${response.status})`);
        e.kind = data.kind || (response.status === 409 ? 'busy' : response.status === 404 ? 'gone' : 'other');
        e.detail = data.detail || '';
        throw e;
      }
      return data;
    }

    // Read the server-sent-event stream with fetch so the session token travels in a header.
    async function stream(turnId, after, onEvent, signal) {
      const response = await api(`/api/turns/${turnId}/events?after=${after}`, { signal });
      if (!response.ok) await json(response);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', done = false;
      while (!done) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        let split;
        while ((split = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, split);
          buffer = buffer.slice(split + 2);
          const data = block.split('\n').filter(l => l.startsWith('data: ')).map(l => l.slice(6)).join('\n');
          if (!data) continue;
          let event;
          try { event = JSON.parse(data); } catch (_) { continue; }
          onEvent(event);
          if (event.type === 'done') done = true;
        }
      }
      return done;
    }

    // ------------------------------------------------------------------ turns

    function setBusy(value) {
      busy = value;
      send.classList.toggle('stopping', value);
      send.setAttribute('aria-label', value ? T.stopResponse : T.send);
      send.type = value ? 'button' : 'submit';
      newChat.disabled = value;
      form.querySelectorAll('input[name="depth"]').forEach(r => { r.disabled = value; });
      refreshSend();
    }

    function refreshSend() {
      const uploading = pendingUploads.some(u => u.state === 'uploading');
      send.disabled = busy ? false : (uploading || (!input.value.trim() && !pendingUploads.some(u => u.state === 'ready')));
    }

    function resize() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, window.innerHeight * 0.4)}px`;
      refreshSend();
    }

    function finish(turn) {
      clearPending(turn.pendingNode);
      if (current === turn) current = null;
      setBusy(false);
      if (!coarse.matches && (document.activeElement === document.body || document.activeElement === send)) input.focus();
    }

    function handle(turn, event) {
      turn.after = Math.max(turn.after || 0, event.seq || 0);
      if (event.type === 'progress' && turn.pendingNode) {
        if (!turn.stopping) setStep(turn.pendingNode, event.text);
      } else if (event.type === 'memory' && turn.pendingNode && !turn.stopping) {
        setPresence(turn.pendingNode._mark, 'remembering');
      } else if (event.type === 'answer') {
        clearPending(turn.pendingNode);
        turn.pendingNode = null;
        const m = event.message || {};
        assistantMessage(m.content || '', { memory: m.memory, announce: true });
        turn.answered = true;
        follow();
      } else if (event.type === 'error') {
        clearPending(turn.pendingNode);
        turn.pendingNode = null;
        turn.failed = true;
        showError(turn.userNode, event, () => submit(turn.message, turn.attachments, turn.userNode));
      } else if (event.type === 'done') {
        finish(turn);
      }
    }

    async function track(turn) {
      turn.abort = new AbortController();
      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          const done = await stream(turn.id, turn.after || 0, event => handle(turn, event), turn.abort.signal);
          if (done) return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          if (err && err.kind === 'gone') break;
        }
        // The stream dropped: poll until the turn is visible again, then reattach.
        if (await poll(turn)) return;
      }
      if (current === turn) {
        clearPending(turn.pendingNode);
        showError(turn.userNode, { kind: 'gone', message: T.errors.gone }, () => submit(turn.message, turn.attachments, turn.userNode));
        finish(turn);
      }
    }

    async function poll(turn) {
      for (let i = 0; i < 40; i += 1) {
        await new Promise(r => setTimeout(r, 1500));
        if (current !== turn) return true;
        let state;
        try { state = await refreshToken(); } catch (_) { continue; }
        if (!state || !state.csrf_token) continue;
        if (state.turn && state.turn.id === turn.id && state.turn.status === 'running') return false;
        // Finished while we were disconnected: replay from the server's record.
        const replay = (state.messages || []).slice(-1)[0];
        if (!state.turn && replay && replay.role === 'assistant' && !turn.answered) {
          handle(turn, { type: 'answer', message: replay });
          handle(turn, { type: 'done' });
          return true;
        }
        if (state.turn && state.turn.id === turn.id && state.turn.error) {
          handle(turn, Object.assign({ type: 'error' }, state.turn.error));
          handle(turn, { type: 'done' });
          return true;
        }
        return false;
      }
      return false;
    }

    async function submit(text, attachments = null, existingNode = null) {
      const message = String(text || '').trim();
      const files = attachments || pendingUploads.filter(u => u.state === 'ready').map(u => u.meta);
      if (busy || (!message && !files.length)) return;
      removeIntro();
      const userNode = existingNode || userMessage(message || T.attachedOnly, files);
      const alert = userNode.querySelector('.alert');
      if (alert) alert.remove();
      if (!attachments) {
        input.value = '';
        pendingUploads = [];
        tray.replaceChildren();
        resize();
      }
      const turn = { message, attachments: files, userNode, after: 0 };
      current = turn;
      setBusy(true);
      turn.pendingNode = pendingMessage();
      follow(true);
      try {
        const response = await api('/api/turns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, reasoning: depth(), attachments: files.map(f => f.id), timezone: timezone() })
        });
        const data = await json(response);
        turn.id = data.turn.id;
      } catch (err) {
        clearPending(turn.pendingNode);
        showError(userNode, { kind: err.kind || 'other', message: err.message, detail: err.detail }, () => submit(message, files, userNode));
        finish(turn);
        return;
      }
      track(turn);
    }

    async function stop() {
      const turn = current;
      if (!turn || !turn.id || turn.stopping) return;
      turn.stopping = true;
      if (turn.pendingNode) { turn.pendingNode._step.textContent = T.stopping; setPresence(turn.pendingNode._mark, 'quiet'); }
      try { await api(`/api/turns/${turn.id}/cancel`, { method: 'POST' }); } catch (_) { /* the stream reports the outcome */ }
    }

    // ------------------------------------------------------------------ attachments

    function typeFor(file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      return UPLOAD_TYPES[ext] || (Object.values(UPLOAD_TYPES).includes(file.type) ? file.type : '');
    }

    function renderTray() {
      tray.replaceChildren();
      pendingUploads.forEach(upload => {
        const chip = el('span', `chip${upload.state === 'error' ? ' error' : ''}`);
        chip.append(svg('M7 3h7l5 5v13H7zM14 3v5h5', 15));
        chip.append(el('span', 'name', upload.name));
        chip.append(el('span', 'meta', upload.state === 'error' ? upload.error : upload.state === 'uploading' ? T.uploading : formatSize(upload.size)));
        const remove = el('button');
        remove.type = 'button';
        remove.setAttribute('aria-label', T.remove(upload.name));
        remove.append(svg('M6 6l12 12M18 6 6 18', 12));
        remove.addEventListener('click', () => { pendingUploads = pendingUploads.filter(u => u !== upload); renderTray(); refreshSend(); });
        chip.append(remove);
        tray.append(chip);
      });
      refreshSend();
    }

    async function addFiles(fileList) {
      for (const file of Array.from(fileList || [])) {
        if (pendingUploads.length >= 5) break;
        const upload = { name: file.name, size: file.size, state: 'uploading' };
        pendingUploads.push(upload);
        const type = typeFor(file);
        if (!type) { Object.assign(upload, { state: 'error', error: T.badType }); continue; }
        if (file.size > uploadLimit) { Object.assign(upload, { state: 'error', error: T.tooBig }); continue; }
        if (!file.size) { Object.assign(upload, { state: 'error', error: T.empty }); continue; }
        renderTray();
        try {
          const response = await api('/api/upload', {
            method: 'POST', body: file,
            headers: { 'Content-Type': type, 'X-Filename': encodeURIComponent(file.name) }
          });
          const data = await json(response);
          Object.assign(upload, { state: 'ready', meta: data.upload, name: data.upload.name });
        } catch (err) {
          Object.assign(upload, { state: 'error', error: err.message && err.message.length < 60 && LANG === 'en' ? err.message : T.uploadFailed });
        }
        renderTray();
      }
      renderTray();
    }

    attachButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

    let dragDepth = 0;
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e) || !token) return; e.preventDefault(); dragDepth += 1; drop.classList.add('active'); });
    window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove('active'); });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); dragDepth = 0; drop.classList.remove('active');
      if (token) addFiles(e.dataTransfer.files);
    });

    // ------------------------------------------------------------------ composer

    input.addEventListener('input', resize);
    input.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
      if (event.shiftKey || event.altKey) return;
      if (coarse.matches && !event.metaKey && !event.ctrlKey) return; // touch keyboards: Enter is a newline
      event.preventDefault();
      if (!busy) form.requestSubmit();
    });
    form.addEventListener('submit', event => { event.preventDefault(); if (!busy) submit(input.value); });
    send.addEventListener('click', event => { if (busy) { event.preventDefault(); stop(); } });

    newChat.addEventListener('click', async () => {
      if (busy) return;
      newChat.disabled = true;
      try {
        const state = await json(await api('/api/reset', { method: 'POST' }));
        pendingUploads = []; renderTray();
        messages.replaceChildren();
        renderIntro(state);
        input.value = ''; resize();
        if (!coarse.matches) input.focus();
      } catch (err) {
        live.textContent = err.message;
      } finally {
        newChat.disabled = busy;
      }
    });

    // ------------------------------------------------------------------ start

    // The profile is a sibling view; show its link only when the server has it.
    async function revealProfile() {
      try {
        const response = await fetch('/profile', { credentials: 'same-origin', cache: 'no-store' });
        profileLink.hidden = !response.ok;
      } catch (_) { profileLink.hidden = true; }
    }

    async function initialize() {
      localizeChrome();
      let state;
      try {
        state = await refreshToken();
        if (!token) throw new Error(state.error || 'Could not load your session.');
      } catch (err) {
        const box = el('div', 'fatal');
        box.setAttribute('role', 'alert');
        box.append(el('h2', '', T.offlineTitle));
        const p = el('p');
        T.offlineText.split(/(`[^`]+`)/).forEach(part => {
          p.append(part.startsWith('`') ? el('code', '', part.slice(1, -1)) : document.createTextNode(part));
        });
        box.append(p);
        messages.append(box);
        return;
      }
      if (state.display_name) document.title = `Wealth · ${state.display_name}`;
      if (state.uploads && state.uploads.max_bytes) uploadLimit = state.uploads.max_bytes;
      const level = form.querySelector(`input[name="depth"][value="${state.reasoning}"]`);
      if (level) level.checked = true;
      revealProfile();

      const history = Array.isArray(state.messages) ? state.messages : [];
      if (!history.length && !(state.turn && state.turn.message)) renderIntro(state);
      history.forEach(item => {
        if (!item || typeof item.content !== 'string') return;
        if (item.role === 'user') userMessage(item.content, item.attachments || []);
        else if (item.role === 'assistant') assistantMessage(item.content, { memory: item.memory });
      });

      input.disabled = false;
      attachButton.disabled = false;
      newChat.disabled = false;

      const turn = state.turn;
      if (turn && turn.message) {
        const node = userMessage(turn.message, turn.attachments || []);
        const record = { id: turn.id, message: turn.message, attachments: turn.attachments || [], userNode: node, after: 0, elapsed: turn.elapsed };
        const retry = () => submit(record.message, record.attachments, node);
        if (turn.status === 'running') {
          current = record;
          setBusy(true);
          record.pendingNode = pendingMessage(turn.progress ? turn.progress : 'Response in progress');
          if (!turn.progress) record.pendingNode._step.textContent = T.inProgress;
          track(record);
        } else if (turn.error) {
          showError(node, turn.error, retry);
        }
      }
      resize();
      follow(true);
      if (!coarse.matches && !busy) input.focus();
    }

    initialize();
  })();
  </script>
</body>
</html>
