<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Wealth</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="column">
        <h1 class="wordmark">Wealth</h1>
        <a class="text-control" id="profile-link" href="/profile" hidden>You</a>
        <button class="text-control" id="new-chat" type="button" disabled>New conversation</button>
      </div>
    </header>

    <main class="conversation" id="conversation" aria-label="Conversation">
      <div class="column">
        <div class="messages" id="messages"></div>
      </div>
    </main>

    <div class="dock">
      <div class="column">
        <form class="composer" id="chat-form" novalidate>
          <div class="attachments" id="tray" aria-label="Attachments"></div>
          <label class="sr-only" for="input" id="input-label">Message</label>
          <textarea id="input" rows="1" placeholder="Ask me something…" disabled></textarea>
          <div class="toolbar">
            <button class="icon-button" id="attach" type="button" aria-label="Attach a file (PDF, CSV or image)" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12.4 19.6a5 5 0 0 1-7.1-7.1l8.3-8.3a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input type="file" id="file" hidden multiple accept=".pdf,.csv,.png,.jpg,.jpeg,.webp,application/pdf,text/csv,image/png,image/jpeg,image/webp">
            <div class="depth-menu">
              <button class="text-control depth-toggle" id="depth-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="depth" disabled>Fast</button>
              <fieldset class="depth" id="depth" hidden>
                <legend class="sr-only" id="depth-legend">Response depth</legend>
                <div class="segmented">
                  <input type="radio" name="depth" id="depth-low" value="low" checked><label for="depth-low">Fast</label>
                  <input type="radio" name="depth" id="depth-medium" value="medium"><label for="depth-medium">Balanced</label>
                  <input type="radio" name="depth" id="depth-high" value="high"><label for="depth-high">Deep</label>
                </div>
              </fieldset>
            </div>
            <button class="send" id="send" type="submit" aria-label="Send message" disabled>
              <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/></svg>
              <svg class="stop-icon" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="drop" id="drop" aria-hidden="true">Drop PDF, CSV or image to attach</div>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>


  <script src="/static/chat.js"></script>
</body>
</html>
