<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>Wealth</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
  <style>
    /* Dot design language: light only, flat paper, hairlines that separate, one vermilion primary. */
    :root {
      --canvas: #FBF8F2;
      --surface: #FFFCF7;
      --blush: #F4DED9;
      --vermilion: #C84335;
      --pressed: #A9372E;
      --cobalt: #4358C7;           /* live information only: the working state */
      --ink: #2B2522;
      --ink-soft: #4A413C;         /* warm-ink tints for secondary text */
      --muted: #6E625B;
      --hairline: #D9CEC6;
      --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --column: 44rem;
      --gutter: 24px;
      /* Type scale: seven sizes, every font-size on the page names one of them. */
      --fs-1: 12px;   /* dates, source lines, mono labels */
      --fs-2: 13px;   /* notes, captions, chrome */
      --fs-3: 15px;   /* rows, secondary text */
      --fs-4: 16px;   /* body */
      --fs-5: 20px;   /* section headings */
      --fs-6: 24px;   /* card prompts */
      --fs-7: 32px;   /* figures, the greeting */
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: var(--canvas);
      font: 400 var(--fs-4)/24px var(--sans);
      font-feature-settings: "cv11", "ss01";
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
    .text-control:focus-visible { outline-offset: -2px; }
    .send:focus-visible { outline-offset: 3px; border-radius: 8px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- frame ---------- */

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .column { width: min(var(--column), 100%); margin: 0 auto; padding: 0 var(--gutter); }

    .topbar { padding-top: env(safe-area-inset-top); border-bottom: 1px solid transparent; }
    .topbar.scrolled { border-bottom-color: var(--hairline); }

    .topbar .column {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
    }

    .wordmark {
      flex: 1;
      margin: 0;
      font: 600 var(--fs-4)/1 var(--sans);
      letter-spacing: -.01em;
    }

    .text-control {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink-soft);
      font-size: var(--fs-3);
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }
    .text-control:last-child { margin-right: -8px; }
    .text-control:hover:not(:disabled) { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 6px; }
    .text-control:disabled { opacity: .45; cursor: default; }
    .text-control[hidden] { display: none; }

    .conversation {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--hairline) transparent;
    }

    .conversation .column { padding-top: 24px; padding-bottom: 32px; }

    .messages { display: flex; flex-direction: column; gap: 32px; }

    /* ---------- turns ---------- */

    .message { animation: arrive .24s cubic-bezier(.2, .7, .2, 1); min-width: 0; }

    /* The user's turn hugs the right; a failure under it spans the full column, like any reply. */
    .message.user { display: flex; flex-direction: column; align-items: flex-end; }
    .message.user > .bubble, .message.user > .attachments { max-width: min(85%, 34rem); }
    .message.user > .alert { align-self: stretch; }

    .message.user .bubble {
      padding: 11px 16px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer { color: var(--ink); overflow-wrap: break-word; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 12px; }
    .answer h2, .answer h3, .answer h4, .answer h5 {
      margin: 32px 0 8px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -.01em;
    }
    .answer h2 { font-size: var(--fs-5); }
    .answer h3 { font-size: var(--fs-4); }
    .answer h4, .answer h5 { font-size: var(--fs-4); }
    .answer ul, .answer ol { margin: 0 0 16px; padding-left: 20px; }
    .answer li { margin: 4px 0; padding-left: 4px; }
    .answer li::marker { color: var(--muted); }
    .answer ol li::marker { font-variant-numeric: tabular-nums; }
    .answer strong { font-weight: 600; }
    .answer a, .message.user a {
      color: inherit;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: var(--hairline);
    }
    .answer a:hover { text-decoration-color: var(--ink); }
    .answer hr { border: 0; border-top: 1px solid var(--hairline); margin: 24px 0; }

    .answer code {
      padding: 1px 4px;
      border-radius: 4px;
      background: var(--blush);
      font: .875em/1.4 var(--mono);
    }

    .answer pre {
      margin: 0 0 16px;
      padding: 12px 16px;
      overflow-x: auto;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .answer pre code { padding: 0; background: none; font-size: var(--fs-2); line-height: 1.6; }

    .answer blockquote {
      margin: 0 0 16px;
      padding: 0 0 0 16px;
      border-left: 1.5px solid var(--hairline);
      color: var(--ink-soft);
    }

    .answer .provenance { color: var(--muted); font: 400 var(--fs-1)/1.5 var(--mono); }

    /* Ticket: a two-column table read as ruled label / value rows. */
    .ticket {
      margin: 0 0 16px;
      padding: 4px 16px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
    }
    .ticket dl { margin: 0; }
    .ticket .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0 11px;
      border-top: 1px solid var(--hairline);
    }
    .ticket .row:first-child { border-top: 0; }
    .ticket .caption { padding: 12px 0 8px; color: var(--muted); font-size: var(--fs-2); }
    .ticket .caption + .row { border-top: 1px solid var(--hairline); }
    .ticket dt { min-width: 0; color: var(--ink-soft); font-size: var(--fs-3); line-height: 24px; }
    .ticket dd { margin: 0; text-align: right; font-size: var(--fs-3); overflow-wrap: anywhere; }
    .ticket dd.num { font: 400 var(--fs-3)/24px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ticket .row.total { border-top: 1.5px solid var(--ink); margin-top: 4px; }
    .ticket .row.total dt, .ticket .row.total dd { color: var(--ink); font-weight: 600; }
    .ticket .row.total dd.num { font-weight: 500; }

    /* Order card: the confirm screen, the calmest view. One number, one line per order, quiet notices,
       one vermilion action. Cobalt marks only an order that is still working. */
    .order { margin: 0; padding: 20px 16px 12px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface); }
    .order .mode { margin: 0; color: var(--muted); font: 500 var(--fs-1)/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .order .mode.live { color: var(--ink); font-weight: 600; }
    .order .total { margin: 4px 0 0; font: 600 var(--fs-7)/40px var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .order .caption { margin: 0; color: var(--muted); font-size: var(--fs-2); line-height: 20px; }
    .order dl { margin: 16px 0 0; }
    .order .line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 0 11px; border-top: 1px solid var(--hairline); }
    .order .line dt { min-width: 0; font-size: var(--fs-3); line-height: 24px; overflow-wrap: anywhere; }
    .order .line dd { margin: 0; text-align: right; font: 400 var(--fs-3)/24px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .order .line .sub { display: block; color: var(--muted); font: 400 var(--fs-2)/20px var(--sans); }
    .order .line .state { display: block; color: var(--ink-soft); font: 500 var(--fs-2)/20px var(--sans); }
    .order .line .state.working { color: var(--cobalt); }
    .order .notes { margin: 8px 0 0; padding: 0; list-style: none; }
    .order .notes li { margin: 4px 0 0; color: var(--ink-soft); font-size: var(--fs-2); line-height: 20px; text-wrap: pretty; }
    .order .notes li.stop { color: var(--ink); }
    .order .costs { margin: 8px 0 0; color: var(--muted); font-size: var(--fs-2); line-height: 20px; font-variant-numeric: tabular-nums; }
    .order .agree { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-top: 12px; font-size: var(--fs-3); line-height: 20px; cursor: pointer; }
    .order .agree input { width: 20px; height: 20px; margin: 0; accent-color: var(--ink); flex: none; }
    .order .typed { display: block; margin-top: 16px; font-size: var(--fs-2); color: var(--ink-soft); }
    .order .typed input { display: block; width: min(100%, 16rem); min-height: 44px; margin-top: 8px; padding: 0 12px; border: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--hairline); background: var(--canvas); font: 500 var(--fs-4)/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
    .order .typed input:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
    .order .moved { color: var(--ink); font-weight: 600; }   /* a figure re-priced since the card was shown */
    .order .was { color: var(--muted); text-decoration-color: var(--muted); }   /* the figure the card showed before */
    .order .eq { display: inline-block; margin-right: 6px; color: var(--muted); }  /* "4 × $523.50 = $2,094": the sum is arithmetic */
    .order .problem { margin: 12px 0 0; color: var(--ink); font-size: var(--fs-2); line-height: 20px; }
    .order .problem:empty { display: none; }
    .order .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 20px; }
    .order .actions .text-control { margin: 0 -8px; }
    .order .settled { margin: 12px 0 0; color: var(--muted); font-size: var(--fs-2); line-height: 20px; }
    .order .manual-text { margin: 16px 0 4px; padding: 12px; border-radius: 8px; background: var(--canvas); box-shadow: inset 0 0 0 1px var(--hairline); font: 400 var(--fs-2)/20px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

    /* Engine-drawn views: the engine supplies every number; the page only draws. One surface, hairlines,
       ink marks, cobalt only for a live/current point. The drawing is aria-hidden; a table carries the data. */
    .view {
      margin: 0 0 16px;
      padding: 16px 16px 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      min-width: 0;
    }
    .view .view-title { margin: 0; font: 600 var(--fs-3)/22px var(--sans); color: var(--ink); }
    .view .view-caption { margin: 2px 0 0; color: var(--muted); font-size: var(--fs-2); line-height: 18px; }
    .view .view-body { margin-top: 8px; }
    .view .view-source { margin: 10px 0 0; color: var(--muted); font: 400 var(--fs-1)/16px var(--sans); }
    .view .view-note { margin: 4px 0 0; color: var(--muted); font-size: var(--fs-1); line-height: 16px; }
    .view .num { font: 400 var(--fs-3)/24px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .view dl { margin: 0; }
    .view .row {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      padding: 10px 0 9px; border-top: 1px solid var(--hairline);
    }
    .view .row:first-child { border-top: 0; }
    .view .row dt { min-width: 0; color: var(--ink-soft); font-size: var(--fs-3); line-height: 24px; }
    .view .row dd { margin: 0; text-align: right; }
    .view .row.sub dt { padding-left: 12px; color: var(--muted); font-size: var(--fs-2); }
    .view .row.sub dd { color: var(--muted); }
    .view .row.total { border-top: 1.5px solid var(--ink); margin-top: 4px; }
    .view .row.total dt, .view .row.total dd { color: var(--ink); font-weight: 600; }
    .view .row.total .num { font-weight: 500; }

    .view .alloc-row { padding: 8px 0 10px; }
    .view .alloc-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .view .alloc-line .label { min-width: 0; color: var(--ink-soft); font-size: var(--fs-3); line-height: 24px; }
    .view .alloc-line .share { color: var(--muted); margin-left: 12px; display: inline-block; min-width: 3.6em; text-align: right; }
    .view .alloc-track { position: relative; height: 6px; margin-top: 4px; }
    .view .alloc-track::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; border-top: 1px solid var(--hairline); }
    .view .alloc-bar { position: absolute; left: 0; top: 0; height: 6px; min-width: 2px; border-radius: 0 3px 3px 0; background: var(--ink); }

    /* The plot's right margin is only what the last label needs (set once the label is measured). */
    .view .series-plot { position: relative; height: 144px; margin: 16px 76px 0 0; }
    .view .series-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .view .series-plot .mark {
      position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
      background: var(--ink); box-shadow: 0 0 0 2px var(--surface);
    }
    .view .series-plot .mark.live { background: var(--cobalt); }
    .view .series-plot .tag { position: absolute; left: calc(100% + 12px); transform: translateY(-50%); white-space: nowrap; }
    .view .series-plot .tag.last { color: var(--ink); font-weight: 500; }
    .view .series-plot .tag.quiet { color: var(--muted); font-size: var(--fs-1); line-height: 16px; }
    /* The start value sits at the line's left end, on the free side of the first point. */
    .view .series-plot .tag.start { left: 0; transform: translateY(6px); }
    .view .series-plot .tag.start.above { transform: translateY(calc(-100% - 6px)); }
    .view .series-axis {
      display: flex; justify-content: space-between; margin: 6px 76px 0 0;
      color: var(--muted); font: 400 var(--fs-1)/16px var(--mono);
    }
    .view .series-plot .ref { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); }
    /* The reference is named on its own rule, not in a legend. */
    .view .series-plot .ref-label {
      position: absolute; right: 0; transform: translateY(calc(-100% - 3px)); padding-left: 8px;
      background: var(--surface); color: var(--muted); font: 400 var(--fs-1)/16px var(--mono); white-space: nowrap;
    }

    /* P&L by price: the loss plane is drawn in the SVG; ticks and today's price sit on the same grid. */
    .view .pnl-plot { margin-top: 28px; }
    .view .pnl-plot .tick { position: absolute; width: 1.5px; height: 12px; margin: -6px 0 0 -.75px; background: var(--ink); }
    .view .pnl-ticks { position: relative; height: 16px; margin: 0 76px 0 0; }
    .view .pnl-ticks .tick-label { position: absolute; transform: translateX(-50%); color: var(--ink-soft); font: 400 var(--fs-1)/16px var(--mono); }
    .view .pnl-plot .tag.inplot { background: var(--surface); padding: 0 4px; margin-left: -4px; }
    .view .pnl-plot .spot { position: absolute; top: -22px; transform: translateX(-50%); color: var(--cobalt); font: 500 var(--fs-1)/16px var(--mono); white-space: nowrap; }
    .view .pnl-axis { color: var(--muted); }

    .view .band-at { margin: 8px 0 0; color: var(--muted); font: 400 var(--fs-1)/16px var(--mono); }
    .view .band-scale { position: relative; height: 64px; margin: 4px 0 0; }
    .view .band-scale .mid { position: absolute; top: 0; transform: translateX(-50%); font: 600 var(--fs-5)/28px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .view .band-scale .rule { position: absolute; left: 0; right: 0; top: 44px; border-top: 1px solid var(--hairline); }
    .view .band-scale .range { position: absolute; top: 41px; left: 12%; right: 12%; height: 6px; border-radius: 3px; background: var(--ink); }
    .view .band-scale .dot {
      position: absolute; top: 44px; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
      background: var(--ink); box-shadow: 0 0 0 2px var(--surface);
    }
    .view .band-ends { position: relative; height: 24px; color: var(--ink-soft); }
    .view .band-ends .num { position: absolute; top: 0; transform: translateX(-50%); }
    .view .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    .view .compare-table { width: 100%; border-collapse: collapse; font-size: var(--fs-3); }
    .view .compare-table th, .view .compare-table td { padding: 10px 0 9px 16px; border-bottom: 1px solid var(--hairline); text-align: right; vertical-align: bottom; }
    .view .compare-table th:first-child, .view .compare-table td:first-child { padding-left: 0; text-align: left; color: var(--ink-soft); }
    .view .compare-table thead th { padding-top: 4px; border-bottom: 1.5px solid var(--ink); color: var(--ink-soft); font-size: var(--fs-2); font-weight: 500; line-height: 18px; }
    .view .compare-table tbody tr:last-child td { border-bottom: 0; }
    .view .compare-table .best { color: var(--ink); font-weight: 600; }
    .view .compare-table td.best .num { font-weight: 600; }
    .view .compare-cards { display: none; }
    .view .compare-card { padding: 8px 0 4px; border-top: 1px solid var(--hairline); }
    .view .compare-card:first-child { border-top: 0; }
    .view .compare-card h4 { margin: 4px 0 0; font: 500 var(--fs-3)/22px var(--sans); color: var(--ink-soft); }
    .view .compare-card.best h4 { font-weight: 600; color: var(--ink); }
    .view .compare-card .row { padding: 6px 0 5px; }
    .view .compare-card .row dt { font-size: var(--fs-2); color: var(--muted); }

    .view .payoff-row { flex-wrap: wrap; row-gap: 0; }
    .view .payoff-row dd.detail { flex: 1 0 100%; color: var(--muted); font: 400 var(--fs-1)/16px var(--mono); text-align: right; }

    @media (max-width: 600px) {
      .view .compare-table { display: none; }
      .view .compare-cards { display: block; }
      .view .series-plot, .view .series-axis { margin-right: 68px; }
    }

    /* Multi-column tables stay typographic: hairline rows, right-aligned tabular numbers. */
    .table-wrap { margin: 0 0 16px; overflow-x: auto; }
    .answer table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--fs-3);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .answer th, .answer td {
      padding: 12px 16px 12px 0;
      border-bottom: 1px solid var(--hairline);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .answer th:last-child, .answer td:last-child { padding-right: 0; }
    .answer td:first-child, .answer th:first-child { white-space: normal; min-width: 7rem; }
    .answer tbody tr:last-child td { border-bottom: 0; }
    .answer td:has(a) { white-space: normal; min-width: 6rem; }   /* a linked reference wraps instead of clipping */
    .answer th {
      padding-top: 0;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--ink);
      color: var(--muted);
      font-size: var(--fs-2);
      font-weight: 500;
    }
    .answer .num { text-align: right; }
    .answer .center { text-align: center; }

    /* On a phone, a table of three or more columns stacks into one ruled card per row instead of being cut off. */
    @media (max-width: 600px) {
      .table-wrap.stack { overflow: visible; }
      .table-wrap.stack table, .table-wrap.stack tbody, .table-wrap.stack tr, .table-wrap.stack td { display: block; width: 100%; }
      .table-wrap.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .table-wrap.stack tr { margin: 0 0 12px; padding: 4px 16px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface); }
      .answer .table-wrap.stack td {
        display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
        padding: 8px 0 7px; border-bottom: 1px solid var(--hairline); white-space: normal; text-align: right;
      }
      .answer .table-wrap.stack td::before { content: attr(data-label); flex: 0 1 auto; color: var(--muted); font-size: var(--fs-2); text-align: left; font-variant-numeric: normal; }
      .answer .table-wrap.stack td:first-child { display: block; min-width: 0; padding-top: 10px; font-weight: 600; text-align: left; }
      .answer .table-wrap.stack td:first-child::before { content: none; }
      .answer .table-wrap.stack tr td:last-child { border-bottom: 0; }
    }

    /* Assumptions sit on plain surface; missing inputs on a quiet blush plane. */
    .callout {
      margin: 0 0 16px;
      padding: 16px 16px 4px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      font-size: var(--fs-3);
    }
    .callout[data-kind="missing"] { border-color: transparent; background: var(--blush); }
    .callout > :is(h2, h3, h4, h5):first-child {
      margin: 0 0 8px;
      color: var(--ink);
      font: 600 var(--fs-3)/1.4 var(--sans);
      letter-spacing: 0;
    }
    .callout ul, .callout ol { margin-bottom: 12px; }

    /* Remembering: one very quiet line, only under the answer that just saved something. */
    .memory {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: var(--fs-1);
      line-height: 16px;
    }

    /* Citations: a quiet numbered mark in the text; the sources themselves open under the message. */
    .answer a.cite {
      position: relative;
      padding: 15px 16px;          /* 44px hit area around a 12px numeral; margins give the space back */
      margin: 0 -14px 0 -15px;
      color: var(--muted);
      font: 500 var(--fs-1)/1 var(--sans);
      font-variant-numeric: tabular-nums;
      vertical-align: super;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .answer a.cite:hover, .answer a.cite[aria-expanded="true"] { color: var(--ink); }
    .answer a.cite:focus-visible { outline: none; }
    .answer a.cite:focus-visible::after {
      content: ""; position: absolute; inset: 11px 12px; border-radius: 4px; outline: 2px solid var(--ink);
    }

    .sources {
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
      border-top: 1px solid var(--hairline);
      counter-reset: source;
    }
    .sources[hidden] { display: none; }
    .sources li { counter-increment: source; border-bottom: 1px solid var(--hairline); }
    .sources a {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      column-gap: 8px;
      min-height: 44px;
      padding: 10px 0;
      color: var(--ink);
      text-decoration: none;
    }
    .sources a::before {
      content: counter(source);
      grid-row: span 2;
      color: var(--muted);
      font: 500 var(--fs-1)/20px var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .sources li.current a::before { color: var(--ink); }
    .sources .domain { color: var(--muted); font: 400 var(--fs-1)/20px var(--mono); overflow-wrap: anywhere; }
    .sources .title { font-size: var(--fs-3); line-height: 20px; overflow-wrap: anywhere; }
    .sources a:hover .title { text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 3px; }

    .attachments { display: flex; flex-wrap: wrap; gap: 8px; }
    .message.user .attachments { justify-content: flex-end; margin-bottom: 8px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      font-size: var(--fs-2);
    }
    .chip svg { color: var(--muted); flex: none; }
    .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14rem; }
    .chip .meta { color: var(--muted); font: 400 var(--fs-1) var(--mono); white-space: nowrap; }
    .chip.error { background: var(--blush); border-color: transparent; }
    .chip.error .meta { color: var(--ink-soft); font-family: var(--sans); }
    .chip button {
      display: grid; place-items: center;
      width: 44px; height: 44px; margin: 0 -12px 0 -8px;
      padding: 0; border: 0; border-radius: 8px;
      background: transparent; color: var(--muted);
    }
    .chip button:hover { color: var(--ink); }

    /* ---------- presence and worktrace ---------- */

    .presence { display: block; flex: none; width: 24px; height: 24px; }
    /* One plain mark: a cobalt dot while Wealth works (the only thing that moves), ink once it is settled. */
    .presence .channel { transform-box: fill-box; transform-origin: center; animation: feed 1.2s cubic-bezier(.45, 0, .25, 1) infinite alternate; }

    /* Same 24px line box as the answer's first line, so nothing moves when the answer replaces it. */
    .worktrace {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 24px;
    }
    .worktrace .step { color: var(--ink-soft); font-size: var(--fs-4); line-height: 24px; min-width: 0; }
    .worktrace .elapsed { color: var(--muted); font: 400 var(--fs-2)/24px var(--mono); font-variant-numeric: tabular-nums; }
    .worktrace .elapsed:empty { display: none; }
    /* Streaming: the answer takes the working line's place as it is written (the same first-line box), and the
       cobalt dot rides at its end until the finished answer replaces it with citations, views and the memory line. */
    .message.pending.streaming .worktrace { display: none; }
    .answer .stream-mark {
      display: inline-block; width: 8px; height: 8px; margin-left: 6px; border-radius: 50%;
      background: var(--cobalt); vertical-align: middle;
      animation: feed 1.2s cubic-bezier(.45, 0, .25, 1) infinite alternate;
    }
    .message.pending.stopping .answer .stream-mark { background: var(--ink); animation: none; }

    /* Stopped: the words written before Stop stay; one quiet line under them says so, with the way forward. */
    .stopped {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: var(--fs-1);
      line-height: 16px;
    }
    .stopped button {
      min-height: 44px; padding: 0 8px; margin-left: -8px;
      border: 0; background: transparent; color: var(--ink);
      font-size: var(--fs-2); font-weight: 600;
      text-decoration: underline; text-decoration-color: var(--hairline);
      text-decoration-thickness: 1.5px; text-underline-offset: 6px;
    }
    .stopped button:hover { text-decoration-color: var(--ink); }
    .stopped .sep { color: var(--hairline); }

    /* ---------- failure: statement, cause, recovery ---------- */

    .alert {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 0 12px;
      margin-top: 8px;
      padding: 16px 16px 4px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-size: var(--fs-3);
      line-height: 24px;
      text-align: left;
    }
    .alert.quiet { grid-template-columns: minmax(0, 1fr); }
    .alert p { margin: 0; text-wrap: pretty; }
    .alert code { font: .875em var(--mono); }
    /* One row under the statement: the way forward, then the raw cause behind a tap. */
    .alert .ways { grid-column: -2 / -1; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0 16px; margin: 4px 0 0 -8px; }
    .alert .detail { flex: 1 1 auto; min-width: 0; color: var(--muted); font-size: var(--fs-2); }
    .alert .detail summary { display: inline-flex; align-items: center; min-height: 44px; padding: 0 8px; cursor: pointer; list-style: none; }
    .alert .detail summary::-webkit-details-marker { display: none; }
    .alert .detail summary:hover { color: var(--ink); }
    .alert .detail code { display: block; margin: 0 0 8px 8px; font: 400 var(--fs-1)/1.5 var(--mono); overflow-wrap: anywhere; }
    .alert .ways:empty { display: none; }
    .alert button {
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: var(--fs-3);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--hairline);
      text-decoration-thickness: 1.5px;
      text-underline-offset: 6px;
    }
    .alert button:hover { text-decoration-color: var(--ink); }

    /* ---------- welcome ---------- */

    .intro { padding-top: 16px; }
    .intro .greeting {
      margin: 0;
      max-width: 36rem;
      font: 600 var(--fs-7)/40px var(--sans);
      letter-spacing: -.02em;
      text-wrap: balance;
    }
    /* Ruled rows for the reveal's unknowns: "aún no sé", never a zero. */
    .ticket dd.unknown { color: var(--muted); font-size: var(--fs-2); }
    .ticket dd.parts { color: var(--muted); font: 400 var(--fs-2)/20px var(--sans); text-wrap: balance; }   /* what the reserve is made of */
    .intro .welcome {
      margin: 0;
      max-width: 34rem;
      font: 500 var(--fs-5)/32px var(--sans);
      letter-spacing: -.01em;
      text-wrap: pretty;
    }
    .starters { margin: 32px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--hairline); }
    .starters li { border-bottom: 1px solid var(--hairline); }
    .starter {
      display: block;
      width: 100%;
      min-height: 56px;
      padding: 16px 0;
      border: 0;
      background: transparent;
      color: var(--ink);
      font-size: var(--fs-4);
      font-weight: 500;
      text-align: left;
      text-wrap: balance;
    }
    .starter:hover { color: var(--pressed); }

    /* ---------- setup: one question per card, inline in the conversation ---------- */

    .setup { display: flex; flex-direction: column; gap: 8px; animation: arrive .24s cubic-bezier(.2, .7, .2, 1); }
    .setup[hidden] { display: none; }
    .setup .done-list { margin: 0; padding: 0; list-style: none; }
    .setup .done-list:empty { display: none; }

    /* An answered card: one quiet line, the whole row a 44px button that reopens it. */
    .answered {
      display: flex;
      align-items: baseline;
      gap: 16px;
      width: 100%;
      min-height: 44px;
      padding: 10px 0;
      border: 0;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
      color: var(--ink-soft);
      font-size: var(--fs-3);
      line-height: 24px;
      text-align: left;
      font-variant-numeric: tabular-nums;
    }
    .answered .summary { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .answered .edit { flex: none; color: var(--muted); font-size: var(--fs-2); }
    .answered:hover { color: var(--ink); }
    .answered:hover .edit { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px; }
    .answered:focus-visible { outline-offset: -2px; }

    /* The running picture: one quiet sentence of numbers so far. */
    .picture {
      margin: 8px 0 0;
      color: var(--ink-soft);
      font: 400 var(--fs-2)/20px var(--sans);
      font-variant-numeric: tabular-nums;
      text-wrap: pretty;
    }
    .picture:empty { display: none; }

    .card { margin: 16px 0 0; padding: 0; border: 0; }
    .card.paused { opacity: .35; }
    .done-list .card { margin: 16px 0 24px; }
    .card .origin {
      margin: 0 0 8px;
      color: var(--muted);
      font: 400 var(--fs-1)/16px var(--mono);
      font-variant-numeric: tabular-nums;
    }
    .card .prompt {
      margin: 0 0 24px;
      max-width: 34rem;
      font: 600 var(--fs-6)/32px var(--sans);
      letter-spacing: -.015em;
      text-wrap: balance;
    }
    .card .prompt:focus { outline: none; }
    .card .fields { display: flex; flex-direction: column; gap: 24px; }
    .card .field { margin: 0; padding: 0; border: 0; min-width: 0; }
    .card .field[hidden] { display: none; }
    .card .label {
      display: block;
      margin: 0 0 8px;
      padding: 0;
      color: var(--muted);
      font-size: var(--fs-2);
      line-height: 20px;
    }

    .card input[type="text"], .card input[inputmode] {
      width: 100%;
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
      color: var(--ink);
      font-size: var(--fs-4);
    }
    .card input:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -1.5px; border-radius: 8px; }
    .card input::placeholder { color: var(--muted); opacity: 1; }
    .card input[aria-invalid="true"] { outline: 1.5px solid var(--vermilion); outline-offset: -1.5px; }
    .card .year input { width: 8.5rem; font-variant-numeric: tabular-nums; }

    /* Amount: the value is the largest thing on the card; the currency is a quiet toggle beside it. */
    .money { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .money .box { position: relative; flex: 1; min-width: 0; max-width: 20rem; }
    .money .box input { padding-left: 32px; font: 500 var(--fs-6)/1 var(--sans); font-variant-numeric: tabular-nums; min-height: 56px; }
    .money .box .sign { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font: 500 var(--fs-5)/1 var(--sans); pointer-events: none; }
    .money.small .box input { min-height: 48px; font-size: var(--fs-4); }
    .money.small .box .sign { font-size: var(--fs-4); }
    .percent { position: relative; max-width: 8.5rem; }
    .percent input { padding-right: 32px; font-variant-numeric: tabular-nums; }
    .percent .sign { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .currency { display: inline-flex; flex: none; }
    .currency button {
      min-width: 44px;
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: 500 var(--fs-2)/1 var(--mono);
    }
    .currency button[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 8px; }
    .currency button:hover { color: var(--ink); }

    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
      color: var(--ink);
      font-size: var(--fs-3);
      font-weight: 500;
    }
    .choice:hover { outline-color: var(--ink-soft); }
    .choice[aria-pressed="true"] { outline: 1.5px solid var(--ink); outline-offset: -1.5px; background: var(--blush); }
    .choice:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .card .hint { margin: 8px 0 0; color: var(--muted); font-size: var(--fs-2); }

    /* A chosen item opens its own small ruled block: amount, or "I'll upload it". */
    .items { display: flex; flex-direction: column; margin-top: 16px; }
    .items:empty { display: none; }
    .item { display: flex; flex-direction: column; gap: 12px; padding: 16px 0; border-top: 1px solid var(--hairline); }
    .item:last-child { border-bottom: 1px solid var(--hairline); }
    .item .name { margin: 0; font-size: var(--fs-3); font-weight: 600; }
    .item .row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
    .item .row > div { min-width: 0; flex: 1 1 12rem; }
    .item .row > div.narrow { flex: 0 1 8.5rem; }
    .item .row > .field.wide { flex: 1 1 100%; }   /* a yes/no question takes its own line under the figures */
    .item .row > .field.wide .label { color: var(--ink-soft); }
    .item .row[hidden] { display: none; }
    .item .later { align-self: flex-start; margin-left: -8px; }
    .item .later[aria-pressed="true"] { color: var(--ink); }

    .card .files { margin-top: 0; }
    .card .files:empty { display: none; }

    .card .problem { margin: 16px 0 0; color: var(--ink); font-size: var(--fs-2); line-height: 20px; }
    .card .problem:empty { display: none; }

    .card .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 32px; }
    .primary {
      min-height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      background: var(--vermilion);
      color: var(--surface);
      font-size: var(--fs-4);
      font-weight: 600;
    }
    .primary:hover:not(:disabled), .primary:active:not(:disabled) { background: var(--pressed); }
    .primary:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); cursor: default; }
    .primary:focus-visible { outline-offset: 3px; border-radius: 8px; }
    .card .actions .text-control { margin: 0 -8px; }
    .card .actions .text-control:last-child { margin-right: -8px; }

    /* Resume: one row, not the whole flow. */
    .starter.resume { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .starter.resume .meta { color: var(--muted); font: 400 var(--fs-1)/1 var(--mono); white-space: nowrap; }

    .reveal-ticket { margin: 0; }
    .reveal-ticket .ticket { margin: 0; }
    .reveal-ticket .row.sub { border-top: 0; padding-top: 0; margin-top: -4px; }
    .reveal-ticket .row.sub dt, .reveal-ticket .row.sub dd { color: var(--muted); font-size: var(--fs-2); line-height: 20px; }
    .card .field:has(> .files:empty) { display: none; }

    /* ---------- composer ---------- */

    .dock { padding: 8px 0 max(16px, env(safe-area-inset-bottom)); background: var(--canvas); }

    /* The edge is drawn inside the box (outline, offset -1) so the composer sits exactly on the 8px grid. */
    .composer {
      border-radius: 8px;
      outline: 1px solid var(--hairline);
      outline-offset: -1px;
      background: var(--surface);
    }
    .composer:focus-within { outline: 1.5px solid var(--ink); outline-offset: -1.5px; }

    .composer .attachments { padding: 8px 8px 0; }
    .composer .attachments:empty { display: none; }

    textarea {
      display: block;
      width: 100%;
      min-height: 40px;
      max-height: 40vh;
      padding: 12px 16px 4px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: var(--fs-4);
      line-height: 1.5;
    }
    textarea:focus-visible { outline: none; }
    textarea::placeholder { color: var(--muted); opacity: 1; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px 4px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      flex: none;
    }
    .icon-button:hover:not(:disabled) { color: var(--ink); }
    .icon-button:disabled { opacity: .4; cursor: default; }

    /* Depth: one quiet word naming the current level; the three choices open above it on demand. */
    .depth-menu { position: relative; display: flex; min-width: 0; }
    .depth-toggle { color: var(--muted); font-size: var(--fs-2); font-weight: 500; padding: 0 8px; }
    .depth-toggle:hover:not(:disabled), .depth-toggle[aria-expanded="true"] { color: var(--ink); text-decoration: none; }
    .depth-toggle::after { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 0 3px 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-135deg); }
    .depth {
      position: absolute; left: 0; bottom: calc(100% + 4px); z-index: 3; margin: 0; padding: 4px; border: 1px solid var(--hairline);
      border-radius: 8px; background: var(--surface); box-shadow: 0 8px 24px -12px rgba(43, 37, 34, .25);
    }
    .depth[hidden] { display: none; }
    .segmented { display: flex; flex-direction: column; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label {
      display: flex;
      align-items: center;
      min-width: 9rem;
      min-height: 44px;
      padding: 0 12px;
      border-radius: 4px;
      color: var(--ink-soft);
      font-size: var(--fs-3);
      font-weight: 500;
      cursor: pointer;
      user-select: none;
    }
    .segmented label:hover { background: var(--canvas); }
    .segmented input:checked + label { color: var(--ink); }
    .segmented input:checked + label::before { content: ""; width: 6px; height: 6px; margin: 0 10px 0 -2px; border-radius: 50%; background: var(--ink); }
    .segmented input:not(:checked) + label::before { content: ""; width: 6px; height: 6px; margin: 0 10px 0 -2px; }
    .segmented input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: -2px; }
    .segmented input:disabled + label { cursor: default; opacity: .55; }

    .send {
      display: grid;
      place-items: center;
      width: 44px; height: 44px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: var(--vermilion);
      color: var(--surface);
      flex: none;
    }
    .send:hover:not(:disabled), .send:active:not(:disabled) { background: var(--pressed); }
    /* One filled button per screen: while an order card waits for its tap, the send arrow is drawn in ink outline. */
    .app:has(.order .primary:not(:disabled)) .send:not(:disabled):not(.stopping) { background: transparent; box-shadow: inset 0 0 0 1px var(--ink); color: var(--ink); }
    /* Disabled: the same 44px square, drawn as a hairline with a quiet arrow. Box-shadow, so nothing shifts. */
    .send:disabled { background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); color: var(--muted); cursor: default; }
    .send .stop-icon { display: none; }
    .send.stopping .stop-icon { display: block; }
    .send.stopping .send-icon { display: none; }

    .drop {
      position: fixed;
      inset: 16px;
      z-index: 10;
      display: none;
      place-items: center;
      border: 1.5px dashed var(--ink);
      border-radius: 8px;
      background: var(--canvas);
      color: var(--ink);
      font: 500 var(--fs-4) var(--sans);
      pointer-events: none;
    }
    .drop.active { display: grid; }

    .fatal { margin: 12vh 0 0; max-width: 28rem; color: var(--ink-soft); }
    .fatal h2 { margin: 0 0 8px; color: var(--ink); font: 600 var(--fs-6)/1.2 var(--sans); letter-spacing: -.01em; }
    .fatal code { font: .9em var(--mono); }

    @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes feed { from { transform: scale(.6); opacity: .45; } to { transform: scale(1); opacity: 1; } }

    @media (min-width: 768px) {
      .conversation .column { padding-top: 48px; }
    }

    @media (max-width: 420px) {
      .message.user > .bubble, .message.user > .attachments { max-width: 92%; }
      .segmented label { padding: 0 6px; }
      .answer th, .answer td { padding-right: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
    }

    /* ---------- today: at most three quiet lines above the composer ---------- */
    /* Hidden while a turn runs (visibility keeps its height, so nothing moves) and during setup. */
    .hoy { margin: 0 0 4px; }
    .hoy ul { list-style: none; margin: 0; padding: 0; }
    .hoy li { display: flex; align-items: center; min-height: 44px; }
    .hoy li[hidden] { display: none; }
    .dock:has(.send.stopping) .hoy { visibility: hidden; }
    .app:has(.messages .setup) .hoy { display: none; }
    .hoy-go {
      flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 12px;
      padding: 0; border: 0; background: none; text-align: left; color: var(--ink-soft);
      font: 400 var(--fs-3)/20px var(--sans);
    }
    .hoy-go:hover .hoy-title { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 4px; }
    .hoy-mark { flex: none; width: 7px; height: 7px; border-radius: 50%; }
    .hoy-mark.act { background: var(--ink); }
    .hoy-mark.consider { border: 1px solid var(--ink-soft); }
    .hoy-text { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
    .hoy-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hoy-title b { font-weight: 600; color: var(--ink); }
    .hoy-due { flex: none; font: 400 var(--fs-1)/20px var(--mono); color: var(--muted); white-space: nowrap; }
    .hoy-later, .hoy-x, .hoy-more, .hoy-acts button, .hoy-rest {
      flex: none; min-height: 44px; border: 0; background: none; color: var(--muted); padding: 0 8px;
      font: 400 var(--fs-2)/20px var(--sans);
    }
    .hoy-x { width: 44px; margin-right: -12px; padding: 0; display: grid; place-items: center; }
    .hoy-later:hover, .hoy-x:hover, .hoy-more:hover, .hoy-acts button:hover, .hoy-rest:hover { color: var(--ink); }
    .hoy-more, .hoy-acts, .hoy-rest { display: none; }
    /* With a mouse the two quiet controls appear on the line being pointed at or focused. */
    @media (hover: hover) and (pointer: fine) {
      .hoy li:not(:hover):not(:focus-within) :is(.hoy-later, .hoy-x) { opacity: 0; }
    }
    /* Touch and narrow screens: the whole line is the title (up to two lines, the value never cut) and its date;
       one quiet "⋯" holds Later and Dismiss in a row that opens under the line. */
    @media (hover: none), (pointer: coarse), (max-width: 560px) {
      .hoy li { display: grid; grid-template-columns: minmax(0, 1fr) 44px; align-items: start; }
      .hoy-later, .hoy-x { display: none; }
      .hoy-go { align-items: flex-start; padding: 12px 0; }
      .hoy-mark { margin-top: 6.5px; }
      .hoy-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; text-wrap: pretty; }
      .hoy-title { display: inline; overflow: visible; white-space: normal; }
      .hoy-due { display: inline-block; margin-left: 8px; font-size: var(--fs-1); }
      .hoy-more {
        display: grid; place-items: center; width: 44px; height: 44px; padding: 0; margin-right: -12px;
        font: 400 var(--fs-5)/1 var(--sans); letter-spacing: 0;
      }
      .hoy-more[aria-expanded="true"] { color: var(--ink); }
      .hoy li.open .hoy-acts { display: flex; }
      .hoy-acts { grid-column: 1 / -1; gap: 16px; margin: -8px 0 4px 19px; }
      .hoy-acts button { padding: 0; font-size: var(--fs-2); color: var(--ink-soft); }
      .hoy-rest { display: block; padding: 0 0 0 19px; font-size: var(--fs-2); text-align: left; }
    }
  </style>

    const localeOf = lang => lang === 'es' ? 'es-MX' : 'en-US';
    const ISO_DATE = /^\d{4}-\d{2}(-\d{2})?$/;

    function viewDate(iso, lang) {
      if (typeof iso !== 'string' || !ISO_DATE.test(iso)) return '—';
      const [y, m, d] = iso.split('-').map(Number);
      const options = d ? { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' } : { month: 'short', year: 'numeric', timeZone: 'UTC' };
      try { return new Intl.DateTimeFormat(localeOf(lang), options).format(new Date(Date.UTC(y, m - 1, d || 15, 12))); } catch (_) { return iso; }
    }

    const viewText = (value, lang) => {
      if (typeof value === 'string') return value;
      if (!value || typeof value !== 'object') return '';
      if (typeof value.date === 'string') return viewDate(value.date, lang);
      return String(value[lang] || value.en || '');
    };

    const viewNumber = raw => {
      if (raw === null || raw === undefined || raw === '' || typeof raw === 'boolean') return null;
      const n = Number(raw);
      return Number.isFinite(n) ? n : null;
    };
    const trueMinus = text => text.replace(/-(?=\D?\d|\p{Sc})/u, '−');

    function viewValue(value, lang) {
      if (!value || typeof value !== 'object') return '—';
      const locale = localeOf(lang);
      if (value.t === 'text') return viewText(value.v, lang) || '—';
      if (value.t === 'date') return viewDate(value.v, lang);
      if (value.t === 'range') {
        const low = viewValue({ t: 'money', v: value.lo, cur: value.cur }, lang), high = viewValue({ t: 'money', v: value.hi, cur: value.cur }, lang);
        return low === '—' || high === '—' ? '—' : `${low}–${high}`;
      }
      const n = viewNumber(value.v);
      if (n === null) return '—';
      try {
        if (value.t === 'money') {
          const places = Math.abs(n) >= 100 || Number.isInteger(n) ? 0 : 2;
          return trueMinus(new Intl.NumberFormat(locale, { style: 'currency', currency: value.cur || 'MXN', currencyDisplay: 'narrowSymbol', minimumFractionDigits: places, maximumFractionDigits: places }).format(n));
        }
        if (value.t === 'ratio') return trueMinus(new Intl.NumberFormat(locale, { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(n));
        if (value.t === 'percent') return trueMinus(new Intl.NumberFormat(locale, { style: 'percent', maximumFractionDigits: 1 }).format(n / 100));
        if (value.t === 'months') return STRINGS[lang].views.months(Math.round(n));
        return trueMinus(new Intl.NumberFormat(locale, { maximumFractionDigits: 2 }).format(n));
      } catch (_) { return String(value.v); }
    }

    function viewDataTable(caption, head, rows) {
      // The screen-reader alternative: the view's data as a plain table, inside a 1px clipped box (a table never
      // shrinks to 1px, a div does; unclipped, a long table once inflated the conversation with blank space).
      const box = el('div', 'sr-only');
      const table = el('table');
      table.append(el('caption', '', caption));
      const thead = el('thead'), tr = el('tr');
      head.forEach(cell => { const th = el('th', '', cell); th.scope = 'col'; tr.append(th); });
      thead.append(tr);
      const tbody = el('tbody');
      rows.forEach(cells => {
        const r = el('tr');
        cells.forEach((cell, i) => { const c = el(i ? 'td' : 'th', '', cell); if (!i) c.scope = 'row'; r.append(c); });
        tbody.append(r);
      });
      table.append(thead, tbody);
      box.append(table);
      return box;
    }

    function ruledRow(label, value, className = 'row') {
      const line = el('div', className);
      const dd = el('dd');
      if (value instanceof Node) dd.append(value); else dd.append(el('span', 'num', value));
      line.append(el('dt', '', label), dd);
      return line;
    }

    function ticketView(spec, lang, V) {
      const data = spec.data, body = el('dl'), rows = [];
      data.rows.forEach(row => {
        const label = viewText(row.label, lang), value = V(row.value);
        body.append(ruledRow(label, value, row.sub ? 'row sub' : 'row'));
        rows.push([label, value]);
      });
      if (data.total) {
        const label = viewText(data.total.label, lang), value = V(data.total.value);
        body.append(ruledRow(label, value, 'row total'));
        rows.push([label, value]);
      }
      return [body, [STRINGS[lang].views.item, STRINGS[lang].views.value], rows];
    }

    function allocationView(spec, lang, V) {
      const S = STRINGS[lang].views, body = el('div', 'alloc'), rows = [];
      spec.data.rows.forEach(row => {
        const share = Math.max(0, Math.min(1, viewNumber(row.share) ?? 0));
        const label = viewText(row.label, lang), shareText = viewValue({ t: 'ratio', v: row.share }, lang);
        const value = row.value ? V(row.value) : '';
        const item = el('div', 'alloc-row');
        const line = el('div', 'alloc-line');
        const right = el('span', 'num');
        if (value) right.append(document.createTextNode(value));
        right.append(el('span', 'share', shareText));
        line.append(el('span', 'label', label), right);
        item.append(line);
        // A lone row at 100% has nothing to compare against: the figure says it all, no bar.
        if (spec.data.rows.length > 1) {
          const track = el('div', 'alloc-track'), bar = el('div', 'alloc-bar');
          bar.style.width = `${(share * 100).toFixed(2)}%`;
          track.append(bar);
          item.append(track);
        }
        body.append(item);
        rows.push(value ? [label, value, shareText] : [label, shareText]);
      });
      const head = spec.data.rows.some(r => r.value) ? [S.item, S.value, S.share] : [S.item, S.share];
      return [body, head, rows];
    }

    function seriesView(spec, lang, V) {
      const S = STRINGS[lang].views, data = spec.data, unit = data.unit || {};
      const fmt = raw => V(Object.assign({ t: unit.t, v: raw }, unit.t === 'money' ? { cur: unit.cur || '' } : {}));
      const body = el('div', 'series');
      const points = Array.isArray(data.points) ? data.points.filter(p => viewNumber(p.y) !== null) : [];
      if (points.length >= 2) {
        const ys = points.map(p => viewNumber(p.y));
        const ref = data.reference ? viewNumber(data.reference.y) : null;
        // The reference belongs to the y-domain, so its rule always lies inside the plotted range.
        let lo = Math.min(...ys, ...(ref === null ? [] : [ref])), hi = Math.max(...ys, ...(ref === null ? [] : [ref]));
        const pad = (hi - lo) * 0.14 || Math.abs(hi) * 0.1 || 1;
        lo -= pad; hi += pad;
        const X = i => (i / (points.length - 1)) * 1000;
        const Y = v => 1000 - ((v - lo) / (hi - lo)) * 1000;
        const plot = el('div', 'series-plot');
        const s = document.createElementNS(SVG_NS, 'svg');
        s.setAttribute('viewBox', '0 0 1000 1000'); s.setAttribute('preserveAspectRatio', 'none'); s.setAttribute('aria-hidden', 'true');
        const line = (x1, y1, x2, y2, stroke) => {
          const l = document.createElementNS(SVG_NS, 'line');
          [['x1', x1], ['y1', y1], ['x2', x2], ['y2', y2], ['stroke', stroke], ['stroke-width', '1'], ['vector-effect', 'non-scaling-stroke']].forEach(([k, v]) => l.setAttribute(k, v));
          s.append(l);
        };
        line(0, 1000, 1000, 1000, 'var(--hairline)');
        const path = document.createElementNS(SVG_NS, 'polyline');
        path.setAttribute('points', ys.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' '));
        [['fill', 'none'], ['stroke', 'var(--ink)'], ['stroke-width', '2'], ['stroke-linejoin', 'round'], ['stroke-linecap', 'round'], ['vector-effect', 'non-scaling-stroke']].forEach(([k, v]) => path.setAttribute(k, v));
        s.append(path);
        plot.append(s);
        // The reference (what was contributed, the average price paid) is a dashed rule named on the rule itself.
        if (ref !== null) {
          const rule = el('span', 'ref');
          rule.style.top = `${(Y(ref) / 10).toFixed(2)}%`;
          const name = el('span', 'ref-label', `${viewText(data.reference.label, lang)} ${fmt(data.reference.y)}`);
          name.style.top = `${(Y(ref) / 10).toFixed(2)}%`;
          plot.append(rule, name);
        }
        const lastY = Y(ys[ys.length - 1]) / 10, firstY = Y(ys[0]) / 10;
        const mark = el('span', data.current ? 'mark live' : 'mark');
        mark.style.left = '100%'; mark.style.top = `${lastY.toFixed(2)}%`;
        const last = el('span', 'tag last num', fmt(points[points.length - 1].y));
        last.style.top = `${lastY.toFixed(2)}%`;
        // The start value sits at the line's left end, on whichever side the line leaves free.
        const rising = ys[Math.min(2, ys.length - 1)] >= ys[0];
        const start = el('span', `tag quiet num start${rising ? '' : ' above'}`, fmt(points[0].y));
        start.style.top = `${firstY.toFixed(2)}%`;
        plot.append(mark, last, start);
        const axis = el('div', 'series-axis');
        axis.append(el('span', '', viewDate(points[0].x, lang)), el('span', '', viewDate(points[points.length - 1].x, lang)));
        body.append(plot, axis);
        // Once drawn, the right margin becomes exactly the width the last label needs.
        requestAnimationFrame(() => {
          if (!last.isConnected) return;
          const width = `${Math.ceil(last.getBoundingClientRect().width) + 18}px`;
          plot.style.marginRight = width; axis.style.marginRight = width;
        });
        const rows = points.map(p => [viewDate(p.x, lang), fmt(p.y)]);
        if (data.reference && ref !== null) rows.push([viewText(data.reference.label, lang), fmt(data.reference.y)]);
        return [body, [S.date, S.value], rows];
      }
      const band = data.band;
      if (!band) return [body, [S.item, S.value], []];
      const low = viewNumber(band.low), mid = viewNumber(band.mid), high = viewNumber(band.high);
      const at = Math.max(12, Math.min(88, 12 + 76 * ((mid - low) / ((high - low) || 1))));
      body.append(el('p', 'band-at', `${S.at} ${viewDate(band.x, lang)}`));
      const scale = el('div', 'band-scale');
      scale.setAttribute('aria-hidden', 'true');
      const midLabel = el('span', 'mid', fmt(band.mid)); midLabel.style.left = `${at}%`;
      const dot = el('span', 'dot'); dot.style.left = `${at}%`;
      scale.append(midLabel, el('span', 'rule'), el('span', 'range'), dot);
      const ends = el('div', 'band-ends');
      const lowLabel = el('span', 'num', fmt(band.low)), highLabel = el('span', 'num', fmt(band.high));
      lowLabel.style.left = '12%'; highLabel.style.left = '88%';
      ends.append(lowLabel, highLabel);
      body.append(scale, ends);
      return [body, [S.item, S.value], [[S.low, fmt(band.low)], [S.mid, fmt(band.mid)], [S.high, fmt(band.high)], [S.date, viewDate(band.x, lang)]]];
    }

    function comparisonView(spec, lang, V) {
      const S = STRINGS[lang].views, data = spec.data;
      const names = data.options.map(o => viewText(o.label, lang));
      const body = el('div', 'compare');
      // Desktop: one ruled table. Under 600px: one card per option, so nothing is cut off.
      const table = el('table', 'compare-table');
      const thead = el('thead'), hr = el('tr');
      hr.append(el('th'));
      data.options.forEach((o, i) => hr.append(el('th', o.best ? 'best' : '', names[i])));
      thead.append(hr);
      const tbody = el('tbody');
      const values = data.metrics.map(m => m.values.map(v => V(v)));
      data.metrics.forEach((m, r) => {
        const tr = el('tr');
        tr.append(el('td', '', viewText(m.label, lang)));
        values[r].forEach((v, i) => { const td = el('td', data.options[i].best ? 'best' : ''); td.append(el('span', 'num', v)); tr.append(td); });
        tbody.append(tr);
      });
      table.append(thead, tbody);
      const cards = el('div', 'compare-cards');
      data.options.forEach((o, i) => {
        const card = el('section', o.best ? 'compare-card best' : 'compare-card');
        card.append(el('h4', '', names[i]));
        const list = el('dl');
        data.metrics.forEach((m, r) => list.append(ruledRow(viewText(m.label, lang), values[r][i])));
        card.append(list);
        cards.append(card);
      });
      body.append(table, cards);
      const head = [S.measure, ...data.options.map((o, i) => o.best ? `${names[i]} (${S.best})` : names[i])];
      return [body, head, data.metrics.map((m, r) => [viewText(m.label, lang), ...values[r]])];
    }

    function payoffView(spec, lang, V) {
      const S = STRINGS[lang].views, data = spec.data, body = el('dl'), rows = [];
      data.rows.forEach(row => {
        const label = viewText(row.label, lang), date = V(row.date), months = V(row.months);
        let detail = months;
        if (row.alt_date && data.alt_label) detail += ` · ${viewText(data.alt_label, lang)}: ${V(row.alt_date)}`;
        const line = ruledRow(label, date, 'row payoff-row');
        line.append(el('dd', 'detail', detail));  // its own line under the date, so the name never squeezes
        body.append(line);
        rows.push([label, date, detail]);
      });
      const total = data.total;
      // With one debt its own date already is the debt-free date; the total line would only repeat it.
      if (data.rows.length > 1) {
        body.append(ruledRow(S.debtFree, V(total.date), 'row total'));
        rows.push([S.debtFree, V(total.date), V(total.months)]);
      }
      body.append(ruledRow(S.interest, V(total.interest), data.rows.length > 1 ? 'row' : 'row total'));
      rows.push([S.interest, V(total.interest), '']);
      const saved = viewNumber(total.saved.v);
      if (saved !== null && saved > 0) {
        body.append(ruledRow(S.saved, V(total.saved)));
        rows.push([S.saved, V(total.saved), '']);
      }
      return [body, [S.item, S.paidOff, S.detail], rows];
    }

    // P&L against the underlying price (a speculation's payoff at expiry): the loss side is a quiet blush plane,
    // the line ink, breakevens are ticks on the zero rule, the floor is named, and today's price is the one cobalt mark.
    function pnlView(spec, lang, V) {
      const S = STRINGS[lang].views, data = spec.data, cur = (data.unit || {}).cur || '';
      const fmt = raw => V({ t: 'money', v: raw, cur });
      const price = raw => { const n = viewNumber(raw); return n === null ? '—' : new Intl.NumberFormat(localeOf(lang), { maximumFractionDigits: 2 }).format(n); };
      const points = data.points.map(p => [viewNumber(p.x), viewNumber(p.y)]).filter(([x, y]) => x !== null && y !== null);
      const body = el('div', 'pnl');
      const rows = points.map(([x, y]) => [price(x), fmt(y)]);
      if (points.length < 2) return [body, [S.price, S.value], rows];
      const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
      let lo = Math.min(...ys, 0), hi = Math.max(...ys, 0);
      const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1;
      lo -= pad; hi += pad;
      const x0 = Math.min(...xs), x1 = Math.max(...xs);
      const X = v => ((v - x0) / ((x1 - x0) || 1)) * 1000;
      const Y = v => 1000 - ((v - lo) / (hi - lo)) * 1000;
      const plot = el('div', 'series-plot pnl-plot');
      const s = document.createElementNS(SVG_NS, 'svg');
      s.setAttribute('viewBox', '0 0 1000 1000'); s.setAttribute('preserveAspectRatio', 'none'); s.setAttribute('aria-hidden', 'true');
      const shape = (tag, attrs) => { const n = document.createElementNS(SVG_NS, tag); Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v)); s.append(n); return n; };
      const zero = Y(0);
      // Shade only where the position loses: between the line and the zero rule.
      const under = points.map(([x, y]) => `${X(x).toFixed(1)},${Y(Math.min(y, 0)).toFixed(1)}`);
      shape('polygon', { points: [`${X(x0).toFixed(1)},${zero.toFixed(1)}`, ...under, `${X(x1).toFixed(1)},${zero.toFixed(1)}`].join(' '), fill: 'var(--blush)' });
      shape('line', { x1: 0, y1: zero.toFixed(1), x2: 1000, y2: zero.toFixed(1), stroke: 'var(--muted)', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' });
      shape('polyline', { points: points.map(([x, y]) => `${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join(' '), fill: 'none', stroke: 'var(--ink)',
        'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'vector-effect': 'non-scaling-stroke' });
      plot.append(s);
      // Breakevens: a tick on the zero rule, its price under the axis.
      const axis = el('div', 'series-axis pnl-axis');
      axis.append(el('span', '', price(points[0][0])), el('span', '', price(points[points.length - 1][0])));
      const ticks = el('div', 'pnl-ticks');
      (data.breakevens || []).map(viewNumber).filter(b => b !== null && b >= x0 && b <= x1).forEach(b => {
        const tick = el('span', 'tick'); tick.style.left = `${(X(b) / 10).toFixed(2)}%`; tick.style.top = `${(zero / 10).toFixed(2)}%`;
        const label = el('span', 'tick-label num', price(b)); label.style.left = `${(X(b) / 10).toFixed(2)}%`;
        plot.append(tick); ticks.append(label);
        rows.push([S.breakeven, price(b)]);
      });
      // The floor: the deepest point named; "no floor" when the loss has no ceiling.
      const loss = data.loss || {}, gain = data.gain || {};
      const floorAt = ys.indexOf(Math.min(...ys));
      const floorText = loss.unbounded ? S.noFloor : viewNumber(loss.v) !== null ? `${S.maxLoss} ${fmt(loss.v)}` : '';
      if (floorText) {
        // Named beside its own point: inside the plot when the floor sits in the left half, at the right edge otherwise.
        const inside = X(xs[floorAt]) < 500;
        const tag = el('span', `tag quiet num${inside ? ' inplot' : ''}`, floorText);
        // At the floor's height, but where the line has already climbed clear of it, so it never crosses the text.
        const floorY = Y(ys[floorAt]);
        let clear = floorAt;
        while (clear < xs.length - 1 && floorY - Y(ys[clear]) < 260) clear += 1;
        tag.style.top = `calc(${(floorY / 10).toFixed(2)}% - 16px)`;
        if (inside) tag.style.left = `calc(${(X(xs[clear]) / 10).toFixed(2)}% + 12px)`;
        plot.append(tag);
      }
      if (gain.unbounded) { const tag = el('span', 'tag quiet num', S.noCeiling); tag.style.top = '2%'; plot.append(tag); }
      // Today's price, on the line, in cobalt: the only live figure here.
      const spot = viewNumber(data.spot);
      if (spot !== null && spot >= x0 && spot <= x1) {
        const after = Math.max(1, xs.findIndex(x => x >= spot)), before = after - 1;
        const share = xs[after] === xs[before] ? 0 : (spot - xs[before]) / (xs[after] - xs[before]);
        const py = ys[before] + (ys[after] - ys[before]) * share;
        const mark = el('span', 'mark live'); mark.style.left = `${(X(spot) / 10).toFixed(2)}%`; mark.style.top = `${(Y(py) / 10).toFixed(2)}%`;
        const label = el('span', 'spot num', `${S.today} ${price(spot)}`); label.style.left = `${(X(spot) / 10).toFixed(2)}%`;
        plot.append(mark, label);
        rows.push([`${S.today} ${price(spot)}`, fmt(py)]);
      }
      body.append(plot, axis, ticks);
      if (viewNumber(loss.v) !== null || loss.unbounded) rows.push([S.maxLoss, loss.unbounded ? S.noFloor : fmt(loss.v)]);
      if (viewNumber(gain.v) !== null || gain.unbounded) rows.push([S.maxGain, gain.unbounded ? S.noCeiling : fmt(gain.v)]);
      requestAnimationFrame(() => {
        const tags = [...plot.querySelectorAll('.tag:not(.inplot)')];
        if (!plot.isConnected) return;
        const width = `${tags.length ? Math.ceil(Math.max(...tags.map(t => t.getBoundingClientRect().width))) + 18 : 16}px`;
        plot.style.marginRight = width; axis.style.marginRight = width; ticks.style.marginRight = width;
      });
      return [body, [S.price, S.value], rows];
    }

    const VIEW_KINDS = { ticket: ticketView, allocation: allocationView, series: seriesView, comparison: comparisonView, payoff: payoffView, pnl: pnlView };

    function renderView(spec, lang) {
      const draw = VIEW_KINDS[spec && spec.kind];
      if (!draw || !spec.data || typeof spec.id !== 'string') return null;
      let unknown = false;
      const V = value => { const text = viewValue(value, lang); if (text === '—' || text.startsWith('—')) unknown = true; return text; };
      const [visual, head, rows] = draw(spec, lang, V);
      const title = viewText(spec.title, lang);
      const figure = tagLang(el('figure', `view view-${spec.kind}`), lang);
      figure.dataset.view = spec.id;
      figure.setAttribute('aria-label', title);
      figure.append(el('h3', 'view-title', title));
      if (spec.caption) figure.append(el('p', 'view-caption', viewText(spec.caption, lang)));
      const body = el('div', 'view-body');
      body.setAttribute('aria-hidden', 'true');
      body.append(visual);
      figure.append(body, viewDataTable(title, head, rows));
      const source = spec.source || {};
      const origin = [viewText(source.label, lang), source.as_of ? viewDate(source.as_of, lang) : ''].filter(Boolean).join(' · ');
      if (origin) figure.append(el('p', 'view-source', origin));
      if (unknown) figure.append(el('p', 'view-note', STRINGS[lang].views.unknown));
      return figure;
    }

    // The answer with its placed views: at most two, each once, only ids the result offered; other placements vanish.
    function renderAnswer(container, content, views, lang) {
      const specs = new Map((Array.isArray(views) ? views : []).filter(v => v && typeof v.id === 'string').map(v => [v.id, v]));
      const shown = new Set();
      let buffer = [], fence = false;
      const flush = () => { if (buffer.some(l => l.trim())) markdown(container, buffer.join('\n')); buffer = []; };
      String(content ?? '').replace(/\r\n?/g, '\n').split('\n').forEach(line => {
        if (/^\s*(```|~~~)/.test(line)) fence = !fence;
        const match = !fence && line.match(VIEW_LINE);
        if (!match) { buffer.push(line); return; }
        const spec = specs.get(match[1]);
        if (!spec || shown.has(match[1]) || shown.size >= MAX_PLACED) return;
        flush();
        let node = null;
        try { node = renderView(spec, lang); } catch (_) { node = null; }
        if (node) { container.append(node); shown.add(match[1]); }
      });
      flush();
    }

    // ------------------------------------------------------------------ order cards (DOM only; the tap is the only way to place)

    const orderCards = new Map();
    let orderPoll = null;
    const WORKING = new Set(['sent', 'partial', 'unknown']);
    let orderCurrency = 'USD';  // the currency of the card being drawn (a Mexican broker's card is in pesos)
    const orderUsd = (value, lang = LANG, currency = orderCurrency) => {
      const n = Number(value);
      if (value === null || value === undefined || value === '' || !Number.isFinite(n)) return '—';
      return new Intl.NumberFormat(localeOf(lang), { style: 'currency', currency, currencyDisplay: currency === 'USD' ? 'narrowSymbol' : 'code', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
    };
    const orderQty = (value, lang = LANG) => {
      const n = Number(value);
      return Number.isFinite(n) ? new Intl.NumberFormat(localeOf(lang), { maximumFractionDigits: 6 }).format(n) : '—';
    };

    function orderNote(note, ticket = {}) {
      const O = T.orders, params = note.params || {};
      if (LANG === 'es' && typeof params.es === 'string') return params.es;
      const text = O.notes[note.code === 'policy' ? `policy_${params.rule}` : note.code];
      const context = { status: note.status, label: ticket.broker_label || 'Alpaca', currency: (ticket.total && ticket.total.currency) || 'USD' };
      if (text) return text(Object.assign(context, params));
      return String(note.message || '');
    }

    // ``moved`` is the re-price notice for this line since the card was shown: its fields and the figures shown
    // before. A changed figure reads was → now ("<s>$512.00</s> → $523.50"); the line's sum is arithmetic.
    function orderLine(line, moved = null) {
      const O = T.orders;
      const fields = moved ? moved.fields : [], was = moved ? moved.params : {};
      const row = el('div', 'line');
      const dt = el('dt', '', `${line.side === 'sell' ? O.sell : O.buy} ${line.symbol}`);
      const figure = (text, changed, before) => {
        if (!changed) return document.createTextNode(text);
        const now = el('span', 'moved', text);
        if (!before) return now;
        const frag = document.createDocumentFragment();
        frag.append(el('s', 'was', before), ' → ', now);
        return frag;
      };
      const qty = line.qty !== undefined ? orderQty(line.qty) : '—';
      const sub = el('span', 'sub');
      sub.append(figure(qty, fields.includes('order_qty'), was.shown_qty ? orderQty(was.shown_qty) : ''));
      if (line.type === 'market') sub.append(` ${O.shares} · ${O.market}`);
      else sub.append(' × ', figure(orderUsd(line.limit_price), fields.includes('limit_price'), was.shown_limit ? orderUsd(was.shown_limit) : ''));
      if (line.exchange && line.exchange !== 'US') sub.append(` · ${line.listing_note && LANG === 'es' ? line.listing_note : line.exchange}`);
      dt.append(sub);  // the card's head already names the account
      const extra = [];
      if (line.estimated_fee !== undefined && Number(line.estimated_fee) > 0) extra.push(`${O.fees} ${orderUsd(line.estimated_fee)}`);
      if (line.fx && line.fx.rate) extra.push(O.fx(line.fx.pair, line.fx.rate, line.fx.usd_amount));
      if (line.reference_date && line.state === 'proposed') extra.push(O.reference(line.reference_date));
      if (line.reason && (line.state === 'failed' || line.state === 'unconfirmed' || line.state === 'rejected')) extra.push(line.reason);
      if (extra.length) dt.append(el('span', 'sub', extra.join(' · ')));
      const dd = el('dd');
      const eq = el('span', 'eq', '='); eq.setAttribute('aria-hidden', 'true');
      dd.append(eq, figure(orderUsd(line.estimated_amount), fields.includes('estimated_amount'), ''));
      const state = O.states[line.state] || '';
      if (state) {
        const tag = el('span', WORKING.has(line.state) ? 'state working' : 'state', state);
        if (line.state === 'filled' && line.filled_avg_price) tag.textContent = `${state} · ${orderUsd(line.filled_avg_price)}`;
        dd.append(tag);
      }
      row.append(dt, dd);
      return row;
    }

    function orderCard(ticket) {
      const O = T.orders;
      const box = el('section', 'order');
      box.dataset.ticket = ticket.id;
      box.setAttribute('aria-label', O.region);
      // The card's code travels with the confirm request; the person never needs to read it.
      orderCurrency = (ticket.total && ticket.total.currency) || 'USD';
      const byHand = ticket.broker === 'manual';
      const head = [ticket.broker_label || O.account];
      if (ticket.account && (ticket.account.number || ticket.account.id)) head.push(ticket.account.number || ticket.account.id);
      head.push(byHand ? O.manual : ticket.mode === 'live' ? O.live : O.paper);
      const mode = el('p', ticket.mode === 'live' ? 'mode live' : 'mode', head.join(' · '));
      box.append(mode);
      const net = Number(ticket.total && ticket.total.amount);
      const receive = Number.isFinite(net) && net < 0;
      const pending = ticket.status === 'pending';
      const total = el('p', 'total', orderUsd(ticket.total && ticket.total.amount !== null ? Math.abs(net) : null));
      box.append(total, el('p', 'caption', pending ? (receive ? O.receive : O.total) : O.settledTotal));
      // A re-price since the card was shown is not a note: the changed figures read was → now and one line says why.
      const movedBy = new Map();
      let shownTotal = null;
      (ticket.notices || []).forEach(n => {
        if (n.code !== 'price_moved' || !pending) return;
        const params = n.params || {};
        const prior = movedBy.get(n.line) || { fields: [], params: {} };
        movedBy.set(n.line, { fields: [...prior.fields, ...(params.fields || [])], params: Object.assign(prior.params, params) });
        if (params.shown_amount !== undefined) shownTotal = (shownTotal || 0) + Number(params.shown_amount);
      });
      const list = el('dl');
      (ticket.lines || []).forEach(line => list.append(orderLine(line, movedBy.get(line.index) || null)));
      box.append(list);

      const notes = (ticket.notices || []).filter(n => n.status !== 'pass' && n.code !== 'price_moved');
      if (notes.length && ticket.status === 'pending') {
        const ul = el('ul', 'notes');
        const seen = new Set();
        notes.forEach(n => {
          const text = orderNote(n, ticket);
          if (!text || seen.has(text)) return;
          seen.add(text);
          ul.append(el('li', n.status === 'warn' ? '' : 'stop', text));
        });
        box.append(ul);
      }
      const t = ticket.total || {};
      const costs = [];
      // A zero line says nothing; a cost or tax shows only once there is one.
      if (Number(t.estimated_tax) > 0) costs.push(`${O.tax} ${orderUsd(t.estimated_tax)}`);
      if (Number(t.estimated_cost) > 0) costs.push(`${O.cost} ${orderUsd(t.estimated_cost)}`);
      if (Number(t.estimated_fee) > 0) costs.push(`${O.fees} ${orderUsd(t.estimated_fee)}`);
      if (costs.length && pending) box.append(el('p', 'costs', costs.join(' · ')));
      // A place-it-yourself card: the exact order text, copied in one tap, to paste or read at the broker.
      if (byHand && ticket.manual && (pending || ticket.status === 'placed')) {
        const text = LANG === 'es' ? ticket.manual.es : ticket.manual.en;
        const pre = el('pre', 'manual-text', text);
        const copy = el('button', 'text-control', O.copy); copy.type = 'button';
        copy.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(text); copy.textContent = O.copied; } catch (_) { copy.textContent = O.copy; }
        });
        box.append(pre, copy);
      }

      if (ticket.status === 'pending') {
        const problem = el('p', 'problem');
        problem.setAttribute('role', 'status');
        if (movedBy.size) problem.textContent = O.priceMoved;
        // The total the card showed before the re-price, when every moved line reported it.
        if (movedBy.size && Number.isFinite(shownTotal) && [...movedBy.values()].every(m => m.params.shown_amount !== undefined)) {
          const unchanged = (ticket.lines || []).filter(l => !movedBy.has(l.index)).reduce((a, l) => a + (Number(l.estimated_amount) || 0), 0);
          problem.textContent = O.priceMovedFrom(orderUsd(shownTotal + unchanged));
        }
        let agree = null, typed = null;
        if (ticket.needs_override) {
          const label = el('label', 'agree');
          agree = el('input'); agree.type = 'checkbox';
          label.append(agree, document.createTextNode(O.override));
          box.append(label);
        }
        if (ticket.needs_typed) {
          const label = el('label', 'typed', O.typed);
          typed = el('input'); typed.type = 'text'; typed.autocomplete = 'off'; typed.spellcheck = false;
          label.append(typed);
          box.append(label);
        }
        const actions = el('div', 'actions');
        const placeLabel = byHand ? ((ticket.lines || []).length === 1 ? O.placed1 : O.placedN)
          : (ticket.lines || []).length === 1 ? O.place1 : O.place;
        const place = el('button', 'primary', placeLabel); place.type = 'button';
