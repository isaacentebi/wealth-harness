<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Wealth</title>
  <style>
    :root {
      --paper: #f6f3ea;
      --paper-deep: #efeadd;
      --surface: #fffdf8;
      --ink: #15271f;
      --ink-soft: #33443c;
      --muted: #5d6760;
      --line: #e1dccd;
      --line-strong: #cfc8b5;
      --accent: #1f5a47;
      --accent-hover: #184a3a;
      --accent-ink: #fbf8f0;
      --accent-soft: #e6eee7;
      --brass: #7a5c24;
      --brass-soft: #efe4cc;
      --user: #e9e5d8;
      --danger: #a3432f;
      --danger-soft: #f8ebe5;
      --neg: #a3432f;
      --code: #efeadc;
      --focus: #1f5a47;
      --shadow: 0 1px 0 rgba(21, 39, 31, .04), 0 12px 32px -12px rgba(21, 39, 31, .18);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: "Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --column: 46rem;
      --gutter: clamp(16px, 4vw, 32px);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0f1a15;
        --paper-deep: #0b1410;
        --surface: #16231d;
        --ink: #ece6d6;
        --ink-soft: #d3cdbd;
        --muted: #9aa59e;
        --line: #26362e;
        --line-strong: #34463c;
        --accent: #8fc0a8;
        --accent-hover: #a6cfba;
        --accent-ink: #0f1a15;
        --accent-soft: #1b2e25;
        --brass: #c9a96a;
        --brass-soft: #2a2819;
        --user: #1d2c25;
        --danger: #e59a88;
        --danger-soft: #2b1b17;
        --neg: #e59a88;
        --code: #1b2922;
        --focus: #8fc0a8;
        --shadow: 0 1px 0 rgba(0, 0, 0, .2), 0 14px 36px -14px rgba(0, 0, 0, .6);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background: var(--paper);
      font: 400 16px/1.6 var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
    }

    button, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ---------- frame ---------- */

    .app {
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .column { width: min(var(--column), 100%); margin: 0 auto; padding: 0 var(--gutter); }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      padding-top: env(safe-area-inset-top);
    }

    .topbar .column {
      width: min(64rem, 100%);
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 60px;
    }

    .wordmark {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .wordmark h1 {
      margin: 0;
      font: 500 1.45rem/1 var(--serif);
      letter-spacing: -.01em;
    }

    .wordmark h1::after {
      content: "";
      display: inline-block;
      width: 5px; height: 5px;
      margin-left: 3px;
      border-radius: 50%;
      background: var(--brass);
      vertical-align: .08em;
    }

    .profile {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: .8125rem;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .profile strong { color: var(--ink-soft); font-weight: 600; }

    .ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: transparent;
      color: var(--ink-soft);
      font-size: .8125rem;
      font-weight: 600;
      white-space: nowrap;
      transition: background .15s ease, border-color .15s ease;
    }

    .ghost:hover:not(:disabled) { background: var(--surface); border-color: var(--muted); }
    .ghost:disabled { opacity: .5; cursor: default; }
    .ghost svg { flex: none; }

    .conversation {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .conversation .column { padding-top: clamp(24px, 6vh, 56px); padding-bottom: 32px; }

    .messages { display: flex; flex-direction: column; gap: 28px; }

    /* ---------- messages ---------- */

    .message { animation: arrive .28s cubic-bezier(.2, .7, .2, 1); min-width: 0; }

    .message.user { align-self: flex-end; max-width: min(85%, 36rem); }

    .message.user .bubble {
      padding: 11px 16px;
      border-radius: 18px 18px 6px 18px;
      background: var(--user);
      color: var(--ink);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .who {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .who::before {
      content: "W";
      display: grid;
      place-items: center;
      width: 22px; height: 22px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--accent);
      font: 500 .75rem/1 var(--serif);
      letter-spacing: 0;
    }

    .answer { color: var(--ink); overflow-wrap: break-word; }
    .answer > :first-child { margin-top: 0; }
    .answer > :last-child { margin-bottom: 0; }
    .answer p { margin: 0 0 .85em; }
    .answer h2, .answer h3, .answer h4, .answer h5 {
      margin: 1.5em 0 .5em;
      font-family: var(--serif);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -.005em;
    }
    .answer h2 { font-size: 1.3rem; }
    .answer h3 { font-size: 1.12rem; }
    .answer h4, .answer h5 { font-size: 1rem; }
    .answer ul, .answer ol { margin: 0 0 .9em; padding-left: 1.4em; }
    .answer li { margin: .25em 0; padding-left: .2em; }
    .answer li::marker { color: var(--muted); }
    .answer ol li::marker { font-variant-numeric: tabular-nums; }
    .answer strong { font-weight: 650; }
    .answer a, .message.user a {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
    }
    .answer a:hover { text-decoration-color: currentColor; }
    .answer hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }

    .answer code {
      padding: .1em .35em;
      border-radius: 5px;
      background: var(--code);
      font: .88em/1.4 var(--mono);
    }

    .answer pre {
      margin: 0 0 1em;
      padding: 14px 16px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--code);
    }
    .answer pre code { padding: 0; background: none; font-size: .85rem; line-height: 1.55; }

    .answer blockquote {
      margin: 0 0 1em;
      padding: 2px 0 2px 16px;
      border-left: 2px solid var(--brass);
      color: var(--ink-soft);
    }

    .table-wrap {
      margin: 0 0 1.1em;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .answer table {
      width: 100%;
      border-collapse: collapse;
      font-size: .9rem;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .answer th, .answer td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .answer td:first-child, .answer th:first-child { white-space: normal; min-width: 7rem; }
    .answer tr:last-child td { border-bottom: 0; }
    .answer th {
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--paper);
    }
    .answer .num { text-align: right; }
    .answer .neg { color: var(--neg); }
    .answer .center { text-align: center; }

    .callout {
      margin: 0 0 1em;
      padding: 12px 16px 4px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--brass);
      border-radius: 4px 10px 10px 4px;
      background: color-mix(in srgb, var(--brass-soft) 55%, var(--surface));
      font-size: .94rem;
    }
    .callout[data-kind="missing"] { border-left-color: var(--danger); background: color-mix(in srgb, var(--danger-soft) 70%, var(--surface)); }
    .callout > :is(h2, h3, h4, h5):first-child {
      margin: 0 0 .4em;
      font: 600 .75rem/1.4 var(--sans);
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--brass);
    }
    .callout[data-kind="missing"] > :first-child { color: var(--danger); }

    .memory {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 5px 12px 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: .8125rem;
    }
    .memory svg { color: var(--brass); flex: none; }

    .attachments { display: flex; flex-wrap: wrap; gap: 6px; }
    .message.user .attachments { justify-content: flex-end; margin-bottom: 6px; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      min-height: 32px;
      padding: 4px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      font-size: .8125rem;
    }
    .chip .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14rem; }
    .chip .meta { color: var(--muted); font-size: .75rem; white-space: nowrap; }
    .chip.error { border-color: var(--danger); color: var(--danger); }
    .chip button {
      display: grid; place-items: center;
      width: 22px; height: 22px; margin-right: -4px;
      padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: var(--muted);
    }
    .chip button:hover { background: var(--paper-deep); color: var(--ink); }
    .chip .spin { width: 12px; height: 12px; border: 1.5px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }

    /* pending */

    .pending .status-line {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 28px;
      color: var(--ink-soft);
      font-size: .94rem;
    }
    .pulse { position: relative; width: 28px; height: 2px; overflow: hidden; border-radius: 2px; background: var(--line); flex: none; }
    .pulse::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      border-radius: 2px; background: var(--brass);
      animation: sweep 1.4s cubic-bezier(.45, 0, .55, 1) infinite;
    }
    .elapsed { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }

    /* errors */

    .alert {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 14px;
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
      border-radius: 12px;
      background: var(--danger-soft);
      color: var(--ink);
      font-size: .875rem;
      text-align: left;
    }
    .alert.quiet { border-color: var(--line); background: var(--surface); }
    .alert p { margin: 0; flex: 1 1 16rem; }
    .alert .detail { display: block; margin-top: 2px; color: var(--muted); font-size: .75rem; overflow-wrap: anywhere; }
    .alert code { font: .85em var(--mono); }
    .alert button {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      background: var(--surface);
      font-size: .8125rem;
      font-weight: 600;
    }

    /* empty state */

    .intro { padding-bottom: 8px; }
    .intro .greeting {
      margin: 0 0 14px;
      font: 400 clamp(1.9rem, 5vw, 2.6rem)/1.1 var(--serif);
      letter-spacing: -.02em;
    }
    .intro .lede { margin: 0; max-width: 36rem; color: var(--ink-soft); font-size: 1.02rem; }
    .starters { display: grid; gap: 8px; margin-top: 28px; }
    .starter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
      min-height: 52px;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      text-align: left;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .starter:hover { border-color: var(--line-strong); box-shadow: var(--shadow); transform: translateY(-1px); }
    .starter span { font-weight: 500; }
    .starter svg { color: var(--muted); flex: none; }

    /* ---------- composer ---------- */

    .dock {
      position: relative;
      padding: 0 0 max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(to bottom, transparent, var(--paper) 22px);
      margin-top: -22px;
      padding-top: 22px;
    }

    .composer {
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer:focus-within {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent), var(--shadow);
    }

    .composer .attachments { padding: 10px 12px 0; }
    .composer .attachments:empty { display: none; }

    textarea {
      display: block;
      width: 100%;
      min-height: 52px;
      max-height: 40vh;
      padding: 15px 18px 6px;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.5;
    }
    textarea:focus-visible { outline: none; }
    textarea::placeholder { color: var(--muted); opacity: 1; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px 8px 10px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 36px; height: 36px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      flex: none;
    }
    .icon-button:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
    .icon-button:disabled { opacity: .45; cursor: default; }

    .depth { display: flex; align-items: center; gap: 10px; min-width: 0; margin: 0; padding: 0; border: 0; }
    .segmented {
      display: inline-flex;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--paper);
    }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented label {
      padding: 4px 11px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .8125rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background .15s ease, color .15s ease;
    }
    .segmented input:checked + label { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
    .segmented input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }
    .segmented input:disabled + label { cursor: default; opacity: .6; }
    .depth-hint { color: var(--muted); font-size: .75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .send {
      display: grid;
      place-items: center;
      width: 40px; height: 40px;
      margin-left: auto;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      flex: none;
      transition: background .15s ease, opacity .15s ease, transform .1s ease;
    }
    .send:hover:not(:disabled) { background: var(--accent-hover); }
    .send:active:not(:disabled) { transform: scale(.95); }
    .send:disabled { opacity: .35; cursor: default; }
    .send .stop-icon { display: none; }
    .send.stopping .stop-icon { display: block; }
    .send.stopping .send-icon { display: none; }

    .footnote {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 6px 0;
      color: var(--muted);
      font-size: .75rem;
    }
    .footnote details { text-align: right; }
    .footnote summary { cursor: pointer; list-style: none; }
    .footnote summary::-webkit-details-marker { display: none; }
    .footnote summary:hover { color: var(--ink); }
    .footnote details p { margin: 6px 0 0; max-width: 30rem; text-align: left; }

    .drop {
      position: fixed;
      inset: 12px;
      z-index: 10;
      display: none;
      place-items: center;
      border: 2px dashed var(--accent);
      border-radius: 20px;
      background: color-mix(in srgb, var(--paper) 88%, transparent);
      color: var(--accent);
      font: 500 1.2rem var(--serif);
      pointer-events: none;
    }
    .drop.active { display: grid; }

    .fatal { margin: 12vh auto 0; max-width: 28rem; text-align: center; color: var(--ink-soft); }
    .fatal h2 { font: 400 1.6rem var(--serif); margin: 0 0 8px; color: var(--ink); }

    @keyframes arrive { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes sweep { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .profile .model { display: none; }
      .ghost .label { display: none; }
      .ghost { width: 36px; padding: 0; justify-content: center; }
      .message.user { max-width: 92%; }
      .depth-hint { display: none; }
      .footnote { flex-direction: column; gap: 2px; }
      .footnote details { text-align: left; }
      .answer th, .answer td { padding: 8px 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="column">
        <div class="wordmark">
          <h1>Wealth</h1>
          <span class="profile" id="profile">Connecting…</span>
        </div>
        <button class="ghost" id="new-chat" type="button" disabled title="Start a new conversation. Saved memory is kept.">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span class="label">New conversation</span>
          <span class="sr-only">New conversation</span>
        </button>
      </div>
    </header>

    <main class="conversation" id="conversation" aria-label="Conversation">
      <div class="column">
        <div class="messages" id="messages"></div>
      </div>
    </main>

    <div class="dock">
      <div class="column">
        <form class="composer" id="chat-form" novalidate>
          <div class="attachments" id="tray" aria-label="Attachments"></div>
          <label class="sr-only" for="input">Message</label>
          <textarea id="input" rows="1" placeholder="Ask about your finances…" disabled></textarea>
          <div class="toolbar">
            <button class="icon-button" id="attach" type="button" aria-label="Attach a file (PDF, CSV or image)" title="Attach PDF, CSV or image" disabled>
              <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.5 12.4 19.6a5 5 0 0 1-7.1-7.1l8.3-8.3a3.3 3.3 0 0 1 4.7 4.7l-8.2 8.2a1.7 1.7 0 0 1-2.4-2.4l7.5-7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <input type="file" id="file" hidden multiple accept=".pdf,.csv,.png,.jpg,.jpeg,.webp,application/pdf,text/csv,image/png,image/jpeg,image/webp">
            <fieldset class="depth" id="depth">
              <legend class="sr-only">Response depth</legend>
              <div class="segmented">
                <input type="radio" name="depth" id="depth-low" value="low" checked><label for="depth-low">Fast</label>
                <input type="radio" name="depth" id="depth-medium" value="medium"><label for="depth-medium">Balanced</label>
                <input type="radio" name="depth" id="depth-high" value="high"><label for="depth-high">Deep</label>
              </div>
              <span class="depth-hint" id="depth-hint" aria-live="off"></span>
            </fieldset>
            <button class="send" id="send" type="submit" aria-label="Send message" disabled>
              <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
        <div class="footnote">
          <span id="capabilities">Memory stays on this computer</span>
          <details>
            <summary>Privacy &amp; capabilities</summary>
            <p id="privacy">Client memory and attachments are stored on this computer. Messages and selected context are sent to the model provider; research uses external search and market-data services.</p>
          </details>
        </div>
      </div>
    </div>
  </div>
  <div class="drop" id="drop" aria-hidden="true">Drop PDF, CSV or image to attach</div>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>

  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const conversation = $('conversation'), messages = $('messages'), form = $('chat-form');
    const input = $('input'), send = $('send'), attachButton = $('attach'), fileInput = $('file');
    const tray = $('tray'), live = $('live'), profile = $('profile'), newChat = $('new-chat');
    const depthHint = $('depth-hint'), capabilities = $('capabilities'), privacy = $('privacy'), drop = $('drop');
    const coarse = window.matchMedia('(pointer: coarse)');

    const HINTS = { low: 'Usually under a minute', medium: 'Often a few minutes', high: 'Can take several minutes' };
    const CLIENT_ERRORS = {
      connection: 'Lost connection to Wealth. Make sure the local server is still running, then retry.',
      gone: 'This response was interrupted when the server restarted. Retry to ask again.',
      busy: 'Another response is still in progress.',
      forbidden: 'This page lost its session. Reload to reconnect.'
    };
    const UPLOAD_TYPES = { pdf: 'application/pdf', csv: 'text/csv', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp' };

    let token = '';
    let busy = false;
    let current = null;   // { id, userNode, pendingNode, abort, message, attachments, stopped }
    let pendingUploads = [];
    let uploadLimit = 25 * 1024 * 1024;
    let stick = true;

    // ------------------------------------------------------------------ helpers

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    const svg = (path, size = 14) => {
      const ns = 'http://www.w3.org/2000/svg';
      const s = document.createElementNS(ns, 'svg');
      s.setAttribute('width', size); s.setAttribute('height', size);
      s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('aria-hidden', 'true');
      const p = document.createElementNS(ns, 'path');
      p.setAttribute('d', path); p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'currentColor');
      p.setAttribute('stroke-width', '1.8'); p.setAttribute('stroke-linecap', 'round'); p.setAttribute('stroke-linejoin', 'round');
      s.append(p);
      return s;
    };

    const nearBottom = () => conversation.scrollHeight - conversation.scrollTop - conversation.clientHeight < 96;
    conversation.addEventListener('scroll', () => { stick = nearBottom(); }, { passive: true });
    const follow = (force = false) => {
      if (!force && !stick) return;
      requestAnimationFrame(() => { conversation.scrollTop = conversation.scrollHeight; stick = true; });
    };

    const formatSize = bytes => bytes < 1024 ? `${bytes} B` : bytes < 1048576 ? `${Math.round(bytes / 1024)} KB` : `${(bytes / 1048576).toFixed(1)} MB`;
    const depth = () => (form.querySelector('input[name="depth"]:checked') || {}).value || 'low';
    const timezone = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (_) { return ''; } };

    // ------------------------------------------------------------------ markdown (DOM only)

    function safeUrl(raw) {
      try {
        const url = new URL(raw);
        return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
      } catch (_) { return null; }
    }

    function link(text, href) {
      const url = safeUrl(href);
      if (!url) return document.createTextNode(text);
      const a = el('a', '', text);
      a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      return a;
    }

    const INLINE = /(`+)([^`]+?)\1|\*\*(?=\S)([\s\S]+?)\*\*|__(?=\S)([\s\S]+?)__|\[([^\]\n]+)\]\(\s*<?(https?:\/\/[^\s)>]+)>?\s*\)|(https?:\/\/[^\s<>()]+(?:\([^\s<>()]*\)[^\s<>()]*)*)|(?<![\w*])\*(?=\S)([^*\n]+?)\*(?![\w*])|(?<![\w_])_(?=\S)([^_\n]+?)_(?![\w_])/g;

    function inline(parent, text) {
      let cursor = 0, match;
      INLINE.lastIndex = 0;
      const pattern = new RegExp(INLINE.source, 'g');
      while ((match = pattern.exec(text)) !== null) {
        if (match.index > cursor) parent.append(document.createTextNode(text.slice(cursor, match.index)));
        if (match[2] !== undefined) parent.append(el('code', '', match[2]));
        else if (match[3] !== undefined || match[4] !== undefined) { const b = el('strong'); inline(b, match[3] ?? match[4]); parent.append(b); }
        else if (match[5] !== undefined) parent.append(link(match[5], match[6]));
        else if (match[7] !== undefined) {
          let url = match[7], trail = '';
          const m = url.match(/[.,;:!?'"]+$/);
          if (m) { trail = m[0]; url = url.slice(0, -trail.length); }
          parent.append(link(url, url));
          if (trail) parent.append(document.createTextNode(trail));
        }
        else if (match[8] !== undefined || match[9] !== undefined) { const i = el('em'); inline(i, match[8] ?? match[9]); parent.append(i); }
        cursor = pattern.lastIndex;
      }
      if (cursor < text.length) parent.append(document.createTextNode(text.slice(cursor)));
    }

    function inlineLines(parent, lines) {
      lines.forEach((line, i) => {
        if (i) parent.append(el('br'));
        inline(parent, line);
      });
    }

    const NUMERIC = /^[(]?\s*[-−+]?\s*[$€£¥₹]?\s*[-−+]?\d[\d,]*(\.\d+)?\s*(%|x|×|bps?|pp|[kKmMbB]n?|MXN|USD|EUR)?\s*[)]?$/;
    const NEGATIVE = /^\s*(\(\s*[$€£¥₹]?\s*\d|[-−]\s*[$€£¥₹]?\s*\d|[$€£¥₹]\s*[-−]\s*\d)/;
    const splitRow = line => {
      let s = line.trim();
      if (s.startsWith('|')) s = s.slice(1);
      if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
      return s.split(/(?<!\\)\|/).map(c => c.replace(/\\\|/g, '|').trim());
    };
    const isDivider = line => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(line) && line.includes('-');

    function table(head, divider, rows) {
      const aligns = splitRow(divider).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'num' : '');
      const width = head.length;
      const numeric = head.map((_, i) => {
        const cells = rows.map(r => (r[i] || '').replace(/\*\*/g, '')).filter(c => c && c !== '—' && c !== '-' && c.toLowerCase() !== 'n/a');
        return cells.length > 0 && cells.filter(c => NUMERIC.test(c)).length >= Math.ceil(cells.length * 0.6);
      });
      const wrap = el('div', 'table-wrap');
      wrap.tabIndex = 0;
      wrap.setAttribute('role', 'region');
      wrap.setAttribute('aria-label', 'Table');
      const t = el('table');
      const thead = el('thead'), tr = el('tr');
      head.forEach((cell, i) => {
        const th = el('th'); th.scope = 'col';
        const cls = aligns[i] || (numeric[i] && i > 0 ? 'num' : '');
        if (cls) th.className = cls;
        inline(th, cell); tr.append(th);
      });
      thead.append(tr); t.append(thead);
      const tbody = el('tbody');
      rows.forEach(row => {
        const r = el('tr');
        for (let i = 0; i < width; i += 1) {
          const cell = row[i] || '';
          const td = el('td');
          const classes = [];
          const cls = aligns[i] || (numeric[i] && i > 0 ? 'num' : '');
          if (cls) classes.push(cls);
          if ((numeric[i] || aligns[i] === 'num') && NEGATIVE.test(cell.replace(/\*\*/g, ''))) classes.push('neg');
          if (classes.length) td.className = classes.join(' ');
          inline(td, cell); r.append(td);
        }
        tbody.append(r);
      });
      t.append(tbody); wrap.append(t);
      return wrap;
    }

    const LIST_ITEM = /^(\s*)([-*+•]|\d{1,3}[.)])\s+(.*)$/;

    function list(lines, start) {
      // Returns [element, nextIndex]; nests items indented beyond the first.
      const first = lines[start].match(LIST_ITEM);
      const baseIndent = first[1].replace(/\t/g, '    ').length;
      const ordered = /\d/.test(first[2]);
      const node = el(ordered ? 'ol' : 'ul');
      if (ordered && parseInt(first[2], 10) !== 1) node.start = parseInt(first[2], 10);
      let i = start, item = null, buffer = [];
      const flush = () => { if (item && buffer.length) { inlineLines(item, buffer); buffer = []; } };
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) {
          const next = lines[i + 1];
          if (next && LIST_ITEM.test(next) && next.match(LIST_ITEM)[1].length >= baseIndent) { i += 1; continue; }
          break;
        }
        const m = line.match(LIST_ITEM);
        if (m) {
          const indent = m[1].replace(/\t/g, '    ').length;
          if (indent < baseIndent) break;
          if (indent >= baseIndent + 2 && item) {
            flush();
            const [child, next] = list(lines, i);
            item.append(child); i = next; continue;
          }
          if (/\d/.test(m[2]) !== ordered) break;
          flush();
          item = el('li'); node.append(item); buffer = [m[3]]; i += 1; continue;
        }
        if (item && /^\s+\S/.test(line)) { buffer.push(line.trim()); i += 1; continue; }
        break;
      }
      flush();
      return [node, i];
    }

    const CALLOUT = /^(key\s+)?(assumptions?|missing\s+(data|information|inputs?)|what(?:'|’)?s\s+missing|data\s+gaps?)\b[:\s]*$/i;

    function markdown(container, source) {
      const lines = String(source ?? '').replace(/\r\n?/g, '\n').split('\n');
      const blocks = [];
      let i = 0;
      while (i < lines.length) {
        const line = lines[i];
        if (!line.trim()) { i += 1; continue; }
        const fence = line.match(/^\s*(```|~~~)\s*([\w+-]*)\s*$/);
        if (fence) {
          const body = [];
          i += 1;
          while (i < lines.length && !lines[i].trim().startsWith(fence[1])) { body.push(lines[i]); i += 1; }
          i += 1;
          const pre = el('pre'), code = el('code', '', body.join('\n'));
          if (fence[2]) code.dataset.lang = fence[2];
          pre.append(code); blocks.push({ node: pre });
          continue;
        }
        const heading = line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          const level = Math.min(5, Math.max(2, heading[1].length + 1));
          const h = el(`h${level}`); inline(h, heading[2]);
          blocks.push({ node: h, heading: level, text: heading[2].replace(/[*_`]/g, '').trim() });
          i += 1; continue;
        }
        if (/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { blocks.push({ node: el('hr') }); i += 1; continue; }
        if (line.includes('|') && i + 1 < lines.length && isDivider(lines[i + 1])) {
          const head = splitRow(line), divider = lines[i + 1], rows = [];
          i += 2;
          while (i < lines.length && lines[i].includes('|') && lines[i].trim()) { rows.push(splitRow(lines[i])); i += 1; }
          blocks.push({ node: table(head, divider, rows) });
          continue;
        }
        if (/^\s{0,3}>/.test(line)) {
          const body = [];
          while (i < lines.length && /^\s{0,3}>/.test(lines[i])) { body.push(lines[i].replace(/^\s{0,3}>\s?/, '')); i += 1; }
          const q = el('blockquote'); markdown(q, body.join('\n'));
          blocks.push({ node: q });
          continue;
        }
        if (LIST_ITEM.test(line)) {
          const [node, next] = list(lines, i);
          blocks.push({ node }); i = next; continue;
        }
        const para = [];
        while (i < lines.length && lines[i].trim() && !LIST_ITEM.test(lines[i]) && !/^\s{0,3}(#{1,6}\s|>|```|~~~)/.test(lines[i])
               && !(lines[i].includes('|') && i + 1 < lines.length && isDivider(lines[i + 1]))) {
          para.push(lines[i].trim()); i += 1;
        }
        // A bold-only line such as "**Assumptions**" acts as a heading for callouts.
        const boldOnly = para.length === 1 && para[0].match(/^\*\*([^*]+?):?\*\*:?$/);
        const p = el('p'); inlineLines(p, para);
        blocks.push(boldOnly ? { node: p, heading: 6, text: boldOnly[1].trim() } : { node: p });
      }
      // Group "Assumptions" / "Missing data" sections into callouts.
      for (let b = 0; b < blocks.length; b += 1) {
        const block = blocks[b];
        if (block.heading && CALLOUT.test(block.text)) {
          const aside = el('aside', 'callout');
          aside.dataset.kind = /assum/i.test(block.text) ? 'assumptions' : 'missing';
          aside.setAttribute('aria-label', block.text);
          let node = block.node;
          if (block.heading === 6) { node = el('h4'); node.textContent = block.text; }
          aside.append(node);
          let j = b + 1;
          // The section ends at the next heading, after its first list, or after three paragraphs.
          let taken = 0;
          while (j < blocks.length && !blocks[j].heading && taken < 3) {
            const node = blocks[j].node;
            aside.append(node); j += 1; taken += 1;
            if (node.tagName === 'UL' || node.tagName === 'OL') break;
          }
          container.append(aside);
          b = j - 1;
        } else {
          container.append(block.node);
        }
      }
    }

    // ------------------------------------------------------------------ rendering

    function attachmentChips(items) {
      const box = el('div', 'attachments');
      items.forEach(item => {
        const chip = el('span', 'chip');
        chip.append(svg('M7 3h7l5 5v13H7zM14 3v5h5', 15));
        chip.append(el('span', 'name', item.name || 'file'));
        if (item.size) chip.append(el('span', 'meta', formatSize(item.size)));
        box.append(chip);
      });
      return box;
    }

    function userMessage(text, attachments = []) {
      const article = el('article', 'message user');
      article.setAttribute('aria-label', 'You');
      if (attachments.length) article.append(attachmentChips(attachments));
      article.append(el('div', 'bubble', text));
      messages.append(article);
      return article;
    }

    function assistantMessage(content, options = {}) {
      const article = el('article', 'message assistant');
      article.setAttribute('aria-label', 'Wealth');
      article.append(el('p', 'who', 'Wealth'));
      const body = el('div', 'answer');
      markdown(body, content);
      article.append(body);
      if (options.memory && options.memory.length) {
        const chip = el('div', 'memory');
        chip.append(svg('M5 12.5 10 17 19 7', 14));
        chip.append(document.createTextNode(`Saved to memory: ${options.memory.join(', ')}`));
        article.append(chip);
      }
      messages.append(article);
      if (options.announce) {
        live.textContent = '';
        setTimeout(() => { live.textContent = `Wealth replied. ${(body.innerText || body.textContent).slice(0, 1200)}`; }, 50);
      }
      return article;
    }

    function pendingMessage(stepText = '') {
      const article = el('article', 'message assistant pending');
      article.append(el('p', 'who', 'Wealth'));
      const line = el('div', 'status-line');
      line.append(el('span', 'pulse'));
      const step = el('span', 'step', stepText || 'Working on it');
      step.setAttribute('role', 'status');
      const elapsed = el('span', 'elapsed');
      elapsed.setAttribute('aria-hidden', 'true');
      line.append(step, elapsed);
      article.append(line);
      messages.append(article);
      const started = Date.now() - (current && current.elapsed ? current.elapsed * 1000 : 0);
      const tick = () => {
        const s = Math.floor((Date.now() - started) / 1000);
        elapsed.textContent = s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
      };
      tick();
      article._timer = setInterval(tick, 1000);
      article._step = step;
      return article;
    }

    function clearPending(node) {
      if (!node) return;
      clearInterval(node._timer);
      node.remove();
    }

    function showError(userNode, error, retry) {
      if (!userNode) return;
      const prior = userNode.querySelector('.alert');
      if (prior) prior.remove();
      const kind = error.kind || 'other';
      const box = el('div', kind === 'cancelled' ? 'alert quiet' : 'alert');
      box.setAttribute('role', 'alert');
      const p = el('p');
      const message = error.message || CLIENT_ERRORS[kind] || 'Something went wrong.';
      // Render `codex login` style hints as code without using innerHTML.
      message.split(/(`[^`]+`)/).forEach(part => {
        p.append(part.startsWith('`') && part.endsWith('`') ? el('code', '', part.slice(1, -1)) : document.createTextNode(part));
      });
      if (error.detail && kind !== 'cancelled') p.append(el('span', 'detail', error.detail));
      box.append(p);
      if (retry) {
        const button = el('button', '', kind === 'cancelled' ? 'Ask again' : 'Retry');
        button.type = 'button';
        button.addEventListener('click', () => { box.remove(); retry(); });
        box.append(button);
      }
      userNode.append(box);
      follow();
    }

    function renderIntro(state) {
      const box = el('section', 'intro');
      box.setAttribute('aria-label', 'Welcome');
      const hour = new Date().getHours();
      const greeting = hour < 5 ? 'Good evening.' : hour < 12 ? 'Good morning.' : hour < 18 ? 'Good afternoon.' : 'Good evening.';
      box.append(el('h2', 'greeting', greeting));
      box.append(el('p', 'lede', state.welcome || 'Welcome back. What’s on your mind today?'));
      const starters = Array.isArray(state.starters) ? state.starters.slice(0, 3) : [];
      if (starters.length) {
        const grid = el('div', 'starters');
        starters.forEach(item => {
          const button = el('button', 'starter');
          button.type = 'button';
          button.append(el('span', '', String(item.label || item.prompt)));
          button.append(svg('M5 12h14M13 6l6 6-6 6', 16));
          button.addEventListener('click', () => {
            if (item.send) { submit(String(item.prompt)); return; }
            input.value = String(item.prompt);
            resize();
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          });
          grid.append(button);
        });
        box.append(grid);
      }
      messages.append(box);
    }

    const removeIntro = () => { const intro = messages.querySelector('.intro'); if (intro) intro.remove(); };

    // ------------------------------------------------------------------ network

    async function refreshToken() {
      const response = await fetch('/api/state', { credentials: 'same-origin', cache: 'no-store' });
      const state = await response.json().catch(() => ({}));
      if (response.ok && state.csrf_token) token = String(state.csrf_token);
      return state;
    }

    async function api(path, options = {}, retried = false) {
      const headers = Object.assign({}, options.headers || {}, { 'X-Wealth-Token': token });
      let response;
      try {
        response = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, options, { headers }));
      } catch (err) {
        if (err && err.name === 'AbortError') throw err;
        const e = new Error(CLIENT_ERRORS.connection); e.kind = 'connection'; throw e;
      }
      if (response.status === 403 && !retried) {
        // The server may have restarted with a new session token.
        try { await refreshToken(); } catch (_) { /* fall through */ }
        return api(path, options, true);
      }
      return response;
    }

    async function json(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const e = new Error(data.error || `Request failed (${response.status})`);
        e.kind = data.kind || (response.status === 409 ? 'busy' : response.status === 404 ? 'gone' : 'other');
        e.detail = data.detail || '';
        throw e;
      }
      return data;
    }

    // Read the server-sent-event stream with fetch so the session token travels in a header.
    async function stream(turnId, after, onEvent, signal) {
      const response = await api(`/api/turns/${turnId}/events?after=${after}`, { signal });
      if (!response.ok) await json(response);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', done = false;
      while (!done) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        let split;
        while ((split = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, split);
          buffer = buffer.slice(split + 2);
          const data = block.split('\n').filter(l => l.startsWith('data: ')).map(l => l.slice(6)).join('\n');
          if (!data) continue;
          let event;
          try { event = JSON.parse(data); } catch (_) { continue; }
          onEvent(event);
          if (event.type === 'done') done = true;
        }
      }
      return done;
    }

    // ------------------------------------------------------------------ turns

    function setBusy(value) {
      busy = value;
      send.classList.toggle('stopping', value);
      send.setAttribute('aria-label', value ? 'Stop response' : 'Send message');
      send.type = value ? 'button' : 'submit';
      newChat.disabled = value;
      form.querySelectorAll('input[name="depth"]').forEach(r => { r.disabled = value; });
      refreshSend();
    }

    function refreshSend() {
      const uploading = pendingUploads.some(u => u.state === 'uploading');
      send.disabled = busy ? false : (uploading || (!input.value.trim() && !pendingUploads.some(u => u.state === 'ready')));
    }

    function resize() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, window.innerHeight * 0.4)}px`;
      refreshSend();
    }

    function finish(turn) {
      clearPending(turn.pendingNode);
      if (current === turn) current = null;
      setBusy(false);
      if (!coarse.matches && (document.activeElement === document.body || document.activeElement === send)) input.focus();
    }

    function handle(turn, event) {
      turn.after = Math.max(turn.after || 0, event.seq || 0);
      if (event.type === 'progress' && turn.pendingNode) {
        if (turn.pendingNode._step.textContent !== event.text) turn.pendingNode._step.textContent = event.text;
      } else if (event.type === 'answer') {
        clearPending(turn.pendingNode);
        turn.pendingNode = null;
        const m = event.message || {};
        assistantMessage(m.content || '', { memory: m.memory, announce: true });
        turn.answered = true;
        follow();
      } else if (event.type === 'error') {
        clearPending(turn.pendingNode);
        turn.pendingNode = null;
        turn.failed = true;
        showError(turn.userNode, event, () => submit(turn.message, turn.attachments, turn.userNode));
      } else if (event.type === 'done') {
        finish(turn);
      }
    }

    async function track(turn) {
      turn.abort = new AbortController();
      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          const done = await stream(turn.id, turn.after || 0, event => handle(turn, event), turn.abort.signal);
          if (done) return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          if (err && err.kind === 'gone') break;
        }
        // The stream dropped: poll until the turn is visible again, then reattach.
        if (await poll(turn)) return;
      }
      if (current === turn) {
        clearPending(turn.pendingNode);
        showError(turn.userNode, { kind: 'gone', message: CLIENT_ERRORS.gone }, () => submit(turn.message, turn.attachments, turn.userNode));
        finish(turn);
      }
    }

    async function poll(turn) {
      for (let i = 0; i < 40; i += 1) {
        await new Promise(r => setTimeout(r, 1500));
        if (current !== turn) return true;
        let state;
        try { state = await refreshToken(); } catch (_) { continue; }
        if (!state || !state.csrf_token) continue;
        if (state.turn && state.turn.id === turn.id && state.turn.status === 'running') return false;
        // Finished while we were disconnected: replay from the server's record.
        const replay = (state.messages || []).slice(-1)[0];
        if (!state.turn && replay && replay.role === 'assistant' && !turn.answered) {
          handle(turn, { type: 'answer', message: replay });
          handle(turn, { type: 'done' });
          return true;
        }
        if (state.turn && state.turn.id === turn.id && state.turn.error) {
          handle(turn, Object.assign({ type: 'error' }, state.turn.error));
          handle(turn, { type: 'done' });
          return true;
        }
        return false;
      }
      return false;
    }

    async function submit(text, attachments = null, existingNode = null) {
      const message = String(text || '').trim();
      const files = attachments || pendingUploads.filter(u => u.state === 'ready').map(u => u.meta);
      if (busy || (!message && !files.length)) return;
      removeIntro();
      const userNode = existingNode || userMessage(message || 'I’ve attached a file.', files);
      const alert = userNode.querySelector('.alert');
      if (alert) alert.remove();
      if (!attachments) {
        input.value = '';
        pendingUploads = [];
        tray.replaceChildren();
        resize();
      }
      const turn = { message, attachments: files, userNode, after: 0 };
      current = turn;
      setBusy(true);
      turn.pendingNode = pendingMessage();
      follow(true);
      try {
        const response = await api('/api/turns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, reasoning: depth(), attachments: files.map(f => f.id), timezone: timezone() })
        });
        const data = await json(response);
        turn.id = data.turn.id;
      } catch (err) {
        clearPending(turn.pendingNode);
        showError(userNode, { kind: err.kind || 'other', message: err.message, detail: err.detail }, () => submit(message, files, userNode));
        finish(turn);
        return;
      }
      track(turn);
    }

    async function stop() {
      const turn = current;
      if (!turn || !turn.id || turn.stopping) return;
      turn.stopping = true;
      if (turn.pendingNode) turn.pendingNode._step.textContent = 'Stopping…';
      try { await api(`/api/turns/${turn.id}/cancel`, { method: 'POST' }); } catch (_) { /* the stream reports the outcome */ }
    }

    // ------------------------------------------------------------------ attachments

    function typeFor(file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      return UPLOAD_TYPES[ext] || (Object.values(UPLOAD_TYPES).includes(file.type) ? file.type : '');
    }

    function renderTray() {
      tray.replaceChildren();
      pendingUploads.forEach(upload => {
        const chip = el('span', `chip${upload.state === 'error' ? ' error' : ''}`);
        if (upload.state === 'uploading') chip.append(el('span', 'spin'));
        else chip.append(svg(upload.state === 'error' ? 'M12 8v5M12 16.5v.5M4 20h16L12 4z' : 'M7 3h7l5 5v13H7zM14 3v5h5', 15));
        chip.append(el('span', 'name', upload.name));
        chip.append(el('span', 'meta', upload.state === 'error' ? upload.error : formatSize(upload.size)));
        const remove = el('button');
        remove.type = 'button';
        remove.setAttribute('aria-label', `Remove ${upload.name}`);
        remove.append(svg('M6 6l12 12M18 6 6 18', 12));
        remove.addEventListener('click', () => { pendingUploads = pendingUploads.filter(u => u !== upload); renderTray(); refreshSend(); });
        chip.append(remove);
        tray.append(chip);
      });
      refreshSend();
    }

    async function addFiles(fileList) {
      for (const file of Array.from(fileList || [])) {
        if (pendingUploads.length >= 5) break;
        const upload = { name: file.name, size: file.size, state: 'uploading' };
        pendingUploads.push(upload);
        const type = typeFor(file);
        if (!type) { Object.assign(upload, { state: 'error', error: 'Use PDF, CSV or image' }); continue; }
        if (file.size > uploadLimit) { Object.assign(upload, { state: 'error', error: 'Over 25 MB' }); continue; }
        if (!file.size) { Object.assign(upload, { state: 'error', error: 'Empty file' }); continue; }
        renderTray();
        try {
          const response = await api('/api/upload', {
            method: 'POST', body: file,
            headers: { 'Content-Type': type, 'X-Filename': encodeURIComponent(file.name) }
          });
          const data = await json(response);
          Object.assign(upload, { state: 'ready', meta: data.upload, name: data.upload.name });
        } catch (err) {
          Object.assign(upload, { state: 'error', error: err.message && err.message.length < 60 ? err.message : 'Upload failed' });
        }
        renderTray();
      }
      renderTray();
    }

    attachButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

    let dragDepth = 0;
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e) || !token) return; e.preventDefault(); dragDepth += 1; drop.classList.add('active'); });
    window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove('active'); });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); dragDepth = 0; drop.classList.remove('active');
      if (token) addFiles(e.dataTransfer.files);
    });

    // ------------------------------------------------------------------ composer

    input.addEventListener('input', resize);
    input.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
      if (event.shiftKey || event.altKey) return;
      if (coarse.matches && !event.metaKey && !event.ctrlKey) return; // touch keyboards: Enter is a newline
      event.preventDefault();
      if (!busy) form.requestSubmit();
    });
    form.addEventListener('submit', event => { event.preventDefault(); if (!busy) submit(input.value); });
    send.addEventListener('click', event => { if (busy) { event.preventDefault(); stop(); } });
    form.querySelectorAll('input[name="depth"]').forEach(radio => radio.addEventListener('change', () => { depthHint.textContent = HINTS[depth()]; }));

    newChat.addEventListener('click', async () => {
      if (busy) return;
      newChat.disabled = true;
      try {
        const state = await json(await api('/api/reset', { method: 'POST' }));
        pendingUploads = []; renderTray();
        messages.replaceChildren();
        renderIntro(state);
        input.value = ''; resize();
        if (!coarse.matches) input.focus();
      } catch (err) {
        live.textContent = err.message;
      } finally {
        newChat.disabled = busy;
      }
    });

    // ------------------------------------------------------------------ start

    async function initialize() {
      let state;
      try {
        state = await refreshToken();
        if (!token) throw new Error(state.error || 'Could not load your session.');
      } catch (err) {
        const box = el('div', 'fatal');
        box.append(el('h2', '', 'Wealth isn’t reachable'));
        box.append(el('p', '', 'Start it again with uv run wealth-chat, then reload this page.'));
        messages.append(box);
        profile.textContent = 'Offline';
        return;
      }
      profile.replaceChildren();
      profile.append(el('strong', '', state.display_name || 'Personal'), document.createTextNode(' · Private profile'));
      if (state.model) { const m = el('span', 'model', ` · ${state.model}`); profile.append(m); }
      const web = state.capabilities && state.capabilities.web_search === true;
      capabilities.textContent = `Memory stays on this computer · Web search ${web ? 'on' : 'off'}`;
      privacy.append(document.createTextNode(web ? ' Web search is enabled.' : ' Web search is disabled.'));
      if (state.uploads && state.uploads.max_bytes) uploadLimit = state.uploads.max_bytes;
      const level = form.querySelector(`input[name="depth"][value="${state.reasoning}"]`);
      if (level) level.checked = true;
      depthHint.textContent = HINTS[depth()];

      const history = Array.isArray(state.messages) ? state.messages : [];
      if (!history.length && !(state.turn && state.turn.message)) renderIntro(state);
      history.forEach(item => {
        if (!item || typeof item.content !== 'string') return;
        if (item.role === 'user') userMessage(item.content, item.attachments || []);
        else if (item.role === 'assistant') assistantMessage(item.content, { memory: item.memory });
      });

      input.disabled = false;
      attachButton.disabled = false;
      newChat.disabled = false;

      const turn = state.turn;
      if (turn && turn.message) {
        const node = userMessage(turn.message, turn.attachments || []);
        const record = { id: turn.id, message: turn.message, attachments: turn.attachments || [], userNode: node, after: 0, elapsed: turn.elapsed };
        const retry = () => submit(record.message, record.attachments, node);
        if (turn.status === 'running') {
          current = record;
          setBusy(true);
          record.pendingNode = pendingMessage(turn.progress ? turn.progress : 'Response in progress');
          track(record);
        } else if (turn.error) {
          showError(node, turn.error, retry);
        }
      }
      resize();
      follow(true);
      if (!coarse.matches && !busy) input.focus();
    }

    initialize();
  })();
  </script>
</body>
</html>
