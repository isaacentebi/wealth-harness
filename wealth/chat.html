        place.dataset.label = placeLabel;
        const cancel = el('button', 'text-control', O.cancel); cancel.type = 'button';
        const ready = () => {
          const phrase = typed ? typed.value.trim().toUpperCase() : '';
          place.disabled = !!ticket.blocked || (agree && !agree.checked) || (typed && phrase !== 'LIVE' && phrase !== 'EN VIVO');
        };
        if (agree) agree.addEventListener('change', ready);
        if (typed) typed.addEventListener('input', ready);
        ready();
        place.addEventListener('click', () => placeOrders(ticket, { place, cancel, problem, agree, typed }));
        cancel.addEventListener('click', () => orderAction(ticket.id, 'cancel', { place, cancel, problem }));
        actions.append(place, cancel);
        box.append(problem, actions);
      } else if (ticket.status === 'placed') {
        const actions = el('div', 'actions');
        const problem = el('p', 'problem');
        problem.setAttribute('role', 'status');
        const undo = el('button', 'text-control', O.notPlaced); undo.type = 'button';
        undo.addEventListener('click', () => { undo.disabled = true; orderAction(ticket.id, 'cancel', { problem }); });
        actions.append(undo);
        box.append(el('p', 'settled', O.awaiting), problem, actions);
      } else if (ticket.status === 'expired' || ticket.status === 'void') {
        box.append(el('p', 'settled', O.expired));
      } else if (ticket.status === 'discarded') {
        box.append(el('p', 'settled', O.discarded));
      } else if ((ticket.lines || []).some(l => WORKING.has(l.state) && l.broker_order_id)) {
        const actions = el('div', 'actions');
        const stop = el('button', 'text-control', O.cancelOpen); stop.type = 'button';
        const problem = el('p', 'problem');
        problem.setAttribute('role', 'status');
        stop.addEventListener('click', async () => {
          stop.disabled = true;
          for (const line of ticket.lines) {
            if (WORKING.has(line.state) && line.broker_order_id) await orderAction(line.broker_order_id, 'cancel', { problem });
          }
        });
        actions.append(stop);
        box.append(problem, actions);
      }
      return box;
    }

    function showOrder(ticket) {
      const known = orderCards.get(ticket.id);
      if (!known && !['pending', 'submitting', 'submitted', 'placed', 'done'].includes(ticket.status)) return;
      const node = orderCard(ticket);
      if (known && messages.contains(known)) known.replaceWith(node);
      else messages.append(node);
      orderCards.set(ticket.id, node);
    }

    async function loadOrders() {
      let data;
      try { data = await json(await api('/api/orders')); } catch (_) { return; }
      (Array.isArray(data.tickets) ? data.tickets : []).forEach(showOrder);
      const working = (data.tickets || []).some(t => t.status === 'submitted');
      clearTimeout(orderPoll);
      if (working) orderPoll = setTimeout(loadOrders, 5000);
      follow();
    }

    // The person's tap is the only thing that places orders: the server also wants the card's code.
    async function placeOrders(ticket, ui) {
      ui.place.disabled = true; ui.cancel.disabled = true;
      ui.place.textContent = T.orders.placing;
      ui.problem.textContent = '';
      const body = { nonce: ticket.nonce, override: !!(ui.agree && ui.agree.checked) };
      if (ui.typed) body.typed = ui.typed.value.trim();
      await orderAction(ticket.id, 'confirm', ui, body);
    }

    async function orderAction(target, action, ui, body = null) {
      const options = { method: 'POST' };
      if (body) { options.headers = { 'Content-Type': 'application/json' }; options.body = JSON.stringify(body); }
      let data = {};
      try {
        const response = await api(`/api/orders/${encodeURIComponent(target)}/${action}`, options);
        data = await response.json().catch(() => ({}));
        if (!response.ok) {
          // A re-priced card comes back with its new lines and the place button; the card itself says why.
          if (data.ticket) showOrder(data.ticket);
          const node = data.ticket && orderCards.get(data.ticket.id);
          const problem = (node && node.querySelector('.problem')) || ui.problem;
          if (problem && !(data.kind === 'price_moved' && problem.textContent)) problem.textContent = data.kind === 'price_moved' ? T.orders.priceMoved : (data.error || T.errors.other);
          if (!data.ticket && ui.place) { ui.place.disabled = false; ui.place.textContent = ui.place.dataset.label || T.orders.place; }
          if (ui.cancel) ui.cancel.disabled = false;
          return;
        }
      } catch (err) {
        if (ui.problem) ui.problem.textContent = err.message || T.errors.connection;
        if (ui.place) { ui.place.disabled = false; ui.place.textContent = ui.place.dataset.label || T.orders.place; }
        if (ui.cancel) ui.cancel.disabled = false;
        return;
      }
      if (data.ticket) showOrder(data.ticket);
      loadOrders();
    }

    // ------------------------------------------------------------------ memory line

    // Items arrive as raw keys ("account.gbm-4321"), as the server's mechanical labels ("Account gbm 4321"),
    // or as objects {key, label, institution}. An explicit label wins; internal continuity notes never show.
    const LABEL_KEYS = [
      [/^accounts?\b\s*(.*)$/i, m => `account.${m[1]}`], [/^liabilit(?:y|ies)\b/i, () => 'liability'],
      [/^debts?\b/i, () => 'liability'], [/^income\b/i, () => 'income'], [/^thread\b/i, () => 'thread'],
      [/^goals?$/i, () => 'goals'], [/^planning resources$/i, () => 'plan.resources'], [/^profile$/i, () => 'client.profile'],
      [/^holdings$/i, () => 'household'], [/^portfolio$/i, () => 'portfolio.snapshot'],
      [/^preference\b/i, () => 'preference'], [/^constraint\b/i, () => 'constraint'], [/^decisions?\b/i, () => 'decision']
    ];
    const idOf = value => String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

    function institutionsFrom(...sources) {
      const found = {};
      const add = (id, name) => { if (id && typeof name === 'string' && name.trim()) found[idOf(id)] = name.trim(); };
      sources.forEach(source => {
        if (!source || typeof source !== 'object') return;
        const inst = source.institutions, accounts = source.accounts;
        if (inst && typeof inst === 'object' && !Array.isArray(inst)) Object.entries(inst).forEach(([id, name]) => add(id, name));
        if (Array.isArray(accounts)) accounts.forEach(a => a && add(a.id || a.account_id, a.institution || a.name));
        else if (accounts && typeof accounts === 'object') Object.entries(accounts).forEach(([id, a]) => add(id, a && typeof a === 'object' ? a.institution : a));
      });
      return found;
    }

    function memoryPhrase(items, lang, data = {}) {
      const M = STRINGS[lang].memory;
      const institutions = institutionsFrom(data.event, data.message);
      const named = data.event && data.event.labels && !Array.isArray(data.event.labels) ? data.event.labels : {};
      const accounts = new Map();   // institution ('' when unknown) -> count
      const phrases = [];
      const push = text => { if (text && !phrases.includes(text)) phrases.push(text); };
      (Array.isArray(items) ? items : []).forEach(item => {
        let key = '', label = '', institution = '';
        if (item && typeof item === 'object') {
          key = String(item.key || ''); label = String(item.label || ''); institution = String(item.institution || '');
        } else {
          const text = String(item || '').trim();
          if (/^[a-z][a-z0-9_]*(\.[\w.:-]+)?$/.test(text)) key = text;
          else {
            const hit = LABEL_KEYS.find(([pattern]) => pattern.test(text));
            if (hit) key = hit[1](text.match(hit[0])); else label = text;
          }
        }
        if (!label && typeof named[key] === 'string') label = named[key];
        const [head, ...rest] = key.split('.');
        const tail = rest.join('.');
        if (head === 'thread' || head === 'onboarding') return;
        if (head === 'account') {
          const name = institution || institutions[idOf(tail)] || '';
          accounts.set(name, (accounts.get(name) || 0) + 1);
          return;
        }
        if (label) { push(label); return; }
        if (head === 'liability' || head === 'liabilities' || head === 'debts') push(M.debts);
        else if (head === 'income') push(M.income);
        else if (head === 'goals' || head === 'goal') push(M.goals);
        else if (key === 'client.profile' || head === 'profile') push(M.profile);
        else if (key === 'plan.resources') push(M.plan);
        else if (head === 'household') push(M.holdings);
        else if (head === 'portfolio') push(M.portfolio);
        else if (head === 'preference') push(M.preferences);
        else if (head === 'constraint') push(M.constraints);
        else if (head === 'decision' || head === 'decisions') push(M.decisions);
        else if (head === 'spending') push(M.spending);
        else if (head === 'cash') push(M.cash);
        else if (head === 'investment') push(M.investments);
        else if (head === 'reserve') push(M.reserve);
        else if (key) push(key.replace(/[._-]+/g, ' ').trim());
      });
      const accountPhrases = [...accounts].sort(([a], [b]) => (a ? 0 : 1) - (b ? 0 : 1)).map(([name, n]) => M.account(name, n));
      const all = [...accountPhrases, ...phrases];
      if (!all.length) return '';
      let list;
      try { list = new Intl.ListFormat(lang === 'es' ? 'es-MX' : 'en', { type: 'conjunction' }).format(all); } catch (_) { list = all.join(', '); }
      return `${STRINGS[lang].remembered}: ${list}`;
    }

    // ------------------------------------------------------------------ citations

    // Source names and trailing piles of links become quiet numbered marks; the list opens under the message.
    // A link that reads as prose inside a sentence stays a link. Only http(s) links ever reach here.
    const SOURCE_WORDS = /\b(art[íi]culo|article|ley|law|lisr|liva|lieps|sat|dof|cnbv|banxico|condusef|irs|sec|reglamento|regulation|publication|prospect(?:o|us)|factsheet|fact sheet|kid|comisiones|tarifas|fees|pricing|documentation|faq)\b/i;
    const SEPARATOR = /^[\s,;·|/()[\]—–.:!?-]*$|^\s*(y|and|e|&)\s*$/i;
    const LABEL_TAIL = /\s*\b(sources?|fuentes?|see|ver|véase)\s*:?\s*$/i;
    let citeSeq = 0;

    function isSourceName(text, href) {
      const t = text.trim();
      if (!t) return false;
      if (t === href || /^https?:\/\//i.test(t) || /^(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t)) return true;
      return /^[\p{Lu}\d]/u.test(t) || SOURCE_WORDS.test(t);
    }

    const domainOf = href => { try { return new URL(href).hostname.replace(/^www\./, ''); } catch (_) { return ''; } };

    function citations(body, lang) {
      const S = STRINGS[lang];
      const listId = `sources-${citeSeq += 1}`;
      const sources = [];
      const numberFor = (href, title) => {
        let index = sources.findIndex(s => s.href === href);
        if (index < 0) { sources.push({ href, title, domain: domainOf(href) }); index = sources.length - 1; }
        return index + 1;
      };
      const mark = a => {
        const title = a.textContent.trim();
        const n = numberFor(a.href, title === a.href ? domainOf(a.href) : title);
        const m = el('a', 'cite', String(n));
        m.href = `#${listId}`;
        m.setAttribute('role', 'button');
        m.setAttribute('aria-expanded', 'false');
        m.setAttribute('aria-controls', listId);
        m.setAttribute('aria-label', `${S.source} ${n}: ${sources[n - 1].title}`);
        m.dataset.ns = String(n);
        return m;
      };
      const detachedBefore = node => {
        // True when the text before a link is a finished sentence, a label or nothing: the link is not grammar.
        if (!node) return true;
        if (node.nodeType !== 3) return node.nodeName === 'BR';
        const text = node.nodeValue;
        if (SEPARATOR.test(text) && !node.previousSibling) return true;
        return /[.!?:)(]\s*$/.test(text) || LABEL_TAIL.test(text) || !text.trim();
      };

      body.querySelectorAll('p, li').forEach(block => {
        if (block.closest('table, .ticket')) return;
        const own = [];
        for (const node of block.childNodes) { if (node.nodeName === 'UL' || node.nodeName === 'OL') break; own.push(node); }
        const anchors = own.filter(n => n.nodeName === 'A');
        if (!anchors.length) return;

        // The trailing run: links at the very end, separated only by commas, spaces, "y"/"and" or brackets.
        const run = [];
        let tailPunct = '';
        for (let i = own.length - 1; i >= 0; i -= 1) {
          const node = own[i];
          if (node.nodeName === 'A') { run.unshift(node); continue; }
          if (node.nodeType === 3 && SEPARATOR.test(node.nodeValue)) { if (!run.length) tailPunct = (node.nodeValue.match(/[.!?]/) || [''])[0]; continue; }
          break;
        }
        const trailing = run.length >= 2 || (run.length === 1 && isSourceName(run[0].textContent, run[0].href)) ? run : [];

        if (trailing.length) {
          const first = trailing[0], last = trailing[trailing.length - 1];
          let before = first.previousSibling;
          while (before && before.nodeType === 3 && SEPARATOR.test(before.nodeValue) && !/[.!?:)]/.test(before.nodeValue) && before.previousSibling) before = before.previousSibling;
          if (detachedBefore(before)) {
            // A pile of sources: drop the separators and the names, keep one row of marks after the sentence.
            own.slice(own.indexOf(first)).forEach(n => { if (n.nodeName !== 'A') n.remove(); });
            let node = first.previousSibling;
            while (node && node.nodeType === 3 && SEPARATOR.test(node.nodeValue)) {
              const stop = (node.nodeValue.match(/[.!?]/) || [''])[0];
              if (stop) { node.nodeValue = stop; break; }
              const prev = node.previousSibling; node.remove(); node = prev;
            }
            if (node && node.nodeType === 3) {
              node.nodeValue = node.nodeValue.replace(LABEL_TAIL, '').replace(/[\s([]+$/, '');
              if (tailPunct && !/[.!?:]$/.test(node.nodeValue)) node.nodeValue += tailPunct;
            }
            trailing.forEach(a => a.replaceWith(mark(a)));
          } else {
            trailing.forEach(a => a.replaceWith(document.createTextNode(a.textContent), mark(a)));
          }
        }

        // Links elsewhere: a source name that closes a clause keeps its words and gains a mark; a link alone in
        // brackets becomes just the mark; a source title dropped between two sentences ("…together. ASML's 2026
        // outlook Selling…") becomes a mark on the sentence before it, so no sentence is broken; prose links stay links.
        anchors.filter(a => !trailing.includes(a) && block.contains(a)).forEach(a => {
          const prev = a.previousSibling, next = a.nextSibling;
          const opens = prev && prev.nodeType === 3 && /\(\s*$/.test(prev.nodeValue);
          const closes = next && next.nodeType === 3 && /^\s*\)/.test(next.nodeValue);
          const source = isSourceName(a.textContent, a.href);
          const between = source && detachedBefore(prev) && next && next.nodeType === 3 && /^\s+\p{Lu}/u.test(next.nodeValue);
          if (opens && closes) {
            prev.nodeValue = prev.nodeValue.replace(/\s*\(\s*$/, '');
            next.nodeValue = next.nodeValue.replace(/^\s*\)/, '');
            a.replaceWith(mark(a));
          } else if (between) {
            if (prev && prev.nodeType === 3) prev.nodeValue = prev.nodeValue.replace(/\s+$/, '');
            next.nodeValue = next.nodeValue.replace(/^\s+/, ' ');
            a.replaceWith(mark(a));
          } else if (source && (!next || (next.nodeType === 3 && /^\s*[).,;:!?]/.test(next.nodeValue)))) {
            a.replaceWith(document.createTextNode(a.textContent), mark(a));
          }
        });
      });

      if (!sources.length) return null;

      // A paragraph left holding only marks (after "Sources:") folds its marks into the paragraph above.
      body.querySelectorAll('p').forEach(p => {
        const rest = [...p.childNodes].filter(n => !(n.nodeName === 'A' && n.classList.contains('cite')));
        if (!p.querySelector('a.cite') || rest.some(n => n.nodeType !== 3 || !SEPARATOR.test(n.nodeValue.replace(LABEL_TAIL, '')))) return;
        const above = p.previousElementSibling;
        if (above && above.tagName === 'P') { above.append(...p.querySelectorAll('a.cite')); p.remove(); }
        else rest.forEach(n => n.remove());
      });

      const list = el('ol', 'sources');
      list.id = listId;
      list.hidden = true;
      list.setAttribute('aria-label', S.sources);
      sources.forEach(source => {
        const item = el('li');
        const a = el('a');
        a.href = source.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.append(el('span', 'domain', source.domain), el('span', 'title', source.title));
        item.append(a);
        list.append(item);
      });
      // Adjacent marks merge into one mark ("1 2 3"): one 44px target that opens the list at those sources.
      body.querySelectorAll('a.cite').forEach(m => {
        if (!body.contains(m)) return;
        let next = m.nextSibling;
        while (next && (next.nodeName === 'A' && next.classList.contains('cite') || (next.nodeType === 3 && !next.nodeValue.trim() && next.nextSibling && next.nextSibling.nodeName === 'A' && next.nextSibling.classList.contains('cite')))) {
          const after = next.nextSibling;
          if (next.nodeName === 'A') m.dataset.ns += ` ${next.dataset.ns}`;
          next.remove();
          next = after;
        }
        const ns = [...new Set(m.dataset.ns.split(' ').map(Number))];
        m.dataset.ns = ns.join(' ');
        m.textContent = ns.join('\u2009');
        if (ns.length > 1) m.setAttribute('aria-label', `${S.sources}: ${ns.map(n => sources[n - 1].title).join('; ')}`);
      });
      const marks = [...body.querySelectorAll('a.cite')];
      const toggle = ns => {
        const key = ns.join(' ');
        const open = list.hidden || list.dataset.current !== key;
        list.hidden = !open;
        list.dataset.current = open ? key : '';
        [...list.children].forEach((li, i) => li.classList.toggle('current', open && ns.includes(i + 1)));
        marks.forEach(m => m.setAttribute('aria-expanded', String(open && m.dataset.ns === key)));
      };
      marks.forEach(m => {
        const ns = m.dataset.ns.split(' ').map(Number);
        m.addEventListener('click', event => { event.preventDefault(); toggle(ns); });
        m.addEventListener('keydown', event => { if (event.key === ' ') { event.preventDefault(); toggle(ns); } });
      });
      return list;
    }

    // ------------------------------------------------------------------ rendering

    function attachmentChips(items) {
      const box = el('div', 'attachments');
      items.forEach(item => {
        const chip = el('span', 'chip');
        chip.append(svg('M7 3h7l5 5v13H7zM14 3v5h5', 15));
        chip.append(el('span', 'name', item.name || 'file'));
        if (item.size) chip.append(el('span', 'meta', formatSize(item.size)));
        box.append(chip);
      });
      return box;
    }

    function userMessage(text, attachments = []) {
      const article = el('article', 'message user');
      article.setAttribute('aria-label', T.you);
      if (attachments.length) article.append(attachmentChips(attachments));
      article.append(el('div', 'bubble', text));
      messages.append(article);
      return article;
    }

    function assistantMessage(content, options = {}) {
      const lang = options.lang || LANG;
      const article = el('article', 'message assistant');
      article.setAttribute('aria-label', T.wealth);
      const body = el('div', 'answer');
      renderAnswer(body, content, options.views, lang);
      article.append(body);
      const sources = citations(body, lang);
      if (sources) article.append(tagLang(sources, lang));
      // The saved line belongs to the turn that saved something; history replays the answer without it.
      const event = options.memoryEvent;
      const saved = options.memory || (event && (event.items || event.keys)) || null;
      const remembered = options.announce ? memoryPhrase(saved, lang, { event, message: options.message }) : '';
      if (remembered) {
        // Remembering, settled: one quiet line, no mark.
        article.append(tagLang(el('p', 'memory', remembered), lang));
      }
      if (options.stopped) article.append(stoppedLine(lang, options.retry));
      messages.append(article);
      if (options.announce) {
        live.textContent = '';
        setTimeout(() => { live.textContent = `${T.replied} ${(body.innerText || body.textContent).slice(0, 1200)}`; }, 50);
      }
      return article;
    }

    // Under an answer the person stopped: "Stopped", and Ask again when there is something to re-send.
    function stoppedLine(lang, retry) {
      const line = tagLang(el('p', 'stopped'), lang);
      line.append(el('span', '', STRINGS[lang].stopped));
      if (retry) {
        line.append(el('span', 'sep', '·'));
        const button = el('button', '', STRINGS[lang].askAgain);
        button.type = 'button';
        button.addEventListener('click', () => { button.previousSibling.remove(); button.remove(); retry(); });
        line.append(button);
      }
      return line;
    }

    // Worktrace row: the live mark, the step as tools run, and after fifteen seconds the time it has taken.
    const ELAPSED_AFTER = 15;
    function pendingMessage(raw = '', lang = LANG, since = Date.now()) {
      const article = tagLang(el('article', 'message assistant pending'), lang);
      article.setAttribute('aria-label', T.wealth);
      article._lang = lang;
      const line = el('div', 'worktrace');
      const mark = presence(presenceFor(raw || 'Working on it'));
      const step = el('span', 'step', raw ? stepText(raw, lang) : STRINGS[lang].working);
      step.setAttribute('role', 'status');
      const elapsed = el('span', 'elapsed');
      elapsed.setAttribute('aria-hidden', 'true');
      line.append(mark, step, elapsed);
      article.append(line);
      messages.append(article);
      article._step = step;
      article._mark = mark;
      article._timer = setInterval(() => {
        const seconds = Math.round((Date.now() - since) / 1000);
        elapsed.textContent = seconds >= ELAPSED_AFTER ? `· ${seconds} s` : '';
      }, 1000);
      return article;
    }

    function setStep(node, raw, state) {
      if (!node) return;
      const text = stepText(raw, node._lang);
      if (node._step.textContent !== text) node._step.textContent = text;
      setPresence(node._mark, state || presenceFor(raw));
    }

    function clearPending(node) {
      if (!node) return;
      clearInterval(node._timer);
      clearTimeout(node._streamTimer);
      node.remove();
    }

    // The answer as it is written: chunks accumulate and the same safe markdown renderer redraws the text at most
    // every 50 ms. A new message item (the model wrote an aside first) starts the text over. Views, citations and
    // the memory line wait for the finished answer.
    const STREAM_MS = 50;
    function streamDelta(node, event) {
      if (!node || typeof event.text !== 'string') return;
      const item = String(event.item || '');
      if (!node._stream) {
        node._stream = el('div', 'answer');
        node.classList.add('streaming');
        node.append(node._stream);
      }
      if (node._streamItem !== item) { node._streamItem = item; node._streamText = ''; }
      node._streamText += event.text;
      if (!node._streamTimer) node._streamTimer = setTimeout(() => drawStream(node), STREAM_MS);
    }

    function drawStream(node) {
      node._streamTimer = null;
      if (!node.isConnected || !node._stream) return;
      const body = el('div', 'answer');
      // A bold or code span still being written is drawn closed, so its markers never flash as text.
      let text = node._streamText;
      if (!/(^|\n)\s*(```|~~~)/.test(text)) {
        if ((text.match(/\*\*/g) || []).length % 2) text += '**';
        if ((text.match(/`/g) || []).length % 2) text += '`';
      }
      renderAnswer(body, text, [], node._lang);
      let tail = body.lastElementChild;
      while (tail && /^(UL|OL|BLOCKQUOTE)$/.test(tail.tagName) && tail.lastElementChild) tail = tail.lastElementChild;
      const mark = el('span', 'stream-mark');
      mark.setAttribute('aria-hidden', 'true');
      (tail && /^(P|LI|H[2-5])$/.test(tail.tagName) ? tail : body).append(mark);
      node._stream.replaceWith(body);
      node._stream = body;
      follow();
    }

    function showError(userNode, error, retry) {
      if (!userNode) return;
      const prior = userNode.querySelector('.alert');
      if (prior) prior.remove();
      const kind = error.kind || 'other';
      const quiet = kind === 'cancelled' || kind === 'stoppedEarly';
      const box = el('div', quiet ? 'alert quiet' : 'alert');
      box.setAttribute('role', 'alert');
      // Failure statement, cause, recovery. The route-broke mark replaces any warning glyph.
      if (!quiet) box.append(presence('exception'));
      const p = el('p');
      const message = errorText(Object.assign({}, error, { kind }));
      // Render `codex login` style hints as code without using innerHTML.
      message.split(/(`[^`]+`)/).forEach(part => {
        p.append(part.startsWith('`') && part.endsWith('`') ? el('code', '', part.slice(1, -1)) : document.createTextNode(part));
      });
      box.append(p);
      const ways = el('div', 'ways');
      if (retry) {
        const button = el('button', '', quiet ? T.askAgain : T.retry);
        button.type = 'button';
        button.addEventListener('click', () => { box.remove(); retry(); });
        ways.append(button);
      }
      if (error.detail && !quiet) {
        // The raw cause is for diagnosis, not the first read: behind a tap.
        const more = el('details', 'detail');
        more.append(el('summary', '', T.details), el('code', '', error.detail));
        ways.append(more);
      }
      if (ways.childNodes.length) box.append(ways);
      userNode.append(box);
      follow();
    }

    function renderIntro(state) {
      const box = el('section', 'intro');
      box.setAttribute('aria-label', T.welcome);
      // One dominant text: a short question. A new profile never lands here; it starts with the setup cards.
      box.append(el('h2', 'greeting', T.returning));
      const onboarding = state.onboarding || {};
      const starters = Array.isArray(state.starters) ? state.starters.slice(0, 3) : [];
      if (onboarding.active && onboarding.card) {
        // Returning with setup unfinished: one row, not the whole flow.
        const rows = el('ul', 'starters');
        const row = el('li');
        const button = el('button', 'starter resume');
        button.type = 'button';
        button.append(el('span', '', S.resume));
        if (onboarding.remaining) button.append(el('span', 'meta', S.remaining(onboarding.remaining)));
        button.addEventListener('click', () => startSetup(onboarding));
        row.append(button);
        rows.append(row);
        box.append(rows);
      } else if (starters.length) {
        const rows = el('ul', 'starters');
        starters.forEach(item => {
          const [label, prompt] = T.starters[item.label] || [String(item.label || item.prompt), String(item.prompt)];
          const row = el('li');
          const button = el('button', 'starter', label);
          button.type = 'button';
          button.addEventListener('click', () => {
            if (item.attach) { fileInput.click(); return; }
            if (item.send) { submit(prompt); return; }
            input.value = prompt;
            resize();
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
          });
          row.append(button);
          rows.append(row);
        });
        box.append(rows);
      }
      messages.append(box);
    }

    const removeIntro = () => { const intro = messages.querySelector('.intro'); if (intro) intro.remove(); };

    // ------------------------------------------------------------------ setup (deterministic onboarding)

    // One question per card inside the conversation. Answers go to /api/onboarding; each one collapses into a
    // one-line summary that reopens the card, and the running picture line updates as numbers land.
    const S = T.setup;
    const setup = { node: null, list: null, picture: null, card: null, active: false, busy: false };
    let cardSeq = 0;

    const locale = LANG === 'es' ? 'es-MX' : 'en-US';
    const grouped = n => new Intl.NumberFormat(locale, { maximumFractionDigits: 2 }).format(n);
    function money(amount, currency) {
      if (amount === null || amount === undefined) return '';
      try {
        return new Intl.NumberFormat(locale, { style: 'currency', currency: currency || 'MXN', currencyDisplay: 'narrowSymbol', maximumFractionDigits: 0 }).format(amount);
      } catch (_) { return `${grouped(amount)} ${currency || ''}`.trim(); }
    }
    // "$60k", "$1.2M": a figure short enough to sit beside others on one line.
    function compact(amount, currency) {
      const abs = Math.abs(amount);
      const short = abs >= 1e6 ? `${(amount / 1e6).toFixed(abs >= 1e7 ? 0 : 1).replace(/\.0$/, '')}M`
        : abs >= 1e3 ? `${(amount / 1e3).toFixed(abs >= 1e4 ? 0 : 1).replace(/\.0$/, '')}k` : grouped(amount);
      try { return new Intl.NumberFormat(locale, { style: 'currency', currency: currency || 'MXN', currencyDisplay: 'narrowSymbol', maximumFractionDigits: 0 }).format(0).replace(/[\d.,\s]+/, short); }
      catch (_) { return `$${short}`; }
    }
    const plainNumber = text => {
      const t = String(text || '').trim();
      if (/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) return Number(t.replace(/,/g, ''));
      if (/^\d+(\.\d+)?$/.test(t)) return Number(t);
      return null;
    };

    function ensureSetup() {
      if (setup.node && messages.contains(setup.node)) return setup.node;
      const node = el('section', 'setup');
      node.setAttribute('aria-label', S.region);
      setup.list = el('ul', 'done-list');
      setup.picture = el('p', 'picture');
      setup.picture.setAttribute('aria-live', 'polite');
      node.append(setup.list, setup.picture);
      messages.append(node);
      setup.node = node;
      return node;
    }

    function setPicture(picture) {
      if (!setup.picture) return;
      const line = picture && typeof picture.line === 'string' ? picture.line : '';
      if (setup.picture.textContent !== line) setup.picture.textContent = line;
    }

    function setSetupActive(active) {
      setup.active = active;
      input.placeholder = active ? S.placeholder : T.placeholder;
    }

    // ---- fields: each returns { node, get(), set(value), check() -> message | '' }

    function labelFor(text, forId) {
      const label = el('label', 'label', text);
      if (forId) label.htmlFor = forId;
      return label;
    }

    function textField(spec) {
      const wrap = el('div', 'field');
      const id = `f${cardSeq}-${spec.name}`;
      const field = el('input');
      field.type = 'text'; field.id = id; field.maxLength = spec.max || 80;
      if (spec.autocomplete) field.autocomplete = spec.autocomplete;
      field.setAttribute('autocapitalize', 'words');
      wrap.append(labelFor(spec.label, id), field);
      return {
        node: wrap, focus: field,
        get: () => field.value.trim() || null,
        set: v => { field.value = v == null ? '' : String(v); },
        check: () => spec.required && !field.value.trim() ? (spec.name === 'name' ? S.needName : S.need) : ''
      };
    }

    function yearField(spec) {
      const wrap = el('div', 'field year');
      const id = `f${cardSeq}-${spec.name}`;
      const field = el('input');
      field.type = 'text'; field.id = id; field.maxLength = 4;
      field.setAttribute('inputmode', 'numeric'); field.setAttribute('pattern', '[0-9]*');
      field.placeholder = LANG === 'es' ? 'AAAA' : 'YYYY';
      field.addEventListener('input', () => { field.value = field.value.replace(/\D/g, '').slice(0, 4); field.removeAttribute('aria-invalid'); });
      wrap.append(labelFor(spec.label, id), field);
      return {
        node: wrap, focus: field,
        get: () => field.value ? Number(field.value) : null,
        set: v => { field.value = v == null ? '' : String(v); },
        check: () => {
          const v = field.value;
          const bad = v && (v.length !== 4 || (spec.min && +v < spec.min) || (spec.max && +v > spec.max));
          if (bad) field.setAttribute('aria-invalid', 'true');
          return bad ? S.needYear : '';
        }
      };
    }

    function percentField(spec) {
      const wrap = el('div', 'field narrow');
      const id = `f${cardSeq}-${spec.name}-${Math.random().toString(36).slice(2, 7)}`;
      const box = el('div', 'percent');
      const field = el('input');
      field.type = 'text'; field.id = id; field.maxLength = 6;
      field.setAttribute('inputmode', 'decimal');
      const sign = el('span', 'sign', '%'); sign.setAttribute('aria-hidden', 'true');
      box.append(field, sign);
      wrap.append(labelFor(spec.label, id), box);
      return {
        node: wrap, focus: field,
        get: () => field.value.trim() || null,
        set: v => { field.value = v == null ? '' : String(v); },
        check: () => ''
      };
    }

    function amountField(spec, small = false) {
      const wrap = el('div', 'field');
      const id = `f${cardSeq}-${spec.name}-${Math.random().toString(36).slice(2, 7)}`;
      const row = el('div', small ? 'money small' : 'money');
      const box = el('div', 'box');
      const field = el('input');
      field.type = 'text'; field.id = id; field.maxLength = 24; field.autocomplete = 'off';
      field.setAttribute('inputmode', 'decimal');
      const sign = el('span', 'sign', '$'); sign.setAttribute('aria-hidden', 'true');
      box.append(sign, field);
      row.append(box);
      let currency = spec.currency || 'MXN';
      const toggles = [];
      const currencies = Array.isArray(spec.currencies) && spec.currencies.length > 1 ? spec.currencies : [];
      if (currencies.length) {
        const group = el('div', 'currency');
        group.setAttribute('role', 'group');
        group.setAttribute('aria-label', LANG === 'es' ? 'Moneda' : 'Currency');
        currencies.forEach(code => {
          const b = el('button', '', code);
          b.type = 'button';
          b.setAttribute('aria-pressed', String(code === currency));
          b.addEventListener('click', () => { currency = code; toggles.forEach(t => t.setAttribute('aria-pressed', String(t.textContent === code))); });
          toggles.push(b); group.append(b);
        });
        row.append(group);
      }
      field.addEventListener('blur', () => { const n = plainNumber(field.value); if (n !== null) field.value = grouped(n); });
      field.addEventListener('input', () => field.removeAttribute('aria-invalid'));
      wrap.append(labelFor(spec.label || '', id), row);
      if (!spec.label) wrap.querySelector('label').classList.add('sr-only');
      return {
        node: wrap, focus: field,
        get: () => field.value.trim() ? { amount: field.value.trim(), currency } : null,
        set: v => {
          if (!v) return;
          const amount = typeof v === 'object' ? v.amount : v;
          if (typeof v === 'object' && v.currency) { currency = v.currency; toggles.forEach(t => t.setAttribute('aria-pressed', String(t.textContent === currency))); }
          field.value = amount == null ? '' : (typeof amount === 'number' ? grouped(amount) : String(amount));
        },
        check: () => {
          if (!spec.required || field.value.trim()) return '';
          field.setAttribute('aria-invalid', 'true');
          return spec.name === 'balance' ? S.needBalance : S.needAmount;
        }
      };
    }

    function subField(spec) {
      if (spec.type === 'amount') return amountField(spec, true);
      if (spec.type === 'percent') return percentField(spec);
      if (spec.type === 'year') return yearField(spec);
      if (spec.type === 'chips') { const made = chipsField(spec); made.node.classList.add('wide'); return made; }  // yes/no inside an item
      return textField(spec);
    }

    function chipsField(spec, onChange) {
      const wrap = el('fieldset', 'field');
      const legend = el('legend', 'label', spec.label || '');
      if (!spec.label) legend.classList.add('sr-only');
      wrap.append(legend);
      const row = el('div', 'choices');
      const items = el('div', 'items');
      const chosen = [];                          // option ids, in the order they were picked
      const blocks = new Map();                   // option id -> { node, fields, later }
      const buttons = new Map();
      const withItems = (spec.options || []).some(o => Array.isArray(o.fields));
      const single = (spec.max || 1) === 1;

      function itemBlock(option) {
        const node = el('div', 'item');
        node.append(el('p', 'name', option.label));
        const line = el('div', 'row');
        const fields = option.fields.map(f => { const made = subField(f); made.spec = f; made.node.classList.toggle('narrow', f.type === 'percent'); line.append(made.node); return made; });
        node.append(line);
        let later = false, laterButton = null;
        if (option.upload) {
          laterButton = el('button', 'text-control later', S.later);
          laterButton.type = 'button';
          laterButton.setAttribute('aria-pressed', 'false');
          laterButton.addEventListener('click', () => {
            later = !later;
            laterButton.setAttribute('aria-pressed', String(later));
            laterButton.textContent = later ? S.laterOn : S.later;
            line.hidden = later;
          });
          node.append(laterButton);
        }
        return { node, fields, isLater: () => later };
      }

      function sync() {
        buttons.forEach((b, id) => b.setAttribute('aria-pressed', String(chosen.includes(id))));
        if (withItems) {
          chosen.forEach(id => {
            const option = spec.options.find(o => o.id === id);
            if (option && option.fields && !blocks.has(id)) blocks.set(id, itemBlock(option));
          });
          [...blocks.keys()].forEach(id => { if (!chosen.includes(id)) { blocks.get(id).node.remove(); blocks.delete(id); } });
          chosen.forEach(id => { if (blocks.has(id)) items.append(blocks.get(id).node); });
        }
        if (onChange) onChange();
      }

      (spec.options || []).forEach(option => {
        const b = el('button', 'choice', option.label);
        b.type = 'button';
        b.addEventListener('click', () => {
          const at = chosen.indexOf(option.id);
          if (at >= 0) chosen.splice(at, 1);
          else {
            if (single) chosen.length = 0;
            if (option.exclusive) chosen.length = 0;
            else {
              spec.options.filter(o => o.exclusive).forEach(o => { const i = chosen.indexOf(o.id); if (i >= 0) chosen.splice(i, 1); });
              if (spec.max && chosen.length >= spec.max) chosen.shift();
            }
            chosen.push(option.id);
            const block = blocks.get(option.id);
            sync();
            const opened = blocks.get(option.id);
            if (opened && !block && opened.fields[0]) opened.fields[0].focus.focus();
            return;
          }
          sync();
        });
        buttons.set(option.id, b);
        row.append(b);
      });
      wrap.append(row);
      if (spec.hint) wrap.append(el('p', 'hint', spec.hint));
      if (withItems) wrap.append(items);

      return {
        node: wrap, focus: row.querySelector('button'),
        chosen: () => chosen.slice(),
        get: () => {
          if (withItems) {
            if (!chosen.length) return null;
            const out = {};
            chosen.forEach(id => {
              const block = blocks.get(id);
              const detail = {};
              if (block) {
                if (block.isLater()) detail.upload = true;
                else block.fields.forEach(f => { const v = f.get(); if (v !== null) detail[f.spec.name] = v; });
              }
              out[id] = detail;
            });
            return out;
          }
          if (single) return chosen[0] || null;
          return chosen.length ? chosen.slice() : null;
        },
        set: v => {
          if (v == null) return;
          chosen.length = 0;
          if (typeof v === 'string') chosen.push(v);
          else if (Array.isArray(v)) chosen.push(...v);
          else if (typeof v === 'object') chosen.push(...Object.keys(v));
          sync();
          if (withItems && typeof v === 'object' && !Array.isArray(v)) {
            Object.entries(v).forEach(([id, detail]) => {
              const block = blocks.get(id);
              if (block && detail) block.fields.forEach(f => f.set(detail[f.spec.name]));
            });
          }
        },
        check: () => {
          if (spec.required && !chosen.length) return S.needChoice;
          for (const id of chosen) {
            const block = blocks.get(id);
            if (!block || block.isLater()) continue;
            for (const f of block.fields) { const problem = f.check(); if (problem) { f.focus.focus(); return problem; } }
          }
          return '';
        }
      };
    }

    // ---- files for the statements card: the same upload endpoint as the composer

    async function uploadFile(file) {
      const type = typeFor(file);
      if (!type) throw Object.assign(new Error(T.badType), { short: T.badType });
      if (file.size > uploadLimit) throw Object.assign(new Error(T.tooBig), { short: T.tooBig });
      if (!file.size) throw Object.assign(new Error(T.empty), { short: T.empty });
      const response = await api('/api/upload', { method: 'POST', body: file, headers: { 'Content-Type': type, 'X-Filename': encodeURIComponent(file.name) } });
      return (await json(response)).upload;
    }

    function pickFiles(onFiles) {
      const picker = el('input');
      picker.type = 'file'; picker.multiple = true; picker.accept = fileInput.accept; picker.hidden = true;
      picker.addEventListener('change', () => { onFiles(Array.from(picker.files || [])); picker.remove(); });
      document.body.append(picker);
      picker.click();
    }

    // ---- the card

    function renderCard(card, options = {}) {
      cardSeq += 1;
      const form = el('form', 'card');
      form.noValidate = true;
      form.dataset.step = card.step;
      const promptId = `prompt-${cardSeq}`;
      form.setAttribute('aria-labelledby', promptId);
      if (card.index && card.total && !options.editing) {
        const origin = el('p', 'origin', S.step(card.index, card.total));
        origin.setAttribute('aria-label', S.stepLabel(card.index, card.total));
        form.append(origin);
      }
      const prompt = el('h2', 'prompt', card.prompt);
      prompt.id = promptId; prompt.tabIndex = -1;
      form.append(prompt);

      const fields = el('div', 'fields');
      const made = [];
      const byName = {};
      let files = [];
      const refreshWhen = () => made.forEach(f => {
        if (!f.spec.when) return;
        const [key, value] = Object.entries(f.spec.when)[0];
        const current = byName[key] && byName[key].get();
        f.node.hidden = current !== value;
      });
      (card.fields || []).forEach(spec => {
        let f;
        if (spec.type === 'chips') f = chipsField(spec, refreshWhen);
        else if (spec.type === 'amount') f = amountField(spec);
        else if (spec.type === 'year') f = yearField(spec);
        else if (spec.type === 'upload') {
          const box = el('div', 'field');
          const chips = el('div', 'attachments files');
          box.append(chips);
          f = { node: box, get: () => files.map(x => x.id), set: () => {}, check: () => '', chips };
        }
        else f = textField(spec);
        f.spec = spec;
        made.push(f); byName[spec.name] = f;
        fields.append(f.node);
      });
      form.append(fields);
      if (card.prefill) Object.entries(card.prefill).forEach(([name, value]) => { if (byName[name]) byName[name].set(value); });
      refreshWhen();

      const problem = el('p', 'problem');
      problem.setAttribute('role', 'alert');
      form.append(problem);

      const actions = el('div', 'actions');
      const isUploadCard = (card.fields || []).some(f => f.type === 'upload');
      const primary = el('button', 'primary', isUploadCard ? S.uploadMany : options.editing ? S.save : card.confirm ? S.confirm : S.next);
      primary.type = isUploadCard ? 'button' : 'submit';
      actions.append(primary);
      const textButton = (label, handler) => { const b = el('button', 'text-control', label); b.type = 'button'; b.addEventListener('click', handler); actions.append(b); return b; };

      const send = async payload => {
        if (setup.busy) return;
        setup.busy = true; primary.disabled = true; problem.textContent = '';
        try {
          const data = await json(await api('/api/onboarding', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({ step: card.step, lang: LANG }, payload))
          }));
          answered(form, data, options);
        } catch (err) {
          problem.textContent = err.kind === 'invalid' ? (LANG === 'en' && err.message ? err.message : S.invalid) : errorText(err);
          primary.disabled = false;
        } finally { setup.busy = false; }
      };

      if (isUploadCard) {
        const upload = () => pickFiles(async list => {
          const target = byName.uploads;
          for (const file of list.slice(0, 5 - files.length)) {
            const chip = attachmentChips([{ name: file.name, size: file.size }]).firstChild;
            chip.querySelector('.meta') && (chip.querySelector('.meta').textContent = T.uploading);
            target.chips.append(chip);
            try {
              const meta = await uploadFile(file);
              files.push(meta);
              chip.querySelector('.meta').textContent = formatSize(meta.size);
            } catch (err) {
              chip.classList.add('error');
              chip.querySelector('.meta').textContent = err.short || T.uploadFailed;
            }
          }
          if (files.length) { primary.textContent = S.finish; primary.type = 'submit'; primary.onclick = null; }
        });
        primary.onclick = upload;
      }

      const collect = () => {
        const out = {};
        made.forEach(f => { if (!f.node.hidden) { const v = f.get(); if (v !== null && v !== undefined) out[f.spec.name] = v; } });
        return out;
      };
      const initial = JSON.stringify(collect());   // the prefill as these fields read it back

      form.addEventListener('submit', event => {
        event.preventDefault();
        for (const f of made) {
          if (f.node.hidden) continue;
          const message = f.check();
          if (message) { problem.textContent = message; return; }
        }
        const answer = collect();
        if (isUploadCard) { send({ answer: { uploads: files.map(x => x.id) } }); return; }
        if (card.confirm && JSON.stringify(answer) === initial) { send({ answer: { confirm: true } }); return; }
        if (!Object.keys(answer).length) { problem.textContent = S.need; return; }
        send({ answer });
      });

      if (options.editing) {
        // Changing an earlier answer: save or leave it as it was.
        textButton(S.cancel, () => closeEdit(options.row));
        form.addEventListener('keydown', event => { if (event.key === 'Escape') { event.preventDefault(); closeEdit(options.row); } });
        form.append(actions);
        form._focus = () => { const first = made.find(f => !f.node.hidden && f.focus); (first && !coarse.matches ? first.focus : prompt).focus({ preventScroll: true }); };
        return form;
      }
      if (card.unsure) textButton(S.unsure, () => send({ answer: { unsure: true } }));
      if (card.upload && !isUploadCard) {
        textButton(S.upload, () => {
          // Statements are the fast path: the file goes through the composer's upload and ingest flow.
          // The picker opens inside the click (browsers require it); the item stays unknown until the statement lands.
          fileInput.click();
          send({ answer: { unsure: true } });
        });
      }
      textButton(S.skip, () => send({ skip: true }));
      form.append(actions);
      form._focus = () => { const first = made.find(f => !f.node.hidden && f.focus); (first && !coarse.matches ? first.focus : prompt).focus({ preventScroll: true }); };
      return form;
    }

    function summaryRow(step, text) {
      const li = el('li');
      li.dataset.step = step;
      const b = el('button', 'answered');
      b.type = 'button';
      b.setAttribute('aria-label', S.editLabel(text));
      b.append(el('span', 'summary', text), el('span', 'edit', S.edit));
      b.addEventListener('click', () => editStep(step, li));
      li.append(b);
      return li;
    }

    async function editStep(step, row) {
      if (setup.busy) return;
      try {
        const data = await json(await api(`/api/onboarding?step=${encodeURIComponent(step)}&lang=${LANG}`));
        if (!data.card) return;
        const form = renderCard(data.card, { editing: true, row });
        row._summary = [...row.childNodes];
        row.replaceChildren(form);
        pauseOpenCard(true);
        form._focus();
      } catch (err) { live.textContent = errorText(err); }
    }

    // One primary per screen: while an earlier answer is being changed, the open card waits, quiet and inert.
    function pauseOpenCard(paused) {
      if (!setup.card) return;
      setup.card.inert = paused;
      setup.card.classList.toggle('paused', paused);
    }

    function closeEdit(row) {
      if (row && row._summary) {
        row.replaceChildren(...row._summary);
        const button = row.querySelector('button');
        if (button) button.focus();
      }
      if (!setup.list.querySelector('.card')) pauseOpenCard(false);
    }

    function showCard(card) {
      ensureSetup();
      if (setup.card) setup.card.remove();
      setup.card = null;
      if (!card) return;
      const form = renderCard(card);
      setup.node.append(form);
      setup.card = form;
      return form;
    }

    function answered(form, data, options) {
      const summary = data.answered && data.answered.summary;
      const step = data.answered && data.answered.step;
      if (options.editing && options.row) {
        const row = summaryRow(step, summary);
        options.row.replaceWith(row);
        row.querySelector('button').focus();
        if (!setup.list.querySelector('.card')) pauseOpenCard(false);
      } else {
        form.remove();
        if (setup.card === form) setup.card = null;
        const existing = setup.list.querySelector(`li[data-step="${step}"]`);
        const row = summaryRow(step, summary);
        if (existing) existing.replaceWith(row); else setup.list.append(row);
      }
      live.textContent = summary || '';
      setPicture(data.picture);
      if (data.card) {
        if (!options.editing || !setup.card || setup.card.dataset.step !== data.card.step) {
          const next = showCard(data.card);
          if (next && !options.editing) { next._focus(); follow(true); }
        }
      } else {
        if (setup.card) { setup.card.remove(); setup.card = null; }
        setSetupActive(false);
        if (data.complete && !options.editing) reveal(data);
      }
    }

    // ---- reveal: the whole picture, deterministic, then the first synthesis from the model

    // The reveal's ticket: known figures only, with at least two of them; a figure not yet known reads "aún no sé",
    // and a surplus is known only when what comes in and what goes out both are.
    function pictureTicket(picture) {
      const rows = [];
      const cur = picture.currency;
      const known = v => typeof v === 'number' && Number.isFinite(v);
      const unknownRow = label => [label, S.unknown, false, false, true];
      if (known(picture.net_worth)) rows.push([S.netWorth, money(picture.net_worth, cur), true]);
      else if ((picture.unknown_balances || []).length) rows.push(unknownRow(S.netWorth));
      if (known(picture.liquid)) {
        // "Liquid" on the card is the reserve's money; its parts read compactly ("Efectivo $60k + CETES $180k").
        const reserve = picture.liquid_basis === 'reserve';
        rows.push([reserve ? S.reserveMoney : S.liquid, money(picture.liquid, cur)]);
        const parts = (picture.reserve_parts || []).filter(p => known(Number(p.value)));
        if (reserve && parts.length) {
          rows.push(['', parts.map(p => `${p.kind === 'cash' ? S.cash : String(p.label || p.kind)} ${compact(Number(p.value), cur)}`).join(' + '), false, true]);
        }
      }
      if (known(picture.surplus) && known(picture.income) && picture.income > 0 && known(picture.spending)) {
        rows.push([picture.surplus >= 0 ? S.surplus : S.short, money(Math.abs(picture.surplus), cur)]);
      } else if (known(picture.income) || known(picture.spending)) rows.push(unknownRow(S.surplus));
      if (known(picture.reserve_months) && known(picture.spending)) rows.push([S.reserve, S.months(Number(picture.reserve_months.toFixed(1)))]);
      (picture.debts || []).forEach(d => {
        if (!known(Number(d.balance))) return;
        rows.push([S.debts[d.kind] || S.debts.other, money(d.balance, d.currency)]);
        if (d.payoff) rows.push([S.paidOff, new Intl.DateTimeFormat(locale, { month: 'short', year: 'numeric' }).format(new Date(`${d.payoff}-15T12:00:00`)), false, true]);
      });
      if (rows.filter(r => !r[4]).length < 2) return null;
      const box = el('section', 'ticket');
      box.setAttribute('aria-label', S.picture);
      const list = el('dl');
      const caption = el('div', 'row caption');
      caption.append(el('span', '', S.picture));
      list.append(caption);
      rows.forEach(([name, value, , sub, unknown]) => {
        const line = el('div', sub ? 'row sub' : 'row');
        line.append(el('dt', '', name), el('dd', unknown ? 'unknown' : name ? 'num' : 'parts', value));
        list.append(line);
      });
      box.append(list);
      return box;
    }

    function reveal(data) {
      const article = el('article', 'message assistant reveal-ticket');
      article.setAttribute('aria-label', S.picture);
      const ticketNode = pictureTicket(data.picture || {});
      if (ticketNode) article.append(ticketNode);
      // The answers now live in the picture (and on the profile page): the setup rows leave with the cards.
      if (setup.node) { setup.node.remove(); setup.node = null; setup.list = null; setup.picture = null; }
      messages.append(article);
      follow(true);
      if (data.reveal && data.reveal.id) trackReveal(data.reveal, article);
    }

    function trackReveal(summary, anchor) {
      const record = { id: summary.id, message: '', attachments: [], userNode: anchor, after: 0, lang: LANG, internal: true };
      current = record;
      setBusy(true);
      record.pendingNode = pendingMessage(summary.progress || '', LANG);
      follow(true);
      track(record);
    }

    // ---- entry points

    function startSetup(onboarding, state) {
      if (!onboarding || !onboarding.active || !onboarding.card) return;
      removeIntro();
      ensureSetup();
      setSetupActive(true);
      setPicture(onboarding.picture);
      const form = showCard(onboarding.card);
      if (form) form._focus();
    }

    // Typing while a card is open answers it when the text reads as an answer; a real question goes to the model.
    async function answerByText(text) {
      if (!setup.active || !setup.card || setup.busy) return false;
      const form = setup.card;
      setup.busy = true;
      try {
        const data = await json(await api('/api/onboarding', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ step: form.dataset.step, text, lang: LANG })
        }));
        if (data.needs_model) return false;
        setup.busy = false;
        answered(form, data, {});
        return true;
      } catch (_) {
        return false;
      } finally { setup.busy = false; }
    }

    // A turn's memory step can answer the open card (a name typed as free text): ask again which card is next and
    // drop the one already answered.
    let setupRefresh = null;
    function refreshSetup() {
      if (!setup.active || !setup.card || setupRefresh) return;
      setupRefresh = (async () => {
        try {
          const data = await json(await api(`/api/onboarding?lang=${LANG}`));
          const open = setup.card;
          if (!open || setup.busy || open.inert || !open.isConnected) return;
          if (data.card && data.card.step === open.dataset.step) return;
          setPicture(data.picture);
          if (data.card) showCard(data.card);
          else { open.remove(); setup.card = null; setSetupActive(false); }
        } catch (_) { /* the card stays; answering it still works */ } finally { setupRefresh = null; }
      })();
    }

    // After a model turn during setup, the open card follows the conversation to its end.
    function setupFollowsTurn() {
      if (!setup.active || !setup.node) return;
      messages.append(setup.node);
    }

    // ------------------------------------------------------------------ network

    async function refreshToken() {
      const response = await fetch(`/api/state?lang=${LANG}`, { credentials: 'same-origin', cache: 'no-store' });
      const state = await response.json().catch(() => ({}));
      if (response.ok && state.csrf_token) token = String(state.csrf_token);
      return state;
    }

    async function api(path, options = {}, retried = false) {
      const headers = Object.assign({}, options.headers || {}, { 'X-Wealth-Token': token });
      let response;
      try {
        response = await fetch(path, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, options, { headers }));
      } catch (err) {
        if (err && err.name === 'AbortError') throw err;
        const e = new Error(T.errors.connection); e.kind = 'connection'; throw e;
      }
      if (response.status === 403 && !retried) {
        // The server may have restarted with a new session token.
        try { await refreshToken(); } catch (_) { /* fall through */ }
        return api(path, options, true);
      }
      return response;
    }

    async function json(response) {
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const e = new Error(data.error || `Request failed (${response.status})`);
        e.kind = data.kind || (response.status === 409 ? 'busy' : response.status === 404 ? 'gone' : 'other');
        e.detail = data.detail || '';
        throw e;
      }
      return data;
    }

    // Read the server-sent-event stream with fetch so the session token travels in a header.
    async function stream(turnId, after, onEvent, signal) {
      const response = await api(`/api/turns/${turnId}/events?after=${after}`, { signal });
      if (!response.ok) await json(response);
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', done = false;
      while (!done) {
        const chunk = await reader.read();
        if (chunk.done) break;
        buffer += decoder.decode(chunk.value, { stream: true });
        let split;
        while ((split = buffer.indexOf('\n\n')) >= 0) {
          const block = buffer.slice(0, split);
          buffer = buffer.slice(split + 2);
          const data = block.split('\n').filter(l => l.startsWith('data: ')).map(l => l.slice(6)).join('\n');
          if (!data) continue;
          let event;
          try { event = JSON.parse(data); } catch (_) { continue; }
          onEvent(event);
          if (event.type === 'done') done = true;
        }
      }
      return done;
    }

    // ------------------------------------------------------------------ turns

    function setBusy(value) {
      busy = value;
      send.classList.toggle('stopping', value);
      send.setAttribute('aria-label', value ? T.stopResponse : T.send);
      send.type = value ? 'button' : 'submit';
      newChat.disabled = value;
      form.querySelectorAll('input[name="depth"]').forEach(r => { r.disabled = value; });
      depthToggle.disabled = value;
      if (value) openDepth(false);
      refreshSend();
    }

    // The depth menu: one quiet word naming the level; the choices open above it and close on choice, Escape or a tap outside.
    function openDepth(open) {
      depthMenu.hidden = !open;
      depthToggle.setAttribute('aria-expanded', String(open));
      if (open) (form.querySelector('input[name="depth"]:checked') || form.querySelector('input[name="depth"]')).focus();
    }
    function refreshDepth() {
      const level = depth();
      depthToggle.textContent = T[level] || level;
    }
    depthToggle.addEventListener('click', () => openDepth(depthMenu.hidden));
    depthMenu.addEventListener('change', () => { refreshDepth(); openDepth(false); depthToggle.focus(); });
    depthMenu.addEventListener('keydown', event => { if (event.key === 'Escape') { event.preventDefault(); openDepth(false); depthToggle.focus(); } });
    document.addEventListener('pointerdown', event => { if (!depthMenu.hidden && !event.target.closest('.depth-menu')) openDepth(false); });
    depthMenu.addEventListener('focusout', event => { if (!depthMenu.hidden && !event.relatedTarget?.closest?.('.depth-menu')) openDepth(false); });

    function refreshSend() {
      const uploading = pendingUploads.some(u => u.state === 'uploading');
      send.disabled = busy ? false : (uploading || (!input.value.trim() && !pendingUploads.some(u => u.state === 'ready')));
    }

    function resize() {
      input.style.height = 'auto';
      input.style.height = `${Math.min(input.scrollHeight, window.innerHeight * 0.4)}px`;
      refreshSend();
    }

    function finish(turn) {
      clearPending(turn.pendingNode);
      if (current === turn) current = null;
      if (current) return;  // a newer turn already started while this one was saving
      setBusy(false);
      setupFollowsTurn();
      if (!coarse.matches && (document.activeElement === document.body || document.activeElement === send)) input.focus();
    }

    // A failed reveal is retried as the person's own short request; anything else re-sends what they wrote.
    const retryFor = turn => turn.internal ? () => submit(S.revealRetry) : () => submit(turn.message, turn.attachments, turn.userNode);

    function handle(turn, event) {
      turn.after = Math.max(turn.after || 0, event.seq || 0);
      if (event.type === 'progress' && turn.pendingNode) {
        if (!turn.stopping) setStep(turn.pendingNode, event.text);
      } else if (event.type === 'delta') {
        if (!turn.stopping) streamDelta(turn.pendingNode, event);
      } else if (event.type === 'memory') {
        turn.memoryEvent = event;
        refreshSetup();
        if (turn.answerNode) {
          // Saved after the answer was shown: add the quiet line to that answer.
          const remembered = memoryPhrase(event.items, turn.lang || LANG, { event });
          turn.answerNode.querySelector('p.memory')?.remove();
          if (remembered) turn.answerNode.append(tagLang(el('p', 'memory', remembered), turn.lang || LANG));
        } else if (turn.pendingNode && !turn.stopping) setPresence(turn.pendingNode._mark, 'remembering');
      } else if (event.type === 'views') {
        turn.views = Array.isArray(event.items) ? event.items : [];  // drawn with the answer that places them
      } else if (event.type === 'answer') {
        clearPending(turn.pendingNode);
        turn.pendingNode = null;
        const m = event.message || {};
        turn.answerNode = assistantMessage(m.content || '', { memory: m.memory, memoryEvent: turn.memoryEvent, message: m, lang: turn.lang, announce: true, views: m.views || turn.views });
        turn.answered = true;
        follow();
        loadOrders();
        // The answer is the end of the wait; saving continues quietly in the background.
        if (current === turn) { current = null; setBusy(false); setupFollowsTurn(); }
      } else if (event.type === 'error') {
        clearPending(turn.pendingNode);
        turn.pendingNode = null;
        turn.failed = true;
        const stopped = event.kind === 'cancelled' && event.stopped;
        if (stopped && typeof stopped.content === 'string') {
          // What was already written stays, as a saved message, with a quiet Stopped line under it.
          turn.answerNode = assistantMessage(stopped.content, { memory: stopped.memory, message: stopped, lang: turn.lang,
                                                                stopped: true, retry: retryFor(turn) });
          follow();
        } else {
          showError(turn.userNode, event, retryFor(turn));
        }
      } else if (event.type === 'done') {
        finish(turn);
        refreshSetup();
      }
    }

    async function track(turn) {
      turn.abort = new AbortController();
      for (let attempt = 0; attempt < 3; attempt += 1) {
        try {
          const done = await stream(turn.id, turn.after || 0, event => handle(turn, event), turn.abort.signal);
          if (done) return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
          if (err && err.kind === 'gone') break;
        }
        // The stream dropped: poll until the turn is visible again, then reattach.
        if (await poll(turn)) return;
      }
      if (current === turn) {
        clearPending(turn.pendingNode);
        showError(turn.userNode, { kind: 'gone', message: T.errors.gone }, retryFor(turn));
        finish(turn);
      }
    }

    async function poll(turn) {
      for (let i = 0; i < 40; i += 1) {
        await new Promise(r => setTimeout(r, 1500));
        if (current !== turn) return true;
        let state;
        try { state = await refreshToken(); } catch (_) { continue; }
        if (!state || !state.csrf_token) continue;
        if (state.turn && state.turn.id === turn.id && state.turn.status === 'running') return false;
        // Finished while we were disconnected: replay from the server's record.
        const replay = (state.messages || []).slice(-1)[0];
        if (!state.turn && replay && replay.role === 'assistant' && !turn.answered) {
          handle(turn, { type: 'answer', message: replay });
          handle(turn, { type: 'done' });
          return true;
        }
        if (state.turn && state.turn.id === turn.id && state.turn.error) {
          handle(turn, Object.assign({ type: 'error' }, state.turn.error));
          handle(turn, { type: 'done' });
          return true;
        }
        return false;
      }
      return false;
    }

    async function submit(text, attachments = null, existingNode = null) {
      const message = String(text || '').trim();
      const files = attachments || pendingUploads.filter(u => u.state === 'ready').map(u => u.meta);
      if (busy || (!message && !files.length)) return;
      if (!attachments && !existingNode && !files.length && setup.active && setup.card) {
        // During setup a typed reply answers the open card when it reads as one; anything else is a real turn.
        input.value = ''; resize();
        if (await answerByText(message)) return;
      }
      // The person's words and the working line are on screen before anything leaves it (the intro, the Hoy lines):
      // nothing they see goes blank while the request starts.
      const userNode = existingNode || userMessage(message || T.attachedOnly, files);
      const alert = userNode.querySelector('.alert');
      if (alert) alert.remove();
      const turn = { message, attachments: files, userNode, after: 0, lang: languageOf(message) };
      turn.pendingNode = pendingMessage('', turn.lang);
      removeIntro();
      if (!attachments) {
        input.value = '';
        pendingUploads = [];
        tray.replaceChildren();
        resize();
      }
      current = turn;
      setBusy(true);
      follow(true);
      try {
        const response = await api('/api/turns', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, reasoning: depth(), attachments: files.map(f => f.id), timezone: timezone() })
        });
        const data = await json(response);
        turn.id = data.turn.id;
      } catch (err) {
        clearPending(turn.pendingNode);
        showError(userNode, { kind: err.kind || 'other', message: err.message, detail: err.detail }, () => submit(message, files, userNode));
        finish(turn);
        return;
      }
      track(turn);
    }

    async function stop() {
      const turn = current;
      if (!turn || !turn.id || turn.stopping) return;
      turn.stopping = true;
      if (turn.pendingNode) {
        turn.pendingNode._step.textContent = STRINGS[turn.pendingNode._lang].stopping;
        setPresence(turn.pendingNode._mark, 'quiet');
        turn.pendingNode.classList.add('stopping');
      }
      try { await api(`/api/turns/${turn.id}/cancel`, { method: 'POST' }); } catch (_) { /* the stream reports the outcome */ }
    }

    // ------------------------------------------------------------------ attachments

    function typeFor(file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      return UPLOAD_TYPES[ext] || (Object.values(UPLOAD_TYPES).includes(file.type) ? file.type : '');
    }

    function renderTray() {
      tray.replaceChildren();
      pendingUploads.forEach(upload => {
        const chip = el('span', `chip${upload.state === 'error' ? ' error' : ''}`);
        chip.append(svg('M7 3h7l5 5v13H7zM14 3v5h5', 15));
        chip.append(el('span', 'name', upload.name));
        chip.append(el('span', 'meta', upload.state === 'error' ? upload.error : upload.state === 'uploading' ? T.uploading : formatSize(upload.size)));
        const remove = el('button');
        remove.type = 'button';
        remove.setAttribute('aria-label', T.remove(upload.name));
        remove.append(svg('M6 6l12 12M18 6 6 18', 12));
        remove.addEventListener('click', () => { pendingUploads = pendingUploads.filter(u => u !== upload); renderTray(); refreshSend(); });
        chip.append(remove);
        tray.append(chip);
      });
      refreshSend();
    }

    async function addFiles(fileList) {
      for (const file of Array.from(fileList || [])) {
        if (pendingUploads.length >= 5) break;
        const upload = { name: file.name, size: file.size, state: 'uploading' };
        pendingUploads.push(upload);
        const type = typeFor(file);
        if (!type) { Object.assign(upload, { state: 'error', error: T.badType }); continue; }
        if (file.size > uploadLimit) { Object.assign(upload, { state: 'error', error: T.tooBig }); continue; }
        if (!file.size) { Object.assign(upload, { state: 'error', error: T.empty }); continue; }
        renderTray();
        try {
          const response = await api('/api/upload', {
            method: 'POST', body: file,
            headers: { 'Content-Type': type, 'X-Filename': encodeURIComponent(file.name) }
          });
          const data = await json(response);
          Object.assign(upload, { state: 'ready', meta: data.upload, name: data.upload.name });
        } catch (err) {
          Object.assign(upload, { state: 'error', error: err.message && err.message.length < 60 && LANG === 'en' ? err.message : T.uploadFailed });
        }
        renderTray();
      }
      renderTray();
    }

    attachButton.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

    let dragDepth = 0;
    const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', e => { if (!hasFiles(e) || !token) return; e.preventDefault(); dragDepth += 1; drop.classList.add('active'); });
    window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
    window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.classList.remove('active'); });
    window.addEventListener('drop', e => {
      if (!hasFiles(e)) return;
      e.preventDefault(); dragDepth = 0; drop.classList.remove('active');
      if (token) addFiles(e.dataTransfer.files);
    });

    // ------------------------------------------------------------------ composer

    input.addEventListener('input', resize);
    input.addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
      if (event.shiftKey || event.altKey) return;
      if (coarse.matches && !event.metaKey && !event.ctrlKey) return; // touch keyboards: Enter is a newline
      event.preventDefault();
      if (!busy) form.requestSubmit();
    });
    form.addEventListener('submit', event => { event.preventDefault(); if (!busy) submit(input.value); });
    send.addEventListener('click', event => { if (busy) { event.preventDefault(); stop(); } });

    newChat.addEventListener('click', async () => {
      if (busy) return;
      newChat.disabled = true;
      try {
        const state = await json(await api('/api/reset', { method: 'POST' }));
        pendingUploads = []; renderTray();
        messages.replaceChildren();
        setup.node = null; setup.card = null; setSetupActive(false);
        const onboarding = state.onboarding || {};
        if (onboarding.active && onboarding.mode === 'flow') startSetup(onboarding, state);
        else renderIntro(state);
        input.value = ''; resize();
        if (!coarse.matches) input.focus();
      } catch (err) {
        live.textContent = err.message;
      } finally {
        newChat.disabled = busy;
      }
    });

    // ------------------------------------------------------------------ today (Hoy) and hand-offs from other pages

    // At most three dated lines above the composer. Tapping one asks its next step; × dismisses it until its
    // trigger changes; "Later" hides it for seven days. With a mouse those two appear on hover; on touch they sit
    // behind one "⋯" per line. Strings live here so the chrome table stays untouched.
    const HOY = {
      en: { region: 'Today', later: 'Later', laterLabel: title => `Remind me in 7 days: ${title}`, dismissText: 'Dismiss',
        dismiss: title => `Dismiss: ${title}`, more: title => `Options: ${title}`, rest: n => `${n} more`,
        today: 'today', tomorrow: 'tomorrow', failed: 'That could not be saved. Try again.' },
      es: { region: 'Hoy', later: 'Más tarde', laterLabel: title => `Recordármelo en 7 días: ${title}`, dismissText: 'Descartar',
        dismiss: title => `Descartar: ${title}`, more: title => `Opciones: ${title}`, rest: n => `${n} más`,
        today: 'hoy', tomorrow: 'mañana', failed: 'No se pudo guardar. Intenta de nuevo.' }
    }[LANG];
    const hoyTouch = window.matchMedia('(hover: none), (pointer: coarse), (max-width: 560px)');
    const HOY_SHARE = 0.3;  // the lines never take more than about 30% of the screen on touch
    let hoyNode = null;

    function hoyDue(item) {
      if (!item.due || typeof item.days !== 'number') return null;
      if (item.days === 0) return HOY.today;
      if (item.days === 1) return HOY.tomorrow;
      const [y, m, d] = String(item.due).split('-').map(Number);
      try { return new Intl.DateTimeFormat(localeOf(LANG), { day: 'numeric', month: 'short', timeZone: 'UTC' }).format(new Date(Date.UTC(y, m - 1, d, 12))).replace('.', ''); } catch (_) { return null; }
    }

    function hoyClose(except) {
      if (!hoyNode) return;
      hoyNode.querySelectorAll('li.open').forEach(li => {
        if (li === except) return;
        li.classList.remove('open');
        const more = li.querySelector('.hoy-more');
        if (more) more.setAttribute('aria-expanded', 'false');
      });
    }

    // The value to set in weight. The server's span is a hint; the figure it lands on is what gets bold, whole:
    // an offset that falls inside "1.8" or "$48,000" (a stale index, another language's text) still bolds the value.
    function hoyEmphasis(title, span) {
      let [a, b] = Array.isArray(span) ? span.map(Number) : [0, 0];
      if (!(b > a && a >= 0 && b <= title.length)) return null;
      const at = i => (i >= 0 && i < title.length ? title[i] : ' ');
      const digit = i => /\d/.test(at(i));
      const inNumber = i => digit(i) || (/[.,]/.test(at(i)) && digit(i - 1) && digit(i + 1));
      const word = i => /[\p{L}\p{N}]/u.test(at(i));
      while (a < b && /\s/.test(at(a))) a += 1;
      while (b > a && /\s/.test(at(b - 1))) b -= 1;
      // A start inside a number backs up to its first digit; a start inside a word skips to the next word.
      if (inNumber(a) && inNumber(a - 1)) { while (inNumber(a - 1)) a -= 1; }
      else if (word(a - 1) && word(a)) { while (a < b && word(a)) a += 1; while (a < b && /\s/.test(at(a))) a += 1; }
      if (/[$€£]/.test(at(a - 1))) a -= 1;
      // An end inside a number or a word runs to its last character; a percent sign belongs to its number.
      if ((inNumber(b - 1) && inNumber(b)) || (word(b - 1) && word(b))) { while (inNumber(b) || word(b)) b += 1; }
      if (at(b) === '%') b += 1;
      return a < b ? [a, b] : null;
    }

    function hoyLine(item, index) {
      const title = String((item.title || {})[LANG] || '');
      const ask = String((item.next_step || {})[LANG] || '');
      const line = el('li');
      const go = el('button', 'hoy-go');
      go.type = 'button';
      const mark = el('span', `hoy-mark ${['act', 'consider'].includes(item.severity) ? item.severity : ''}`);
      mark.setAttribute('aria-hidden', 'true');
      const words = el('span', 'hoy-text');
      const text = el('span', 'hoy-title');
      const span = hoyEmphasis(title, ((item.emphasis || {})[LANG] || [])[0]);
      if (span) text.append(title.slice(0, span[0]), el('b', '', title.slice(span[0], span[1])), title.slice(span[1]));
      else text.textContent = title;
      words.append(text);
      const due = hoyDue(item);
      // The date is shown once: a title that already names its day ("antes del 31 de dic") carries no tag.
      const named = due && new RegExp(`\\b${due.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+(?:de\\s+)?')}\\b`, 'i').test(title);
      if (due && !named) { const time = el('time', 'hoy-due', due); time.dateTime = String(item.due); words.append(time); }
      words.title = title;
      go.append(mark, words);
      go.addEventListener('click', () => { if (!busy && ask) submit(ask); });
      line.append(go);
      if (!hoyTouch.matches) {
        // A mouse: Later and Dismiss appear on the line being pointed at or focused.
        const later = el('button', 'hoy-later', HOY.later);
        later.type = 'button';
        later.setAttribute('aria-label', HOY.laterLabel(title));
