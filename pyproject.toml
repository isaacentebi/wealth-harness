[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wealth-harness"
version = "0.2.0"
description = "Evidence-backed client memory and decision tools for agentic wealth management"
requires-python = ">=3.11"
dependencies = ["mcp>=2.2,<3", "yfinance>=0.2.50", "pandas>=2", "numpy>=1.26", "scipy>=1.12", "statsmodels>=0.14", "openpyxl>=3.1", "pypdf>=5"]

[project.optional-dependencies]
mcp = []
analytics = []
dev = ["pytest>=8,<10", "scikit-learn>=1.5"]

[project.scripts]
wealth = "wealth.cli:main"
wealth-mcp = "wealth.server:main"
wealth-agent = "wealth.agent:main"
wealth-chat = "wealth.web:main"

[tool.hatch.build.targets.wheel]
packages = ["wealth"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]


[tool.hatch.build.targets.sdist]
include = [
  "/wealth", "/examples", "/tests", "/tools", "/README.md", "/SKILL.md",
  "/DESIGN.md", "/docs/product.md", "/docs/verification.md", "/docs/open-source.md", "/docs/providers.md", "/docs/agent.md",
  "/references/playbook.md", "/pyproject.toml", "/uv.lock",
]
