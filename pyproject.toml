[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wealth-harness"
version = "0.2.0"
description = "Wealth: a local-first personal financial adviser for Mexico and the US, with deterministic engines under an AI"
readme = "README.md"
authors = [{ name = "Isaac Entebi" }]
requires-python = ">=3.11"
keywords = ["personal-finance", "wealth-management", "mcp", "mexico", "tax", "portfolio", "retirement", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["mcp>=2.2,<3", "yfinance>=0.2.50", "pandas>=2", "numpy>=1.26", "scipy>=1.12", "statsmodels>=0.14", "openpyxl>=3.1", "pypdf>=5"]

[project.urls]
Homepage = "https://github.com/isaacentebi/wealth-harness"
Repository = "https://github.com/isaacentebi/wealth-harness"
Issues = "https://github.com/isaacentebi/wealth-harness/issues"
Documentation = "https://github.com/isaacentebi/wealth-harness/tree/main/docs"
Security = "https://github.com/isaacentebi/wealth-harness/blob/main/SECURITY.md"

[project.optional-dependencies]
images = ["pillow>=10"]
dev = ["pytest>=8,<10", "scikit-learn>=1.5", "fpdf2>=2.8", "reportlab>=4.2"]

[project.scripts]
wealth = "wealth.cli:main"
wealth-mcp = "wealth.server:main"
wealth-agent = "wealth.agent:main"
wealth-chat = "wealth.web:main"

[tool.hatch.build.targets.wheel]
packages = ["wealth"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]


[tool.hatch.build.targets.sdist]
include = [
  "/wealth", "/examples", "/tests", "/tools", "/README.md", "/SKILL.md",
  "/CONTRIBUTING.md", "/SECURITY.md", "/docs", "/integrations",
  "/references/playbook.md", "/.github/workflows/check.yml", "/pyproject.toml", "/uv.lock",
]
exclude = ["/docs/notes"]
